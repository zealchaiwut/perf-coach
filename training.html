<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training – perf-coach</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* ── Tabs ── */
    .tab-bar {
      display: flex;
      gap: 0;
      border-bottom: 2px solid #e5e5e5;
      margin-bottom: 1.5rem;
    }

    .training-tab {
      padding: 0.6rem 1.25rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      font-size: 0.9375rem;
      cursor: pointer;
      color: #666;
      font-weight: 500;
    }

    .training-tab.active {
      color: #1a1a1a;
      border-bottom-color: #1a1a1a;
    }

    .training-tab:hover:not(.active) {
      color: #333;
    }

    /* ── Metadata block ── */
    .workout-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem 1.25rem;
      margin-bottom: 1.5rem;
      max-width: 680px;
    }

    .meta-field {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .meta-field.full-width {
      grid-column: 1 / -1;
    }

    .meta-field label {
      font-size: 0.8125rem;
      font-weight: 600;
      color: #444;
    }

    .meta-field input[type="text"],
    .meta-field input[type="date"],
    .meta-field input[type="number"],
    .meta-field textarea {
      padding: 0.45rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9375rem;
      font-family: inherit;
      background: #fff;
    }

    .meta-field input:focus,
    .meta-field textarea:focus {
      outline: none;
      border-color: #0070f3;
      box-shadow: 0 0 0 2px rgba(0,112,243,0.15);
    }

    .meta-field textarea {
      resize: vertical;
      min-height: 3.5rem;
    }

    .field-error {
      font-size: 0.8125rem;
      color: #c0392b;
      min-height: 1.1em;
    }

    /* ── Type chips ── */
    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .type-chip {
      padding: 0.3rem 0.85rem;
      border: 1px solid #ccc;
      border-radius: 999px;
      background: #fff;
      font-size: 0.875rem;
      cursor: pointer;
      color: #444;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
    }

    .type-chip:hover {
      border-color: #999;
    }

    .type-chip.active {
      background: #1a1a1a;
      border-color: #1a1a1a;
      color: #fff;
    }

    #custom-type-input {
      margin-top: 0.4rem;
      padding: 0.4rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.875rem;
      width: 100%;
      box-sizing: border-box;
    }

    #custom-type-input:focus {
      outline: none;
      border-color: #0070f3;
      box-shadow: 0 0 0 2px rgba(0,112,243,0.15);
    }

    /* ── Exercises table ── */
    .exercises-section {
      margin-bottom: 1.5rem;
    }

    .section-label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #444;
      margin: 0 0 0.5rem;
    }

    .table-scroll {
      overflow-x: auto;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
    }

    #exercises-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
    }

    #exercises-table th {
      text-align: left;
      font-size: 0.8125rem;
      color: #666;
      font-weight: 600;
      padding: 0.5rem 0.6rem;
      border-bottom: 1px solid #e5e5e5;
      white-space: nowrap;
      background: #fafafa;
    }

    #exercises-table td {
      padding: 0.35rem 0.4rem;
      border-bottom: 1px solid #f0f0f0;
      vertical-align: middle;
    }

    #exercises-table tbody tr:last-child td {
      border-bottom: none;
    }

    #exercises-table tbody tr.dragging {
      opacity: 0.4;
    }

    #exercises-table tbody tr.drag-over {
      background: #eff6ff;
    }

    .drag-handle {
      cursor: grab;
      color: #bbb;
      font-size: 1rem;
      padding: 0 0.4rem;
      user-select: none;
      text-align: center;
      width: 1.5rem;
    }

    .drag-handle:active { cursor: grabbing; }

    .ex-input {
      padding: 0.35rem 0.5rem;
      border: 1px solid transparent;
      border-radius: 4px;
      font-size: 0.9rem;
      font-family: inherit;
      background: transparent;
      width: 100%;
      box-sizing: border-box;
    }

    .ex-input:hover {
      border-color: #ddd;
    }

    .ex-input:focus {
      outline: none;
      border-color: #0070f3;
      background: #fff;
      box-shadow: 0 0 0 2px rgba(0,112,243,0.12);
    }

    .ex-name { min-width: 140px; }
    .ex-sets, .ex-reps, .ex-rpe { width: 4rem; text-align: center; }
    .ex-weight { width: 5.5rem; }
    .ex-duration { width: 5.5rem; }

    .remove-row-btn {
      background: none;
      border: none;
      color: #bbb;
      cursor: pointer;
      font-size: 0.875rem;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
    }

    .remove-row-btn:hover {
      color: #c0392b;
      background: #fee2e2;
    }

    .error-msg {
      font-size: 0.8125rem;
      color: #c0392b;
      min-height: 1.2em;
      margin: 0.4rem 0 0;
    }

    /* ── Table action buttons ── */
    .table-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }

    .table-actions button {
      padding: 0.4rem 1rem;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 4px;
      font-size: 0.875rem;
      cursor: pointer;
      color: #1a1a1a;
    }

    .table-actions button:hover:not(:disabled) {
      background: #f5f5f5;
    }

    .table-actions button:disabled {
      color: #aaa;
      border-color: #e5e5e5;
      cursor: not-allowed;
    }

    /* ── Form actions ── */
    .form-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      max-width: 680px;
      flex-wrap: wrap;
    }

    .form-actions-right {
      display: flex;
      gap: 0.5rem;
    }

    /* ── History view ── */
    .history-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1rem;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      margin-bottom: 0.5rem;
      cursor: pointer;
      background: #fff;
      transition: background 0.1s, border-color 0.1s;
    }

    .history-row:hover {
      background: #f8f9ff;
      border-color: #b3c0f0;
    }

    .history-main {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .history-name {
      font-weight: 600;
      font-size: 0.9375rem;
    }

    .history-meta {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      font-size: 0.8125rem;
      color: #6b7280;
    }

    .history-chevron {
      font-size: 1.25rem;
      color: #ccc;
      flex-shrink: 0;
    }

    .empty-msg {
      color: #9ca3af;
      font-size: 0.9375rem;
    }

    .loading-msg {
      color: #9ca3af;
      font-size: 0.9375rem;
    }

    /* ── Detail modal ── */
    .detail-box {
      background: #fff;
      border-radius: 8px;
      padding: 1.5rem;
      max-width: 680px;
      width: 95%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.25rem;
    }

    .detail-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0;
    }

    .detail-close {
      background: none;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      color: #999;
      padding: 0 0.25rem;
      line-height: 1;
    }

    .detail-close:hover { color: #333; }

    .detail-meta-text {
      font-size: 0.875rem;
      color: #6b7280;
      margin: 0 0 1rem;
    }

    .detail-table-scroll {
      overflow-x: auto;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      margin-bottom: 1rem;
    }

    .detail-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 420px;
    }

    .detail-table th {
      text-align: left;
      font-size: 0.8125rem;
      color: #666;
      font-weight: 600;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #e5e5e5;
      background: #fafafa;
    }

    .detail-table td {
      padding: 0.55rem 0.75rem;
      border-bottom: 1px solid #f0f0f0;
      font-size: 0.9rem;
    }

    .detail-table tbody tr:last-child td { border-bottom: none; }

    .detail-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.65rem 1.5rem;
      border-radius: 6px;
      font-size: 0.9375rem;
      font-weight: 500;
      z-index: 9999;
      display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }

    #toast.toast-ok {
      background: #1a1a1a;
      color: #fff;
    }

    #toast.toast-error {
      background: #c0392b;
      color: #fff;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .workout-meta {
        grid-template-columns: 1fr;
      }
      .meta-field.full-width {
        grid-column: 1;
      }
      .form-actions {
        flex-direction: column;
        align-items: stretch;
      }
      .form-actions-right {
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Training</h1>
    <span id="env-label" class="env-label"></span>
  </header>
  <nav class="main-nav">
    <a href="home.html">Home</a>
    <a href="calendar.html">Calendar</a>
    <a href="weight.html">Weight</a>
    <a href="habits.html">Habits</a>
    <a href="training.html" class="active">Training</a>
    <a href="trends.html">Trends</a>
  </nav>

  <main>
    <!-- Sub-tabs -->
    <div class="tab-bar">
      <button class="training-tab active" data-tab="new">New workout</button>
      <button class="training-tab" data-tab="history">History</button>
    </div>

    <!-- ── New workout view ── -->
    <div id="view-new">
      <!-- Metadata block -->
      <div class="workout-meta">
        <div class="meta-field">
          <label for="workout-name">Name <span style="color:#c0392b">*</span></label>
          <input id="workout-name" type="text" placeholder="e.g. Morning Strength" maxlength="200" autocomplete="off">
          <p id="name-error" class="field-error"></p>
        </div>

        <div class="meta-field">
          <label for="workout-date">Date</label>
          <input id="workout-date" type="date">
        </div>

        <div class="meta-field full-width">
          <label>Workout type</label>
          <div id="type-chips" class="chip-group"></div>
          <input id="custom-type-input" type="text" placeholder="Type name…" style="display:none" maxlength="50">
        </div>

        <div class="meta-field">
          <label for="workout-remarks">Remarks</label>
          <textarea id="workout-remarks" placeholder="Optional notes…" rows="2" maxlength="1000"></textarea>
        </div>

        <div class="meta-field">
          <label for="workout-tss">TSS <span style="font-weight:400;color:#999">(optional)</span></label>
          <input id="workout-tss" type="number" min="0" step="1" placeholder="e.g. 85">
        </div>
      </div>

      <!-- Exercise table -->
      <div class="exercises-section">
        <p class="section-label">Exercises</p>
        <div class="table-scroll">
          <table id="exercises-table">
            <thead>
              <tr>
                <th></th>
                <th>Exercise</th>
                <th>Sets</th>
                <th>Reps</th>
                <th>Weight (kg)</th>
                <th>Duration</th>
                <th>RPE</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="exercises-tbody"></tbody>
          </table>
        </div>
        <p id="exercises-error" class="error-msg"></p>
        <div class="table-actions">
          <button id="add-exercise-btn" type="button">+ Add exercise</button>
          <button id="add-section-btn" type="button" disabled title="Coming in sprint-5">+ Add section (Cooldown, Extra, WOD…)</button>
        </div>
      </div>

      <!-- Form action bar -->
      <div class="form-actions">
        <div>
          <button id="save-template-btn" type="button" disabled title="Coming in sprint-5" class="btn-secondary">Save as template</button>
        </div>
        <div class="form-actions-right">
          <button id="cancel-btn" type="button" class="btn-secondary">Cancel</button>
          <button id="save-workout-btn" type="button" class="btn-primary">Save workout</button>
        </div>
      </div>

      <p style="margin-top:1.5rem"><a href="index.html">Back</a> &middot; <a href="habits.html">Habits</a> &middot; <a href="users.html">Users</a></p>
    </div>

    <!-- ── History view ── -->
    <div id="view-history" style="display:none">
      <div id="history-list"></div>
      <p style="margin-top:1.5rem"><a href="index.html">Back</a> &middot; <a href="habits.html">Habits</a> &middot; <a href="users.html">Users</a></p>
    </div>
  </main>

  <!-- Detail modal -->
  <div id="detail-modal" class="modal-overlay" style="display:none" role="dialog" aria-modal="true">
    <div class="detail-box">
      <div class="detail-header">
        <h2 id="detail-title" class="detail-title"></h2>
        <button id="detail-close-btn" class="detail-close" title="Close">✕</button>
      </div>
      <p id="detail-meta" class="detail-meta-text"></p>
      <div class="detail-table-scroll">
        <table class="detail-table">
          <thead>
            <tr>
              <th>Exercise</th>
              <th>Sets</th>
              <th>Reps</th>
              <th>Weight</th>
              <th>Duration</th>
              <th>RPE</th>
            </tr>
          </thead>
          <tbody id="detail-exercises-tbody"></tbody>
        </table>
      </div>
      <div class="detail-actions">
        <button id="detail-delete-btn" type="button" class="btn-sm btn-delete">Delete</button>
        <button id="detail-edit-btn" type="button" class="btn-sm">Edit</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="js/training.js"></script>
  <script src="js/user.js"></script>
  <script src="js/env.js"></script>
</body>
</html>
