<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings – perf-coach</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .settings-layout {
      display: flex;
      min-height: calc(100vh - 57px);
    }

    /* ── Sidebar ── */
    .settings-sidebar {
      width: 200px;
      flex-shrink: 0;
      border-right: 1px solid #e5e5e5;
      background: #fff;
      padding: 24px 0;
    }

    .settings-sidebar nav {
      display: flex;
      flex-direction: column;
    }

    .settings-nav-item {
      display: block;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 500;
      color: #444;
      text-decoration: none;
      cursor: pointer;
      border: none;
      background: none;
      text-align: left;
      width: 100%;
      font-family: inherit;
      transition: background 0.1s, color 0.1s;
    }

    .settings-nav-item:hover {
      background: #f5f5f5;
      color: #1a1a1a;
    }

    .settings-nav-item.active {
      background: #f0f4ff;
      color: #1a1a1a;
      font-weight: 600;
    }

    /* ── Content area ── */
    .settings-content {
      flex: 1;
      padding: 32px 40px;
      max-width: 720px;
    }

    .settings-section {
      display: none;
    }

    .settings-section.active {
      display: block;
    }

    .settings-section h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a1a;
      margin: 0 0 16px;
      letter-spacing: -0.01em;
    }

    .settings-placeholder {
      font-size: 14px;
      color: #9ca3af;
      padding: 20px;
      border: 1px dashed #e5e5e5;
      border-radius: 8px;
      background: #fafafa;
    }

    /* ── Responsive: <880px sidebar → horizontal tab strip ── */
    @media (max-width: 880px) {
      .settings-layout {
        flex-direction: column;
      }

      .settings-sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #e5e5e5;
        padding: 0;
      }

      .settings-sidebar nav {
        flex-direction: row;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .settings-nav-item {
        white-space: nowrap;
        padding: 12px 16px;
        border-bottom: 2px solid transparent;
        flex-shrink: 0;
      }

      .settings-nav-item.active {
        background: none;
        border-bottom-color: #1a1a1a;
      }

      .settings-content {
        padding: 24px 16px;
      }
    }
  </style>
</head>
<body>
  <script src="/js/nav.js"></script>
  <script src="/js/env.js"></script>

  <div class="settings-layout">
    <aside class="settings-sidebar">
      <nav>
        <button class="settings-nav-item" data-section="profile">Profile</button>
        <button class="settings-nav-item" data-section="thresholds">Performance Thresholds</button>
        <button class="settings-nav-item" data-section="personal-records">Personal Records</button>
        <button class="settings-nav-item" data-section="integrations">Integrations</button>
        <button class="settings-nav-item" data-section="about">About</button>
      </nav>
    </aside>

    <div class="settings-content">
      <div id="section-profile" class="settings-section">
        <h1>Profile</h1>
        <p class="settings-placeholder">Coming up in this sprint</p>
      </div>

      <div id="section-thresholds" class="settings-section">
        <h1>Performance Thresholds</h1>
        <p class="settings-placeholder">Coming up in this sprint</p>
      </div>

      <div id="section-personal-records" class="settings-section">
        <h1>Personal Records</h1>
        <p class="settings-placeholder">Coming up in this sprint</p>
      </div>

      <div id="section-integrations" class="settings-section">
        <h1>Integrations</h1>
        <p class="settings-placeholder">Coming up in this sprint</p>
      </div>

      <div id="section-about" class="settings-section">
        <h1>About</h1>
        <p class="settings-placeholder">Coming up in this sprint</p>
      </div>
    </div>
  </div>

  <script src="/js/user.js"></script>
  <script src="/js/settings.js"></script>
</body>
</html>
