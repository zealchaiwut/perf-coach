<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings – perf-coach</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .settings-page {
      max-width: 640px;
      margin: 40px auto;
      padding: 0 24px;
      font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .settings-page h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0b1530;
      margin: 0 0 32px;
      letter-spacing: -0.02em;
    }

    .settings-section {
      border: 1px solid rgba(13, 30, 67, 0.08);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      background: #fff;
    }

    .settings-section h2 {
      font-size: 15px;
      font-weight: 600;
      color: #0b1530;
      margin: 0 0 12px;
      letter-spacing: -0.01em;
    }

    .settings-section p {
      font-size: 13.5px;
      color: #8b95ad;
      margin: 0;
    }

    .settings-save-btn {
      padding: 9px 20px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      font-family: inherit;
      background: #0b1530;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
      text-decoration: none;
      display: inline-block;
    }
    .settings-save-btn:hover { opacity: 0.85; }
    .settings-save-btn:disabled { opacity: 0.5; cursor: default; }

    .settings-feedback {
      margin-top: 10px;
      font-size: 13px;
      min-height: 18px;
    }
    .settings-feedback.success { color: #15803d; }
    .settings-feedback.error   { color: #b91c1c; }

    .avatar-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 8px;
    }

    .settings-avatar-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffb88a, #d97a3a);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 28px;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }

    .settings-avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      position: absolute;
      top: 0;
      left: 0;
    }

    .settings-avatar-circle span {
      position: relative;
    }

    .avatar-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #avatar-file-input { display: none; }

    .avatar-remove-btn {
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      color: #b91c1c;
      background: none;
      border: 1.5px solid rgba(185, 28, 28, 0.25);
      cursor: pointer;
      display: none;
    }
    .avatar-remove-btn:hover { background: rgba(185, 28, 28, 0.05); }
    .avatar-remove-btn:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <script src="/js/nav.js"></script>
  <div class="settings-page">
    <h1>Settings</h1>

    <div class="settings-section">
      <h2>Profile</h2>
      <div class="avatar-row">
        <div class="settings-avatar-circle" id="settings-avatar-circle" aria-label="Your avatar">
          <img id="settings-avatar-img" alt="Your avatar">
          <span id="settings-avatar-initials">U</span>
        </div>
        <div class="avatar-actions">
          <label class="settings-save-btn" for="avatar-file-input">Upload Photo</label>
          <input type="file" id="avatar-file-input" accept="image/jpeg,image/png,image/webp">
          <button class="avatar-remove-btn" id="avatar-remove-btn" type="button">Remove</button>
        </div>
      </div>
      <div class="settings-feedback" id="avatar-feedback" aria-live="polite"></div>
    </div>

    <div class="settings-section">
      <h2>Security</h2>
      <p>Security settings coming soon.</p>
    </div>

    <div class="settings-section">
      <h2>Integrations</h2>
      <p>Integrations settings coming soon.</p>
    </div>
  </div>
  <script src="/js/user.js"></script>
  <script>
    (function () {
      var _userId = null;

      function showFeedback(id, msg, type) {
        var el = document.getElementById(id);
        if (!el) return;
        el.textContent = msg;
        el.className = 'settings-feedback ' + type;
      }

      function clearFeedback(id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.textContent = '';
        el.className = 'settings-feedback';
      }

      function loadAvatarDisplay(bust) {
        var img = document.getElementById('settings-avatar-img');
        var initials = document.getElementById('settings-avatar-initials');
        var removeBtn = document.getElementById('avatar-remove-btn');
        if (!img || !_userId) return;
        var src = '/api/users/' + _userId + '/avatar' + (bust ? '?_t=' + Date.now() : '');
        img.onload = function () {
          img.style.display = 'block';
          if (initials) initials.style.display = 'none';
          if (removeBtn) removeBtn.style.display = '';
        };
        img.onerror = function () {
          img.style.display = 'none';
          if (initials) initials.style.display = '';
          if (removeBtn) removeBtn.style.display = 'none';
        };
        img.src = src;
      }

      window.addEventListener('userReady', function (e) {
        _userId = e.detail.userId;
        var initialsEl = document.getElementById('settings-avatar-initials');
        if (initialsEl && e.detail.userName) {
          initialsEl.textContent = (e.detail.userName.trim().charAt(0) || 'U').toUpperCase();
        }
        loadAvatarDisplay(false);
      });

      document.getElementById('avatar-file-input').addEventListener('change', function () {
        var file = this.files[0];
        if (!file) return;
        clearFeedback('avatar-feedback');
        var fd = new FormData();
        fd.append('file', file);
        this.value = '';
        fetch('/api/users/me/avatar', { method: 'POST', body: fd })
          .then(function (res) {
            if (!res.ok) return res.json().then(function (d) { return Promise.reject(d.detail || 'Upload failed'); });
            loadAvatarDisplay(true);
            if (window.navRefreshAvatar) window.navRefreshAvatar();
          })
          .catch(function (err) {
            showFeedback('avatar-feedback', typeof err === 'string' ? err : 'Upload failed', 'error');
          });
      });

      document.getElementById('avatar-remove-btn').addEventListener('click', function () {
        var btn = this;
        clearFeedback('avatar-feedback');
        btn.disabled = true;
        fetch('/api/users/me/avatar', { method: 'DELETE' })
          .then(function (res) {
            btn.disabled = false;
            if (res.ok || res.status === 204) {
              var img = document.getElementById('settings-avatar-img');
              var initials = document.getElementById('settings-avatar-initials');
              if (img) img.style.display = 'none';
              if (initials) initials.style.display = '';
              btn.style.display = 'none';
              if (window.navRefreshAvatar) window.navRefreshAvatar();
            } else {
              showFeedback('avatar-feedback', 'Failed to remove avatar', 'error');
            }
          })
          .catch(function () {
            btn.disabled = false;
            showFeedback('avatar-feedback', 'Network error — try again', 'error');
          });
      });
    }());
  </script>
</body>
</html>
