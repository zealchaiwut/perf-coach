<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings – perf-coach</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .settings-page {
      max-width: 640px;
      margin: 40px auto;
      padding: 0 24px;
      font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .settings-page h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0b1530;
      margin: 0 0 32px;
      letter-spacing: -0.02em;
    }

    .settings-section {
      border: 1px solid rgba(13, 30, 67, 0.08);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      background: #fff;
    }

    .settings-section h2 {
      font-size: 15px;
      font-weight: 600;
      color: #0b1530;
      margin: 0 0 12px;
      letter-spacing: -0.01em;
    }

    .settings-section p {
      font-size: 13.5px;
      color: #8b95ad;
      margin: 0;
    }

    .settings-save-btn {
      padding: 9px 20px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      font-family: inherit;
      background: #0b1530;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
      text-decoration: none;
      display: inline-block;
    }
    .settings-save-btn:hover { opacity: 0.85; }
    .settings-save-btn:disabled { opacity: 0.5; cursor: default; }

    .settings-feedback {
      margin-top: 10px;
      font-size: 13px;
      min-height: 18px;
    }
    .settings-feedback.success { color: #15803d; }
    .settings-feedback.error   { color: #b91c1c; }

    .avatar-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 8px;
    }

    .settings-avatar-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffb88a, #d97a3a);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 28px;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }

    .settings-avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      position: absolute;
      top: 0;
      left: 0;
    }

    .settings-avatar-circle span {
      position: relative;
    }

    .profile-form-group {
      margin-bottom: 14px;
    }

    .profile-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: #0b1530;
      margin-bottom: 5px;
      letter-spacing: 0.01em;
    }

    .profile-input,
    .profile-select {
      width: 100%;
      box-sizing: border-box;
      padding: 9px 11px;
      border: 1px solid rgba(13, 30, 67, 0.15);
      border-radius: 8px;
      font-size: 13.5px;
      font-family: inherit;
      color: #0b1530;
      background: #fff;
      outline: none;
      transition: border-color 0.15s;
    }
    .profile-input:focus,
    .profile-select:focus { border-color: #0b1530; }
    .profile-input[readonly] {
      background: #f8f9fb;
      color: #8b95ad;
      cursor: default;
    }

    .profile-field-error {
      font-size: 12px;
      color: #b91c1c;
      margin-top: 4px;
      min-height: 16px;
    }

    .profile-actions-row {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    @media (max-width: 480px) {
      .profile-input,
      .profile-select { font-size: 16px; }
      .profile-actions-row { flex-direction: column; align-items: stretch; }
      .profile-actions-row .settings-save-btn { width: 100%; text-align: center; }
    }

    .integration-card {
      border: 1px solid rgba(13, 30, 67, 0.08);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      background: #fafafa;
    }
    .integration-card:last-child { margin-bottom: 0; }

    .integration-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .integration-name {
      font-size: 14px;
      font-weight: 600;
      color: #0b1530;
    }

    .integration-badge {
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
    }
    .integration-badge--connected {
      background: #dcfce7;
      color: #15803d;
    }
    .integration-badge--disconnected {
      background: #f1f5f9;
      color: #64748b;
    }
    .integration-badge--unconfigured {
      background: #fef3c7;
      color: #92400e;
    }

    .integration-meta {
      font-size: 12.5px;
      color: #8b95ad;
      margin-bottom: 10px;
      min-height: 16px;
    }

    .integration-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .integration-btn {
      padding: 7px 14px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }
    .integration-btn:hover:not(:disabled) { opacity: 0.82; }
    .integration-btn:disabled { opacity: 0.45; cursor: default; }

    .integration-btn--primary {
      background: #0b1530;
      color: #fff;
    }
    .integration-btn--secondary {
      background: #f1f5f9;
      color: #0b1530;
      border: 1px solid rgba(13, 30, 67, 0.12);
    }
    .integration-btn--danger {
      background: none;
      color: #b91c1c;
      border: 1.5px solid rgba(185, 28, 28, 0.25);
    }
    .integration-btn--danger:hover:not(:disabled) { background: rgba(185, 28, 28, 0.05); }

    .integration-feedback {
      font-size: 12.5px;
      margin-top: 8px;
      min-height: 16px;
    }
    .integration-feedback.success { color: #15803d; }
    .integration-feedback.error   { color: #b91c1c; }

    .stryd-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }
    .stryd-form input {
      padding: 8px 10px;
      border: 1px solid rgba(13, 30, 67, 0.15);
      border-radius: 7px;
      font-size: 13px;
      font-family: inherit;
      color: #0b1530;
      background: #fff;
      outline: none;
    }
    .stryd-form input:focus { border-color: #0b1530; }
    .stryd-form input:disabled { background: #f8f9fb; color: #adb5c4; }
  </style>
</head>
<body>
  <script src="/js/nav.js"></script>
  <script src="/js/env.js"></script>
  <div class="settings-page">
    <h1>Settings</h1>

    <div class="settings-section" id="profile-section">
      <h2>Profile</h2>
      <!-- Avatar upload deferred to future sprint. -->
      <div class="avatar-row">
        <div class="settings-avatar-circle" id="settings-avatar-circle" aria-label="Your avatar">
          <span id="settings-avatar-initials">U</span>
        </div>
      </div>

      <div class="profile-form-group">
        <label class="profile-label" for="profile-display-name">Display name</label>
        <input type="text" id="profile-display-name" class="profile-input" placeholder="Loading…" autocomplete="name" maxlength="100">
        <div class="profile-field-error" id="profile-display-name-error" aria-live="polite"></div>
      </div>

      <div class="profile-form-group">
        <label class="profile-label" for="profile-email">Email</label>
        <input type="email" id="profile-email" class="profile-input" readonly>
        <div class="profile-field-error" id="profile-email-error" aria-live="polite"></div>
      </div>

      <div class="profile-form-group">
        <label class="profile-label" for="profile-timezone">Timezone</label>
        <select id="profile-timezone" class="profile-select">
          <option value="Asia/Bangkok">Asia/Bangkok</option>
          <option value="Asia/Singapore">Asia/Singapore</option>
          <option value="Asia/Tokyo">Asia/Tokyo</option>
          <option value="UTC">UTC</option>
          <option value="America/Los_Angeles">America/Los_Angeles</option>
          <option value="America/New_York">America/New_York</option>
          <option value="Europe/London">Europe/London</option>
          <option value="Europe/Berlin">Europe/Berlin</option>
          <option value="Australia/Sydney">Australia/Sydney</option>
        </select>
        <div class="profile-field-error" id="profile-timezone-error" aria-live="polite"></div>
      </div>

      <div class="profile-form-group">
        <label class="profile-label" for="profile-week-start">Week starts on</label>
        <select id="profile-week-start" class="profile-select">
          <option value="1">Monday</option>
          <option value="7">Sunday</option>
        </select>
        <div class="profile-field-error" id="profile-week-start-error" aria-live="polite"></div>
      </div>

      <div class="profile-actions-row">
        <button class="settings-save-btn" id="profile-save-btn" type="button" disabled>Save</button>
        <div class="settings-feedback" id="profile-feedback" aria-live="polite"></div>
      </div>
    </div>

    <div class="settings-section">
      <h2>Security</h2>
      <p>Security settings coming soon.</p>
    </div>

    <div class="settings-section">
      <h2>Integrations</h2>

      <!-- Strava -->
      <div class="integration-card" id="strava-card">
        <div class="integration-header">
          <span class="integration-name">Strava</span>
          <span class="integration-badge integration-badge--disconnected" id="strava-badge">Loading…</span>
        </div>
        <div class="integration-meta" id="strava-meta"></div>
        <div class="integration-actions" id="strava-actions"></div>
        <div class="integration-feedback" id="strava-feedback" aria-live="polite"></div>
      </div>

      <!-- Stryd -->
      <div class="integration-card" id="stryd-card">
        <div class="integration-header">
          <span class="integration-name">Stryd</span>
          <span class="integration-badge integration-badge--disconnected" id="stryd-badge">Loading…</span>
        </div>
        <div class="integration-meta" id="stryd-meta"></div>
        <div id="stryd-form-wrap"></div>
        <div class="integration-actions" id="stryd-actions"></div>
        <div class="integration-feedback" id="stryd-feedback" aria-live="polite"></div>
      </div>
    </div>
  </div>
  <script src="/js/user.js"></script>
  <script>
    (function () {
      // Profile section: display_name, email, timezone, week_start_day
      var _baseline = {};

      function _initials(displayName, email) {
        var src = (displayName || email || '').trim();
        if (!src) return 'U';
        var words = src.split(/\s+/).filter(Boolean);
        if (words.length >= 2) {
          return (words[0][0] + words[words.length - 1][0]).toUpperCase();
        }
        return src[0].toUpperCase();
      }

      function _currentValues() {
        return {
          display_name: document.getElementById('profile-display-name').value,
          timezone: document.getElementById('profile-timezone').value,
          week_start_day: parseInt(document.getElementById('profile-week-start').value, 10),
        };
      }

      function _isDirty() {
        var cur = _currentValues();
        return cur.display_name !== (_baseline.display_name || '')
          || cur.timezone !== (_baseline.timezone || 'Asia/Bangkok')
          || cur.week_start_day !== (_baseline.week_start_day || 1);
      }

      function _updateSaveBtn() {
        var btn = document.getElementById('profile-save-btn');
        if (btn) btn.disabled = !_isDirty();
      }

      function _clearFieldErrors() {
        ['profile-display-name-error', 'profile-timezone-error', 'profile-week-start-error']
          .forEach(function (id) {
            var el = document.getElementById(id);
            if (el) el.textContent = '';
          });
      }

      function _setFeedback(msg, type) {
        var el = document.getElementById('profile-feedback');
        if (!el) return;
        el.textContent = msg;
        el.className = 'settings-feedback' + (type ? ' ' + type : '');
      }

      function _loadPrefs() {
        fetch('/api/user-preferences')
          .then(function (r) { return r.json(); })
          .then(function (data) {
            var row = data.row || {};
            _baseline = {
              display_name: row.display_name || '',
              timezone: row.timezone || 'Asia/Bangkok',
              week_start_day: row.week_start_day || 1,
            };

            var dnEl = document.getElementById('profile-display-name');
            if (dnEl) {
              dnEl.value = _baseline.display_name;
              dnEl.placeholder = row.user_name || 'Display name';
            }

            var emailEl = document.getElementById('profile-email');
            if (emailEl) emailEl.value = row.user_email || '';

            var tzEl = document.getElementById('profile-timezone');
            if (tzEl) tzEl.value = _baseline.timezone;

            var wsEl = document.getElementById('profile-week-start');
            if (wsEl) wsEl.value = String(_baseline.week_start_day);

            var initialsEl = document.getElementById('settings-avatar-initials');
            if (initialsEl) {
              initialsEl.textContent = _initials(_baseline.display_name || row.user_name, row.user_email);
            }

            _updateSaveBtn();
          })
          .catch(function () {
            _setFeedback('Failed to load profile.', 'error');
          });
      }

      function _handleSave() {
        var btn = document.getElementById('profile-save-btn');
        _clearFieldErrors();
        _setFeedback('', '');

        var cur = _currentValues();
        var patch = {};
        if (cur.display_name !== (_baseline.display_name || '')) patch.display_name = cur.display_name;
        if (cur.timezone !== (_baseline.timezone || 'Asia/Bangkok')) patch.timezone = cur.timezone;
        if (cur.week_start_day !== (_baseline.week_start_day || 1)) patch.week_start_day = cur.week_start_day;

        if (!Object.keys(patch).length) return;

        if (btn) btn.disabled = true;
        fetch('/api/user-preferences', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(patch),
        })
          .then(function (r) {
            if (!r.ok) {
              return r.json().then(function (d) { return Promise.reject(d); });
            }
            return r.json();
          })
          .then(function (saved) {
            _baseline = {
              display_name: saved.display_name || '',
              timezone: saved.timezone || 'Asia/Bangkok',
              week_start_day: saved.week_start_day || 1,
            };
            var initialsEl = document.getElementById('settings-avatar-initials');
            if (initialsEl) {
              var emailEl = document.getElementById('profile-email');
              initialsEl.textContent = _initials(_baseline.display_name, emailEl ? emailEl.value : '');
            }
            _setFeedback('Saved.', 'success');
            _updateSaveBtn();
          })
          .catch(function (errData) {
            if (btn) btn.disabled = false;
            var detail = errData && errData.detail;
            if (Array.isArray(detail)) {
              detail.forEach(function (e) {
                var errEl = document.getElementById('profile-' + (e.field || '').replace(/_/g, '-') + '-error');
                if (errEl) errEl.textContent = e.msg || 'Invalid value';
              });
              _setFeedback('Fix the errors above and try again.', 'error');
            } else {
              _setFeedback(typeof detail === 'string' ? detail : 'Save failed.', 'error');
            }
          });
      }

      ['profile-display-name', 'profile-timezone', 'profile-week-start'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('input', _updateSaveBtn);
        if (el) el.addEventListener('change', _updateSaveBtn);
      });

      var saveBtn = document.getElementById('profile-save-btn');
      if (saveBtn) saveBtn.addEventListener('click', _handleSave);

      window.addEventListener('userReady', function () {
        _loadPrefs();
      });
    }());
  </script>
  <script>
    (function () {
      var _userId = null;

      function intFeedback(id, msg, type) {
        var el = document.getElementById(id);
        if (!el) return;
        el.textContent = msg;
        el.className = 'integration-feedback' + (type ? ' ' + type : '');
      }

      // ── Strava ─────────────────────────────────────────────────────────────

      function renderStravaUnconfigured() {
        document.getElementById('strava-badge').textContent = 'Not configured';
        document.getElementById('strava-badge').className = 'integration-badge integration-badge--unconfigured';
        document.getElementById('strava-meta').textContent = 'Strava OAuth has not been configured by the administrator.';
        document.getElementById('strava-actions').innerHTML = '';
      }

      function renderStravaDisconnected() {
        document.getElementById('strava-badge').textContent = 'Not connected';
        document.getElementById('strava-badge').className = 'integration-badge integration-badge--disconnected';
        document.getElementById('strava-meta').textContent = '';
        var actions = document.getElementById('strava-actions');
        actions.innerHTML = '';
        var btn = document.createElement('button');
        btn.className = 'integration-btn integration-btn--primary';
        btn.textContent = 'Connect Strava';
        btn.addEventListener('click', stravaConnect);
        actions.appendChild(btn);
      }

      function renderStravaConnected(athleteName, expiresAt) {
        document.getElementById('strava-badge').textContent = 'Connected';
        document.getElementById('strava-badge').className = 'integration-badge integration-badge--connected';
        var meta = athleteName ? 'Connected as ' + athleteName : 'Connected';
        if (expiresAt) {
          var exp = new Date(expiresAt);
          meta += ' · token expires ' + exp.toLocaleDateString();
        }
        document.getElementById('strava-meta').textContent = meta;

        var actions = document.getElementById('strava-actions');
        actions.innerHTML = '';

        var syncBtn = document.createElement('button');
        syncBtn.className = 'integration-btn integration-btn--secondary';
        syncBtn.id = 'strava-sync-btn';
        syncBtn.textContent = 'Sync Strava';
        syncBtn.addEventListener('click', stravaSync);

        var discBtn = document.createElement('button');
        discBtn.className = 'integration-btn integration-btn--danger';
        discBtn.id = 'strava-disconnect-btn';
        discBtn.textContent = 'Disconnect';
        discBtn.addEventListener('click', stravaDisconnect);

        actions.appendChild(syncBtn);
        actions.appendChild(discBtn);
      }

      function loadStravaStatus() {
        fetch('/api/strava/configured')
          .then(function (r) { return r.json(); })
          .then(function (cfg) {
            if (!cfg.configured) { renderStravaUnconfigured(); return; }
            return fetch('/api/strava/status')
              .then(function (r) { return r.json(); })
              .then(function (st) {
                if (st.connected) {
                  renderStravaConnected(st.athlete_name, st.expires_at);
                } else {
                  renderStravaDisconnected();
                }
              });
          })
          .catch(function () { renderStravaDisconnected(); });
      }

      function stravaConnect() {
        intFeedback('strava-feedback', '', '');
        fetch('/api/strava/connect')
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (!d.authorize_url) throw new Error('No authorize URL');
            var popup = window.open(d.authorize_url, 'strava_oauth', 'width=600,height=700');
            function onMsg(e) {
              if (e.data && e.data.type === 'strava_connected') {
                window.removeEventListener('message', onMsg);
                if (popup && !popup.closed) popup.close();
                intFeedback('strava-feedback', 'Strava connected!', 'success');
                loadStravaStatus();
              }
            }
            window.addEventListener('message', onMsg);
          })
          .catch(function (err) {
            intFeedback('strava-feedback', (err && err.message) || 'Failed to initiate Strava connection', 'error');
          });
      }

      function stravaSync() {
        var btn = document.getElementById('strava-sync-btn');
        var discBtn = document.getElementById('strava-disconnect-btn');
        intFeedback('strava-feedback', '', '');
        if (btn) btn.disabled = true;
        if (discBtn) discBtn.disabled = true;
        if (btn) btn.textContent = 'Syncing…';
        fetch('/api/strava/sync', { method: 'POST' })
          .then(function (r) {
            if (!r.ok) return r.json().then(function (d) { return Promise.reject(d.detail || 'Sync failed'); });
            return r.json();
          })
          .then(function (d) {
            intFeedback('strava-feedback', 'Synced ' + d.synced + ' activities.', 'success');
          })
          .catch(function (err) {
            intFeedback('strava-feedback', typeof err === 'string' ? err : 'Sync failed', 'error');
          })
          .finally(function () {
            if (btn) { btn.disabled = false; btn.textContent = 'Sync Strava'; }
            if (discBtn) discBtn.disabled = false;
          });
      }

      function stravaDisconnect() {
        var discBtn = document.getElementById('strava-disconnect-btn');
        var syncBtn = document.getElementById('strava-sync-btn');
        intFeedback('strava-feedback', '', '');
        if (discBtn) discBtn.disabled = true;
        if (syncBtn) syncBtn.disabled = true;
        fetch('/api/strava/disconnect', { method: 'DELETE' })
          .then(function (r) {
            if (!r.ok) return r.json().then(function (d) { return Promise.reject(d.detail || 'Disconnect failed'); });
            return r.json();
          })
          .then(function () {
            renderStravaDisconnected();
            intFeedback('strava-feedback', 'Strava disconnected.', 'success');
          })
          .catch(function (err) {
            if (discBtn) discBtn.disabled = false;
            if (syncBtn) syncBtn.disabled = false;
            intFeedback('strava-feedback', typeof err === 'string' ? err : 'Disconnect failed', 'error');
          });
      }

      // ── Stryd ──────────────────────────────────────────────────────────────

      function renderStrydUnconfigured() {
        document.getElementById('stryd-badge').textContent = 'Not configured';
        document.getElementById('stryd-badge').className = 'integration-badge integration-badge--unconfigured';
        document.getElementById('stryd-meta').textContent = 'Stryd integration has not been configured by the administrator.';
        document.getElementById('stryd-form-wrap').innerHTML = '';
        document.getElementById('stryd-actions').innerHTML = '';
      }

      function renderStrydDisconnected() {
        document.getElementById('stryd-badge').textContent = 'Not connected';
        document.getElementById('stryd-badge').className = 'integration-badge integration-badge--disconnected';
        document.getElementById('stryd-meta').textContent = '';

        document.getElementById('stryd-form-wrap').innerHTML =
          '<div class="stryd-form" id="stryd-cred-form">' +
          '<input type="email" id="stryd-email" placeholder="Stryd email" autocomplete="username">' +
          '<input type="password" id="stryd-password" placeholder="Stryd password" autocomplete="current-password">' +
          '</div>';

        var actions = document.getElementById('stryd-actions');
        actions.innerHTML = '';
        var btn = document.createElement('button');
        btn.className = 'integration-btn integration-btn--primary';
        btn.id = 'stryd-connect-btn';
        btn.textContent = 'Save credentials';
        btn.addEventListener('click', strydConnect);
        actions.appendChild(btn);
      }

      function renderStrydConnected(email, expiresAt) {
        document.getElementById('stryd-badge').textContent = 'Connected';
        document.getElementById('stryd-badge').className = 'integration-badge integration-badge--connected';
        var meta = email ? 'Connected as ' + email : 'Connected';
        if (expiresAt) {
          var exp = new Date(expiresAt);
          meta += ' · session expires ' + exp.toLocaleDateString();
        }
        document.getElementById('stryd-meta').textContent = meta;
        document.getElementById('stryd-form-wrap').innerHTML = '';

        var actions = document.getElementById('stryd-actions');
        actions.innerHTML = '';
        var btn = document.createElement('button');
        btn.className = 'integration-btn integration-btn--danger';
        btn.id = 'stryd-disconnect-btn';
        btn.textContent = 'Disconnect Stryd';
        btn.addEventListener('click', strydDisconnect);
        actions.appendChild(btn);
      }

      function loadStrydStatus() {
        fetch('/api/stryd/configured')
          .then(function (r) { return r.json(); })
          .then(function (cfg) {
            if (!cfg.configured) { renderStrydUnconfigured(); return; }
            return fetch('/api/stryd/status')
              .then(function (r) { return r.json(); })
              .then(function (st) {
                if (st.connected) {
                  renderStrydConnected(st.stryd_email, st.session_expires_at);
                } else {
                  renderStrydDisconnected();
                }
              });
          })
          .catch(function () { renderStrydDisconnected(); });
      }

      function strydConnect() {
        var btn = document.getElementById('stryd-connect-btn');
        var emailEl = document.getElementById('stryd-email');
        var pwEl = document.getElementById('stryd-password');
        intFeedback('stryd-feedback', '', '');
        var email = emailEl ? emailEl.value.trim() : '';
        var password = pwEl ? pwEl.value : '';
        if (!email || !password) {
          intFeedback('stryd-feedback', 'Enter email and password.', 'error');
          return;
        }
        if (btn) btn.disabled = true;
        if (emailEl) emailEl.disabled = true;
        if (pwEl) pwEl.disabled = true;
        fetch('/api/stryd/connect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password }),
        })
          .then(function (r) {
            if (!r.ok) return r.json().then(function (d) { return Promise.reject(d.detail || 'Connection failed'); });
            return r.json();
          })
          .then(function (d) {
            intFeedback('stryd-feedback', 'Stryd connected!', 'success');
            renderStrydConnected(d.stryd_user_email, null);
          })
          .catch(function (err) {
            if (btn) btn.disabled = false;
            if (emailEl) emailEl.disabled = false;
            if (pwEl) pwEl.disabled = false;
            intFeedback('stryd-feedback', typeof err === 'string' ? err : 'Connection failed', 'error');
          });
      }

      function strydDisconnect() {
        var btn = document.getElementById('stryd-disconnect-btn');
        intFeedback('stryd-feedback', '', '');
        if (btn) btn.disabled = true;
        fetch('/api/stryd/disconnect', { method: 'DELETE' })
          .then(function (r) {
            if (!r.ok) return r.json().then(function (d) { return Promise.reject(d.detail || 'Disconnect failed'); });
            return r.json();
          })
          .then(function () {
            renderStrydDisconnected();
            intFeedback('stryd-feedback', 'Stryd disconnected.', 'success');
          })
          .catch(function (err) {
            if (btn) btn.disabled = false;
            intFeedback('stryd-feedback', typeof err === 'string' ? err : 'Disconnect failed', 'error');
          });
      }

      window.addEventListener('userReady', function () {
        loadStravaStatus();
        loadStrydStatus();
      });
    }());
  </script>
</body>
</html>
