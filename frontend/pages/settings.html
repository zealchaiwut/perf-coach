<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings – perf-coach</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .settings-page {
      max-width: 640px;
      margin: 40px auto;
      padding: 0 24px;
      font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .settings-page h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0b1530;
      margin: 0 0 32px;
      letter-spacing: -0.02em;
    }

    .settings-section {
      border: 1px solid rgba(13, 30, 67, 0.08);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      background: #fff;
    }

    .settings-section h2 {
      font-size: 15px;
      font-weight: 600;
      color: #0b1530;
      margin: 0 0 12px;
      letter-spacing: -0.01em;
    }

    .settings-section p {
      font-size: 13.5px;
      color: #8b95ad;
      margin: 0;
    }
  </style>
</head>
<body>
  <script src="/js/nav.js"></script>
  <div class="settings-page">
    <h1>Settings</h1>

    <div class="settings-section">
      <h2>Profile</h2>
      <p>Profile settings coming soon.</p>
    </div>

    <div class="settings-section">
      <h2>Security</h2>
      <p>Security settings coming soon.</p>
    </div>

    <div class="settings-section">
      <h2>Integrations</h2>
      <p>Integrations settings coming soon.</p>
    </div>
  </div>
  <script src="/js/user.js"></script>
</body>
</html>
