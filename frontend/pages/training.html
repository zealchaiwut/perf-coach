<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training – perf-coach</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* ── Tabs ── */
    .tab-bar {
      display: flex;
      gap: 0;
      border-bottom: 2px solid var(--border);
      margin-bottom: 1.5rem;
    }

    .training-tab {
      padding: 0.6rem 1.25rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      font-size: 0.9375rem;
      cursor: pointer;
      color: #666;
      font-weight: 500;
    }

    .training-tab.active {
      color: var(--text);
      border-bottom-color: var(--text);
    }

    .training-tab:hover:not(.active) {
      color: #333;
    }

    /* ── Metadata block ── */
    .workout-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem 1.25rem;
      margin-bottom: 1.5rem;
      max-width: 680px;
    }

    .meta-field {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .meta-field.full-width {
      grid-column: 1 / -1;
    }

    .meta-field label {
      font-size: 0.8125rem;
      font-weight: 600;
      color: #444;
    }

    .meta-field input[type="text"],
    .meta-field input[type="date"],
    .meta-field input[type="number"],
    .meta-field textarea {
      padding: 0.45rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9375rem;
      font-family: inherit;
      background: #fff;
    }

    .meta-field input:focus,
    .meta-field textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--focus-ring);
    }

    .meta-field textarea {
      resize: vertical;
      min-height: 3.5rem;
    }

    .field-error {
      font-size: 0.8125rem;
      color: var(--danger);
      min-height: 1.1em;
    }

    /* ── Type chips ── */
    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .type-chip {
      padding: 0.3rem 0.85rem;
      border: 1px solid #ccc;
      border-radius: 999px;
      background: #fff;
      font-size: 0.875rem;
      cursor: pointer;
      color: #444;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
    }

    .type-chip:hover {
      border-color: #999;
    }

    .type-chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    #custom-type-input {
      margin-top: 0.4rem;
      padding: 0.4rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.875rem;
      width: 100%;
      box-sizing: border-box;
    }

    #custom-type-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--focus-ring);
    }

    /* ── Exercises table ── */
    .exercises-section {
      margin-bottom: 1.5rem;
    }

    .section-label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #444;
      margin: 0 0 0.5rem;
    }

    .table-scroll {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    #exercises-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
    }

    #exercises-table th {
      text-align: left;
      font-size: 0.8125rem;
      color: #666;
      font-weight: 600;
      padding: 0.5rem 0.6rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      background: var(--surface-2);
    }

    #exercises-table td {
      padding: 0.35rem 0.4rem;
      border-bottom: 1px solid #f0f0f0;
      vertical-align: middle;
    }

    #exercises-table tbody tr:last-child td {
      border-bottom: none;
    }

    #exercises-table tbody tr.dragging {
      opacity: 0.4;
    }

    #exercises-table tbody tr.drag-over {
      background: #eff6ff;
    }

    .drag-handle {
      cursor: grab;
      color: #bbb;
      font-size: 1rem;
      padding: 0 0.4rem;
      user-select: none;
      text-align: center;
      width: 1.5rem;
    }

    .drag-handle:active { cursor: grabbing; }

    .ex-input {
      padding: 0.35rem 0.5rem;
      border: 1px solid transparent;
      border-radius: 4px;
      font-size: 0.9rem;
      font-family: inherit;
      background: transparent;
      width: 100%;
      box-sizing: border-box;
    }

    .ex-input:hover {
      border-color: #ddd;
    }

    .ex-input:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 2px var(--focus-ring);
    }

    .ex-name { min-width: 140px; }
    .ex-sets, .ex-reps, .ex-rpe { width: 4rem; text-align: center; }
    .ex-weight { width: 5.5rem; }
    .ex-duration { width: 5.5rem; }

    .remove-row-btn {
      background: none;
      border: none;
      color: #bbb;
      cursor: pointer;
      font-size: 0.875rem;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
    }

    .remove-row-btn:hover {
      color: var(--danger);
      background: #fee2e2;
    }

    .error-msg {
      font-size: 0.8125rem;
      color: var(--danger);
      min-height: 1.2em;
      margin: 0.4rem 0 0;
    }

    /* ── Table action buttons ── */
    .table-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }

    .table-actions button {
      padding: 0.4rem 1rem;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 4px;
      font-size: 0.875rem;
      cursor: pointer;
      color: var(--text);
    }

    .table-actions button:hover:not(:disabled) {
      background: #f5f5f5;
    }

    .table-actions button:disabled {
      color: #aaa;
      border-color: var(--border);
      cursor: not-allowed;
    }

    /* ── Form actions ── */
    .form-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      max-width: 680px;
      flex-wrap: wrap;
    }

    .form-actions-right {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    /* Quiet tertiary action (Cancel) */
    .btn-quiet {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 0.875rem;
      cursor: pointer;
      padding: 0.45rem 0.75rem;
      border-radius: 4px;
    }

    .btn-quiet:hover { color: var(--text); background: var(--surface-2); }

    /* More menu (native details/summary dropdown) */
    .more-menu { position: relative; }

    .more-menu summary { list-style: none; }
    .more-menu summary::-webkit-details-marker { display: none; }

    .more-summary {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      user-select: none;
    }

    .more-menu[open] .more-summary {
      border-color: var(--primary);
    }

    .more-menu-list {
      position: absolute;
      bottom: calc(100% + 4px);
      left: 0;
      min-width: 14rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.12);
      padding: 0.3rem;
      z-index: 50;
      display: flex;
      flex-direction: column;
    }

    .more-menu-list button {
      background: none;
      border: none;
      text-align: left;
      font-size: 0.875rem;
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .more-menu-list button:hover { background: var(--surface-2); }

    /* ── Run details ── */
    .run-section {
      margin-bottom: 1.5rem;
      max-width: 680px;
    }

    .run-primary {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      align-items: flex-end;
      margin-bottom: 1rem;
    }

    .run-secondary {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      margin-bottom: 0.25rem;
    }

    .run-field {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .run-field label {
      font-size: 0.8125rem;
      font-weight: 600;
      color: #444;
    }

    .run-section input[type="number"] {
      padding: 0.45rem 0.6rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9375rem;
      font-family: inherit;
      background: #fff;
      box-sizing: border-box;
      font-variant-numeric: tabular-nums;
    }

    .run-section input[type="number"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--focus-ring);
    }

    /* Hide native number spinners for a cleaner numeric field */
    .run-section input[type="number"]::-webkit-outer-spin-button,
    .run-section input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .run-section input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

    .run-input-affix {
      display: flex;
      align-items: baseline;
      gap: 0.35rem;
    }

    .run-input-affix .affix {
      font-size: 0.8125rem;
      color: var(--text-sub);
    }

    /* Distance + duration are the loud inputs */
    #run-distance { width: 6rem; font-size: 1.05rem; }

    .run-duration {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .run-duration .dur-box {
      width: 3.1rem;
      text-align: center;
      font-size: 1.05rem;
    }

    .run-duration .dur-sep {
      font-size: 0.8125rem;
      color: var(--text-sub);
    }

    .run-pace-field { min-width: 6rem; }

    .run-pace {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      line-height: 1.6;
    }

    .run-pace.is-empty { color: var(--text-sub); font-weight: 600; }

    .run-secondary .run-input-affix input { width: 4.5rem; }

    /* Splits */
    .splits-block { margin-top: 0.75rem; }

    .splits-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      color: #444;
      padding: 0.3rem 0;
    }

    .splits-caret {
      font-size: 0.7rem;
      color: #888;
      transition: transform 0.15s ease-out;
    }

    .splits-toggle[aria-expanded="true"] .splits-caret { transform: rotate(90deg); }

    .splits-optional {
      font-weight: 400;
      color: var(--text-sub);
      font-size: 0.8125rem;
    }

    .splits-body { margin-top: 0.5rem; }

    #splits-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 460px;
    }

    #splits-table th {
      text-align: left;
      font-size: 0.8125rem;
      color: #666;
      font-weight: 600;
      padding: 0.5rem 0.6rem;
      border-bottom: 1px solid #e5e5e5;
      white-space: nowrap;
      background: #fafafa;
    }

    #splits-table td {
      padding: 0.3rem 0.4rem;
      border-bottom: 1px solid #f0f0f0;
      vertical-align: middle;
    }

    #splits-table tbody tr:last-child td { border-bottom: none; }

    .splits-idx { width: 2rem; text-align: center; color: var(--text-sub); }

    .split-input {
      padding: 0.35rem 0.5rem;
      border: 1px solid transparent;
      border-radius: 4px;
      font-size: 0.9rem;
      font-family: inherit;
      background: transparent;
      width: 100%;
      box-sizing: border-box;
      font-variant-numeric: tabular-nums;
    }

    .split-input:hover { border-color: #ddd; }

    .split-input:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 2px var(--focus-ring);
    }

    .split-dist { width: 5rem; }
    .split-time { width: 5rem; }
    .split-hr { width: 4.5rem; }
    .split-pace { color: var(--text); font-size: 0.9rem; font-variant-numeric: tabular-nums; white-space: nowrap; }

    .splits-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-top: 0.6rem;
      flex-wrap: wrap;
    }

    .splits-actions { display: flex; gap: 0.5rem; }

    .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8125rem; }

    .splits-sum { font-size: 0.8125rem; color: var(--text-sub); margin: 0; }
    .splits-sum.is-mismatch { color: var(--warning); }

    @media (max-width: 640px) {
      .run-primary, .run-secondary { gap: 1rem; }
      #run-distance, .run-duration .dur-box { font-size: 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .splits-caret { transition: none; }
    }

    /* ── History view ── */
    .history-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 0.5rem;
      cursor: pointer;
      background: #fff;
      transition: background 0.1s, border-color 0.1s;
    }

    .history-row:hover {
      background: #f8f9ff;
      border-color: #b3c0f0;
    }

    .history-main {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .history-name {
      font-weight: 600;
      font-size: 0.9375rem;
    }

    .history-meta {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      font-size: 0.8125rem;
      color: var(--text-sub);
    }

    .history-chevron {
      font-size: 1.25rem;
      color: #ccc;
      flex-shrink: 0;
    }

    .empty-msg {
      color: var(--text-sub);
      font-size: 0.9375rem;
    }

    .loading-msg {
      color: var(--text-sub);
      font-size: 0.9375rem;
    }

    /* ── Detail modal ── */
    .detail-box {
      background: #fff;
      border-radius: 8px;
      padding: 1.5rem;
      max-width: 680px;
      width: 95%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.25rem;
    }

    .detail-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0;
    }

    .detail-close {
      background: none;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      color: #999;
      padding: 0 0.25rem;
      line-height: 1;
    }

    .detail-close:hover { color: #333; }

    .detail-meta-text {
      font-size: 0.875rem;
      color: var(--text-sub);
      margin: 0 0 1rem;
    }

    .detail-table-scroll {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 1rem;
    }

    .detail-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 420px;
    }

    .detail-table th {
      text-align: left;
      font-size: 0.8125rem;
      color: #666;
      font-weight: 600;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
    }

    .detail-table td {
      padding: 0.55rem 0.75rem;
      border-bottom: 1px solid #f0f0f0;
      font-size: 0.9rem;
    }

    .detail-table tbody tr:last-child td { border-bottom: none; }

    .detail-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.65rem 1.5rem;
      border-radius: 6px;
      font-size: 0.9375rem;
      font-weight: 500;
      z-index: 9999;
      display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }

    #toast.toast-ok {
      background: var(--text);
      color: #fff;
    }

    #toast.toast-error {
      background: var(--danger);
      color: #fff;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .workout-meta {
        grid-template-columns: 1fr;
      }
      .meta-field.full-width {
        grid-column: 1;
      }
      .form-actions {
        flex-direction: column;
        align-items: stretch;
      }
      .form-actions-right {
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>

  <main>
    <!-- Sub-tabs -->
    <div class="tab-bar">
      <button class="training-tab active" data-tab="new">New workout</button>
      <button class="training-tab" data-tab="history">History</button>
    </div>

    <!-- ── New workout view ── -->
    <div id="view-new">
      <!-- Metadata block -->
      <div class="workout-meta">
        <div class="meta-field">
          <label for="workout-name">Name <span style="color:var(--danger)">*</span></label>
          <input id="workout-name" type="text" placeholder="e.g. Morning Strength" maxlength="200" autocomplete="off" list="workout-name-suggestions">
          <datalist id="workout-name-suggestions"></datalist>
          <p id="name-error" class="field-error"></p>
        </div>

        <div class="meta-field">
          <label for="workout-date">Date</label>
          <input id="workout-date" type="date">
        </div>

        <div class="meta-field full-width">
          <label>Workout type</label>
          <div id="type-chips" class="chip-group"></div>
          <input id="custom-type-input" type="text" placeholder="Type name…" style="display:none" maxlength="50">
        </div>

        <div class="meta-field">
          <label for="workout-remarks">Remarks</label>
          <textarea id="workout-remarks" placeholder="Optional notes…" rows="2" maxlength="1000"></textarea>
        </div>

        <div class="meta-field">
          <label for="workout-tss">TSS <span style="font-weight:400;color:#999">(optional)</span></label>
          <input id="workout-tss" type="number" min="0" step="1" placeholder="e.g. 85">
        </div>
      </div>

      <!-- ── Run details (shown only when workout type is a run) ── -->
      <div id="run-section" class="run-section" style="display:none">
        <p class="section-label">Run details</p>

        <div class="run-primary">
          <div class="run-field">
            <label for="run-distance">Distance</label>
            <div class="run-input-affix">
              <input id="run-distance" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.0">
              <span class="affix">km</span>
            </div>
          </div>

          <div class="run-field">
            <label for="run-dur-h">Duration</label>
            <div class="run-duration">
              <input id="run-dur-h" class="dur-box" type="number" inputmode="numeric" min="0" max="99" placeholder="0">
              <span class="dur-sep">h</span>
              <input id="run-dur-m" class="dur-box" type="number" inputmode="numeric" min="0" max="59" placeholder="0">
              <span class="dur-sep">m</span>
              <input id="run-dur-s" class="dur-box" type="number" inputmode="numeric" min="0" max="59" placeholder="0">
              <span class="dur-sep">s</span>
            </div>
          </div>

          <div class="run-field run-pace-field">
            <label>Avg pace</label>
            <output id="run-pace" class="run-pace">—</output>
          </div>
        </div>

        <div class="run-secondary">
          <div class="run-field">
            <label for="run-avg-hr">Avg HR</label>
            <div class="run-input-affix">
              <input id="run-avg-hr" type="number" inputmode="numeric" min="20" max="250" placeholder="—">
              <span class="affix">bpm</span>
            </div>
          </div>
          <div class="run-field">
            <label for="run-max-hr">Max HR</label>
            <div class="run-input-affix">
              <input id="run-max-hr" type="number" inputmode="numeric" min="20" max="250" placeholder="—">
              <span class="affix">bpm</span>
            </div>
          </div>
          <div class="run-field">
            <label for="run-elevation">Elevation gain</label>
            <div class="run-input-affix">
              <input id="run-elevation" type="number" inputmode="numeric" min="0" step="1" placeholder="—">
              <span class="affix">m</span>
            </div>
          </div>
        </div>

        <p id="run-error" class="field-error"></p>

        <!-- Splits (optional, collapsed) -->
        <div class="splits-block">
          <button id="splits-toggle" type="button" class="splits-toggle" aria-expanded="false" aria-controls="splits-body">
            <span class="splits-caret" aria-hidden="true">▸</span>
            <span>Splits</span>
            <span class="splits-optional">optional</span>
          </button>

          <div id="splits-body" class="splits-body" hidden>
            <div class="table-scroll">
              <table id="splits-table">
                <thead>
                  <tr>
                    <th class="splits-idx">#</th>
                    <th>Distance</th>
                    <th>Time</th>
                    <th>HR</th>
                    <th>Pace</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="splits-tbody"></tbody>
              </table>
            </div>
            <div class="splits-foot">
              <div class="splits-actions">
                <button id="add-split-btn" type="button" class="btn-secondary btn-sm">+ Add split</button>
                <button id="auto-km-btn" type="button" class="btn-secondary btn-sm">Auto km splits</button>
              </div>
              <p id="splits-sum" class="splits-sum"></p>
            </div>
          </div>
        </div>
      </div>

      <!-- Exercise table -->
      <div class="exercises-section">
        <p class="section-label">Exercises</p>
        <div class="table-scroll">
          <table id="exercises-table">
            <thead>
              <tr>
                <th></th>
                <th>Exercise</th>
                <th>Sets</th>
                <th>Reps</th>
                <th>Weight (kg)</th>
                <th>Duration</th>
                <th>RPE</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="exercises-tbody"></tbody>
          </table>
        </div>
        <datalist id="exercise-name-suggestions"></datalist>
        <p id="exercises-error" class="error-msg"></p>
        <div class="table-actions">
          <button id="add-exercise-btn" type="button">+ Add exercise</button>
        </div>
      </div>

      <!-- Form action bar: one primary action; utilities live in the More menu -->
      <div class="form-actions">
        <details id="more-menu" class="more-menu">
          <summary class="btn-secondary more-summary">More <span aria-hidden="true">▾</span></summary>
          <div class="more-menu-list" role="menu">
            <button id="repeat-last-btn" type="button" role="menuitem">Repeat last workout</button>
            <button id="template-picker-btn" type="button" role="menuitem">Start from template</button>
            <button id="save-template-btn" type="button" role="menuitem">Save as template</button>
          </div>
        </details>
        <div class="form-actions-right">
          <button id="cancel-btn" type="button" class="btn-quiet">Cancel</button>
          <button id="save-workout-btn" type="button" class="btn-primary">Save workout</button>
        </div>
      </div>

      <p style="margin-top:1.5rem"><a href="/home">Back</a> &middot; <a href="/habits">Habits</a> &middot; <a href="/users">Users</a></p>
    </div>

    <!-- ── History view ── -->
    <div id="view-history" style="display:none">
      <div id="history-list"></div>
      <p style="margin-top:1.5rem"><a href="/home">Back</a> &middot; <a href="/habits">Habits</a> &middot; <a href="/users">Users</a></p>
    </div>
  </main>

  <!-- Template picker modal -->
  <div id="template-modal" class="modal-overlay" style="display:none" role="dialog" aria-modal="true">
    <div class="detail-box" style="max-width:420px">
      <div class="detail-header">
        <h2 class="detail-title">Start from template</h2>
        <button id="template-modal-close" class="detail-close" title="Close">✕</button>
      </div>
      <div id="template-list" style="margin-top:0.75rem"></div>
    </div>
  </div>

  <!-- Detail modal -->
  <div id="detail-modal" class="modal-overlay" style="display:none" role="dialog" aria-modal="true">
    <div class="detail-box">
      <div class="detail-header">
        <h2 id="detail-title" class="detail-title"></h2>
        <button id="detail-close-btn" class="detail-close" title="Close">✕</button>
      </div>
      <p id="detail-meta" class="detail-meta-text"></p>
      <div class="detail-table-scroll">
        <table class="detail-table">
          <thead>
            <tr>
              <th>Exercise</th>
              <th>Sets</th>
              <th>Reps</th>
              <th>Weight</th>
              <th>Duration</th>
              <th>RPE</th>
            </tr>
          </thead>
          <tbody id="detail-exercises-tbody"></tbody>
        </table>
      </div>
      <div class="detail-actions">
        <button id="detail-delete-btn" type="button" class="btn-sm btn-delete">Delete</button>
        <button id="detail-edit-btn" type="button" class="btn-sm">Edit</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="js/nav.js"></script>
  <script src="js/ui-states.js"></script>
  <script src="js/training.js"></script>
  <script src="js/user.js"></script>
  <script src="js/env.js"></script>
</body>
</html>
