<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin – perf-coach</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/tabler-icons.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100vh; }
    body {
      font-family: 'Inter Tight', system-ui, sans-serif;
      background: #f0f4fb;
      color: #0b1530;
      letter-spacing: -0.01em;
    }

    .topbar {
      background: #0b1530;
      color: #fff;
      padding: 0 28px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.02em;
    }
    .topbar-brand i { font-size: 18px; color: #6e90f0; }
    .topbar-tag {
      font-size: 11px;
      font-weight: 600;
      background: #1f3b8a;
      border-radius: 6px;
      padding: 2px 8px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .logout-btn {
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.2);
      color: #fff;
      border-radius: 8px;
      padding: 6px 14px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .logout-btn:hover { background: rgba(255,255,255,0.08); }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 24px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 4px;
      letter-spacing: -0.025em;
    }
    .subtitle { color: #5c6886; font-size: 14px; margin: 0 0 32px; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 2px 12px rgba(11,21,48,0.07);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: box-shadow 0.15s, transform 0.15s;
    }
    .card:hover { box-shadow: 0 4px 20px rgba(11,21,48,0.12); transform: translateY(-1px); }
    .card-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #eef2fb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #2b4ca8;
    }
    .card-title {
      font-size: 15px;
      font-weight: 600;
    }
    .card-desc {
      font-size: 13px;
      color: #5c6886;
    }
  </style>
</head>
<body>
<div class="topbar">
  <div class="topbar-brand">
    <i class="ti ti-shield-lock" aria-hidden="true"></i>
    perf-coach
    <span class="topbar-tag">Admin</span>
  </div>
  <button class="logout-btn" id="logout-btn">
    <i class="ti ti-logout" aria-hidden="true"></i>
    Log out
  </button>
</div>

<div class="container">
  <h1>Admin dashboard</h1>
  <p class="subtitle">Server-enforced admin session active.</p>

  <div class="cards">
    <a href="/users" class="card">
      <div class="card-icon"><i class="ti ti-users" aria-hidden="true"></i></div>
      <div class="card-title">Users</div>
      <div class="card-desc">Manage user accounts.</div>
    </a>
  </div>
</div>

<script>
(function () {
  'use strict';
  document.getElementById('logout-btn').addEventListener('click', function () {
    fetch('/api/admin/logout', { method: 'POST' })
      .finally(function () {
        window.location.href = '/admin';
      });
  });
}());
</script>
</body>
</html>
