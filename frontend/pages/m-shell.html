<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3b8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Coach</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/m.css?v=0.2.0">
</head>
<body class="m-app">
  <header class="m-head">
    <div>
      <div class="m-title" id="m-title">Today</div>
      <span class="m-sub" id="m-sub">from this phone</span>
    </div>
    <button type="button" class="m-pill" id="m-pill" aria-label="Sync status">Synced</button>
  </header>
  <div class="m-toast" id="m-toast" hidden></div>
  <main class="m-main" id="m-main"></main>
  <div class="m-sheet-backdrop" id="m-sheet-backdrop" hidden></div>
  <div class="m-sheet" id="m-sheet" role="dialog" aria-labelledby="m-sheet-title" hidden>
    <span class="m-sheet-handle"></span>
    <div>
      <h2 id="m-sheet-title">Waiting to sync</h2>
      <p class="m-muted">Saved on this phone. They go up as soon as the server answers.</p>
    </div>
    <div id="m-sheet-list"></div>
    <div class="m-wake" id="m-sheet-wake" hidden>
      <div>
        <div><strong>Waking the server…</strong></div>
        <div class="m-muted">Free tier sleeps; this takes up to a minute.</div>
      </div>
      <span class="m-mono" id="m-wake-elapsed">0 s</span>
    </div>
    <div id="m-sheet-conflicts"></div>
    <button type="button" class="m-keep" id="m-sheet-keep">Keep using the app</button>
  </div>
  <script src="/js/lib/app-common.js"></script>
  <script src="/js/m/store.js?v=0.2.0"></script>
  <script src="/js/m/sync.js?v=0.2.0"></script>
  <script src="/js/m/status.js?v=0.2.0"></script>
  <script src="/js/m/today.js?v=0.2.0"></script>
  <script src="/js/m/gym.js?v=0.2.0"></script>
  <script src="/js/m/timer.js?v=0.2.0"></script>
  <script src="/js/m/body.js?v=0.2.0"></script>
  <script src="/js/m/tss.js?v=0.2.0"></script>
  <script src="/js/m/shell.js?v=0.2.0"></script>
</body>
</html>
