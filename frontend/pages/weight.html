<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weight – perf-coach</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* ── Layout ───────────────────────────────────────────────────────────── */
    .weight-page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .weight-page-header h1 {
      margin: 0 0 0.25rem;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .page-subtitle {
      margin: 0;
      font-size: 0.875rem;
      color: #6b7280;
    }

    .header-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-shrink: 0;
    }

    .btn-secondary {
      padding: 0.4rem 0.9rem;
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      color: #374151;
      cursor: pointer;
    }
    .btn-secondary:hover { background: #f9fafb; }

    .btn-primary {
      padding: 0.4rem 0.9rem;
      background: #1a1a1a;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      color: #fff;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary:hover { background: #333; }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .card h2 {
      margin: 0 0 1rem;
      font-size: 0.9375rem;
      font-weight: 600;
      color: #374151;
    }

    .card-subtitle {
      font-size: 0.75rem;
      font-weight: 400;
      color: #9ca3af;
    }

    /* ── Hero strip ───────────────────────────────────────────────────────── */
    .hero-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.875rem;
      margin-bottom: 1.25rem;
    }

    .hero-cell {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 1rem 1.125rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .hero-label {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #9ca3af;
    }

    .hero-value {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.1;
      color: #111827;
    }

    .hero-value.mono {
      font-variant-numeric: tabular-nums;
    }

    .hero-value.small {
      font-size: 1.375rem;
    }

    /* Delta pills */
    .delta-pills {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-top: 0.2rem;
    }

    .delta-pill {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.8125rem;
      font-weight: 600;
      width: fit-content;
    }

    .delta-pill.loss {
      background: #dcfce7;
      color: #15803d;
    }

    .delta-pill.gain {
      background: #fee2e2;
      color: #dc2626;
    }

    .delta-pill.neutral {
      background: #f3f4f6;
      color: #6b7280;
    }

    /* Quick-log */
    .quicklog-form {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.35rem;
    }

    .quicklog-input {
      width: 5.5rem;
      padding: 0.4rem 0.6rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.9375rem;
      font-variant-numeric: tabular-nums;
    }
    .quicklog-input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,0.15);
    }

    .quicklog-btn {
      padding: 0.4rem 0.7rem;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .quicklog-btn:hover { background: #333; }
    .quicklog-btn:disabled { opacity: 0.55; cursor: default; }

    .quicklog-error {
      font-size: 0.75rem;
      color: #dc2626;
      min-height: 1em;
      margin-top: 0.2rem;
    }

    /* ── Chart card ───────────────────────────────────────────────────────── */
    .range-tabs {
      display: inline-flex;
      border: 1px solid #e5e7eb;
      border-radius: 7px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .range-tab {
      padding: 0.35rem 0.85rem;
      background: #fff;
      border: none;
      border-right: 1px solid #e5e7eb;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      color: #6b7280;
      line-height: 1.5;
    }
    .range-tab:last-child { border-right: none; }
    .range-tab:hover:not(.active) { background: #f9fafb; }
    .range-tab.active {
      background: #1a1a1a;
      color: #fff;
    }

    .chart-container {
      position: relative;
      width: 100%;
    }

    /* Legend chips */
    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 0.875rem;
    }

    .legend-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78125rem;
      color: #6b7280;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-line {
      width: 22px;
      height: 2px;
      flex-shrink: 0;
    }

    .legend-dashed {
      width: 22px;
      height: 0;
      border-top: 2px dashed;
      flex-shrink: 0;
    }

    /* ── Progress card ────────────────────────────────────────────────────── */
    .progress-bar-wrap {
      margin-bottom: 1.25rem;
    }

    .progress-bar-track {
      position: relative;
      height: 10px;
      background: #f3f4f6;
      border-radius: 999px;
      overflow: visible;
    }

    .progress-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: #2563eb;
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .progress-marker {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      background: #1a1a1a;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
      z-index: 2;
    }

    .progress-labels {
      position: relative;
      display: flex;
      justify-content: space-between;
      margin-top: 0.75rem;
    }

    .progress-label {
      font-size: 0.75rem;
      color: #6b7280;
      text-align: center;
    }

    .progress-label strong {
      display: block;
      font-size: 0.875rem;
      color: #111827;
      font-variant-numeric: tabular-nums;
    }

    .progress-stats {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .progress-pct {
      font-size: 2rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .progress-pct-label {
      font-size: 0.8125rem;
      color: #6b7280;
      margin-left: 0.2rem;
    }

    .kg-to-go {
      font-size: 0.875rem;
      color: #374151;
    }

    .status-pill {
      display: inline-block;
      padding: 0.2rem 0.7rem;
      border-radius: 999px;
      font-size: 0.8125rem;
      font-weight: 600;
    }

    .status-pill.on-track { background: #dcfce7; color: #15803d; }
    .status-pill.behind   { background: #fef3c7; color: #b45309; }
    .status-pill.ahead    { background: #dbeafe; color: #1d4ed8; }

    /* ── Milestones ───────────────────────────────────────────────────────── */
    .milestones-list {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
    }

    .milestone-item {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 0.875rem 1rem;
    }

    .milestone-label {
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #9ca3af;
      margin-bottom: 0.35rem;
    }

    .milestone-weight {
      font-size: 1.125rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #111827;
    }

    .milestone-date {
      font-size: 0.75rem;
      color: #9ca3af;
      margin-top: 0.2rem;
    }

    /* ── Bottom grid (progress + entries side by side) ─────────────────── */
    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      align-items: start;
      margin-bottom: 1.25rem;
    }

    .bottom-left-col {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .bottom-left-col .card {
      margin-bottom: 0;
    }

    .recent-entries-card {
      margin-bottom: 0;
    }

    .card-header-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .card-header-row h2 {
      margin: 0;
    }

    .view-all-link {
      font-size: 0.8125rem;
      color: #2563eb;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .view-all-link:hover { text-decoration: underline; }

    /* Missing-day rows */
    .missing-day-row td { opacity: 0.45; }

    /* Entry notes */
    .entry-notes {
      font-size: 0.75rem;
      color: #9ca3af;
      font-style: italic;
      margin-top: 0.15rem;
    }

    /* Mini-stepper */
    .mini-stepper {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      flex-wrap: wrap;
    }

    .stepper-btn {
      width: 1.625rem;
      height: 1.625rem;
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
    }
    .stepper-btn:hover { background: #e5e7eb; }

    .stepper-value {
      width: 4.5rem;
      text-align: center;
      padding: 0.2rem 0.4rem;
      border: 1px solid #2563eb;
      border-radius: 4px;
      font-size: 0.875rem;
      font-variant-numeric: tabular-nums;
    }

    .stepper-log-btn {
      padding: 0.2rem 0.65rem;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.8125rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .stepper-log-btn:hover { background: #333; }
    .stepper-log-btn:disabled { opacity: 0.55; cursor: default; }

    .stepper-error {
      font-size: 0.75rem;
      color: #dc2626;
      width: 100%;
    }

    /* Inline edit form (overflow menu -> Edit) */
    .entry-edit {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.5rem 0.875rem;
      background: none;
      border: none;
      font-size: 0.875rem;
      cursor: pointer;
      color: #374151;
    }
    .entry-edit:hover { background: #f9fafb; }

    .inline-edit-form {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .inline-save-btn {
      padding: 0.25rem 0.65rem;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.8125rem;
      cursor: pointer;
    }
    .inline-save-btn:hover { background: #333; }

    .inline-cancel-btn {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 0.8125rem;
      cursor: pointer;
    }

    /* ── Recent entries ───────────────────────────────────────────────────── */
    .entries-table {
      width: 100%;
      border-collapse: collapse;
    }

    .entries-table th {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #9ca3af;
      text-align: left;
      padding: 0 0 0.5rem;
      border-bottom: 1px solid #e5e7eb;
    }

    .entries-table td {
      padding: 0.6rem 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: 0.9375rem;
      vertical-align: middle;
    }

    .entries-table tr:last-child td { border-bottom: none; }

    .entry-row-today td { background: #eff6ff; }

    .entry-weight {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .entry-delta { font-size: 0.8125rem; }
    .entry-delta.loss { color: #15803d; }
    .entry-delta.gain { color: #dc2626; }
    .entry-delta.neutral { color: #9ca3af; }

    .entry-no-data {
      color: #9ca3af;
      font-size: 0.875rem;
    }

    /* Actions dropdown */
    .entry-actions-wrap {
      position: relative;
    }

    .entry-menu-btn {
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-size: 1.125rem;
      line-height: 1;
    }
    .entry-menu-btn:hover { background: #f3f4f6; color: #374151; }

    .entry-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 4px);
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 7px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      z-index: 50;
      min-width: 120px;
      overflow: hidden;
    }

    .entry-menu button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.5rem 0.875rem;
      background: none;
      border: none;
      font-size: 0.875rem;
      cursor: pointer;
      color: #374151;
    }
    .entry-menu button:hover { background: #f9fafb; }
    .entry-menu .menu-delete { color: #dc2626; }
    .entry-menu .menu-delete:hover { background: #fef2f2; }

    /* Backfill + button */
    .backfill-add-btn {
      background: none;
      border: 1px dashed #d1d5db;
      border-radius: 6px;
      color: #9ca3af;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 0.2rem 0.55rem;
    }
    .backfill-add-btn:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }

    /* Inline backfill form */
    .backfill-inline {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .backfill-input {
      width: 5rem;
      padding: 0.25rem 0.5rem;
      border: 1px solid #2563eb;
      border-radius: 5px;
      font-size: 0.875rem;
    }

    .backfill-save-btn {
      padding: 0.25rem 0.65rem;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 0.8125rem;
      cursor: pointer;
    }

    .backfill-cancel-btn {
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      font-size: 0.8125rem;
    }

    .backfill-error {
      font-size: 0.75rem;
      color: #dc2626;
    }

    /* ── Responsive < 880px ───────────────────────────────────────────────── */
    @media (max-width: 880px) {
      /* Hero: 4-col → 2-col */
      .hero-strip {
        grid-template-columns: repeat(2, 1fr);
      }

      /* Milestones: rows → horizontal-scroll cards */
      .milestones-list {
        display: flex;
        flex-direction: row;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        gap: 0.6rem;
        padding-bottom: 0.4rem;
        scroll-snap-type: x mandatory;
      }
      .milestone-item {
        flex: 0 0 140px;
        scroll-snap-align: start;
      }

      /* Recent entries: table → card-rows */
      .entries-table thead { display: none; }
      .entries-table,
      .entries-table tbody { display: block; }
      .entries-table tr {
        display: block;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 0.75rem;
        margin-bottom: 0.5rem;
      }
      .entries-table tr.entry-row-today { background: #eff6ff; }
      .entries-table td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.2rem 0;
        border-bottom: none;
        font-size: 0.875rem;
      }
      .entries-table td::before {
        content: attr(data-label);
        font-size: 0.6875rem;
        font-weight: 600;
        text-transform: uppercase;
        color: #9ca3af;
        letter-spacing: 0.04em;
      }
      .entry-card-row { }
    }

    /* ── Responsive bottom grid <= 820px (stack entries below progress) ─── */
    @media (max-width: 820px) {
      .bottom-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Error banner */
    #page-error {
      color: #dc2626;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <main>
    <p id="page-error" role="alert"></p>

    <!-- Page header -->
    <div class="weight-page-header">
      <div>
        <h1>Weight</h1>
        <p class="page-subtitle" id="page-subtitle">Loading…</p>
      </div>
      <div class="header-actions">
        <button class="btn-secondary" id="export-csv-btn" type="button">Export CSV</button>
        <a href="/weight/targets" class="btn-primary manage-target-btn">Manage target</a>
      </div>
    </div>

    <!-- Hero strip (4 cells) -->
    <div class="hero-strip" id="hero-strip">
      <div class="hero-cell" id="cell-current-weight">
        <div class="hero-label">Current weight</div>
        <div class="hero-value mono" id="current-weight-value">--</div>
      </div>
      <div class="hero-cell" id="cell-7day-avg">
        <div class="hero-label">7-day avg</div>
        <div class="hero-value mono small" id="avg-7d-value">--</div>
      </div>
      <div class="hero-cell" id="cell-deltas">
        <div class="hero-label">Change</div>
        <div class="delta-pills">
          <span class="delta-pill neutral" id="delta-week">This wk: --</span>
          <span class="delta-pill neutral" id="delta-month">This mo: --</span>
        </div>
      </div>
      <div class="hero-cell" id="cell-quicklog">
        <div class="hero-label">Log weight</div>
        <form class="quicklog-form" id="quicklog-form" novalidate>
          <input
            type="number" step="0.1" min="20" max="300"
            id="quicklog-input" class="quicklog-input"
            placeholder="kg" aria-label="Weight in kg"
          >
          <button type="submit" class="quicklog-btn">Log</button>
        </form>
        <div class="quicklog-error" id="quicklog-error" role="alert"></div>
      </div>
    </div>

    <!-- Chart card -->
    <div class="card chart-card">
      <div class="range-tabs" role="group" aria-label="Chart date range">
        <button class="range-tab active" data-range="30d" type="button">30D</button>
        <button class="range-tab" data-range="90d" type="button">90D</button>
        <button class="range-tab" data-range="6m" type="button">6M</button>
        <button class="range-tab" data-range="1y" type="button">1Y</button>
        <button class="range-tab" data-range="all" type="button">ALL</button>
      </div>
      <div class="chart-container">
        <!-- Loading chart… shown while Chart.js CDN script loads; hidden once chart renders -->
        <div id="chart-loading" style="text-align:center;padding:48px 0;color:#9ca3af;font-size:0.9375rem;">Loading chart…</div>
        <canvas id="weight-chart" aria-label="Weight trend chart" hidden></canvas>
      </div>
      <!-- Legend chips for 4 datasets -->
      <div class="chart-legend" id="chart-legend">
        <span class="legend-chip">
          <span class="legend-dot" style="background:#9ca3af"></span>Daily weigh-in
        </span>
        <span class="legend-chip">
          <span class="legend-line" style="background:#2563eb"></span>7-day moving avg
        </span>
        <span class="legend-chip" id="legend-target" hidden>
          <span class="legend-dashed" style="border-color:#16a34a"></span>Target
        </span>
        <span class="legend-chip" id="legend-projected" hidden>
          <span class="legend-dashed" style="border-color:#60a5fa"></span>Projected
        </span>
      </div>
    </div>

    <!-- Bottom grid: progress/milestones (left) + recent entries (right) -->
    <div class="bottom-grid">

      <!-- Left column: progress card + milestones (shown only if active target) -->
      <div class="bottom-left-col">
        <!-- Progress card -->
        <div class="card" id="progress-card" hidden>
          <h2>Progress toward goal</h2>
          <div class="progress-bar-wrap">
            <div class="progress-bar-track" id="progress-bar-track">
              <div class="progress-bar-fill" id="progress-bar-fill"></div>
              <div class="progress-marker" id="progress-marker"></div>
            </div>
            <div class="progress-labels" id="progress-labels">
              <div class="progress-label" id="label-start"></div>
              <div class="progress-label" id="label-current"></div>
              <div class="progress-label" id="label-target"></div>
            </div>
          </div>
          <div class="progress-stats">
            <div>
              <span class="progress-pct" id="progress-pct">--</span>
              <span class="progress-pct-label">% complete</span>
            </div>
            <div class="kg-to-go" id="kg-to-go"></div>
            <span class="status-pill" id="status-pill"></span>
          </div>
        </div>

        <!-- Milestones panel -->
        <div class="card" id="milestones-panel" hidden>
          <h2>Milestones</h2>
          <div class="milestones-list" id="milestones-list"></div>
        </div>
      </div>

      <!-- Right column: recent entries card -->
      <div class="card recent-entries-card" id="recent-entries-card">
        <div class="card-header-row">
          <h2>Recent entries &middot; <span class="card-subtitle">last 14 days</span></h2>
          <a href="/weight/entries" class="view-all-link" id="view-all-link">View all &#x2192;</a>
        </div>
        <div id="recent-entries">
          <table class="entries-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Weight</th>
                <th>Delta</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="entries-tbody"></tbody>
          </table>
        </div>
      </div>

    </div><!-- /.bottom-grid -->
  </main>

  <script src="js/nav.js"></script>
  <script src="js/ui-states.js"></script>
  <script src="js/weight.js"></script>
</body>
</html>
