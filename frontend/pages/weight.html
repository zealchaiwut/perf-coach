<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weight – perf-coach</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --color-text-success: #16a34a;
      --color-text-danger: #dc2626;
    }

    .summary-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 699px) {
      .summary-cards {
        grid-template-columns: 1fr;
      }
    }

    .summary-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .card-label {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 0.2rem;
    }

    .card-value {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .card-meta {
      font-size: 0.875rem;
      color: #555;
    }

    .card-sublabel {
      font-size: 0.75rem;
      color: #999;
      margin-top: auto;
      padding-top: 0.25rem;
    }

    .card-need-data {
      font-size: 1rem;
      color: #aaa;
      font-weight: 400;
    }

    .card-dots {
      display: flex;
      gap: 0.3rem;
      align-items: center;
      margin: 0.2rem 0;
    }

    .day-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      flex-shrink: 0;
    }

    .day-dot.logged {
      background: #dcfce7;
      color: var(--color-text-success);
    }

    .day-dot.missed {
      background: #f3f4f6;
      color: #d1d5db;
    }

    .day-dot.today-pending {
      border: 2px dashed #9ca3af;
      background: transparent;
    }

    .chart-wrapper {
      position: relative;
      width: 100%;
      max-width: 720px;
      margin-bottom: 2rem;
    }

    .weight-form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-width: 360px;
      margin-bottom: 2rem;
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .weight-form label {
      font-size: 0.875rem;
      font-weight: 500;
      color: #444;
    }

    .weight-form input {
      padding: 0.5rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
      width: 100%;
    }

    .weight-form input:focus {
      outline: none;
      border-color: #0070f3;
      box-shadow: 0 0 0 2px rgba(0,112,243,0.15);
    }

    .error-msg {
      font-size: 0.8125rem;
      color: #c0392b;
      min-height: 1.2em;
    }

    .weight-form button {
      align-self: flex-start;
      padding: 0.5rem 1.25rem;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.9375rem;
      cursor: pointer;
    }

    .weight-form button:hover {
      background: #333;
    }

    h2 {
      font-size: 1rem;
      margin: 0 0 0.75rem;
      color: #444;
    }

    #entry-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #entry-list li {
      display: flex;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid #e5e5e5;
      font-size: 0.9375rem;
    }

    #entry-list li.empty {
      color: #888;
      border-bottom: none;
    }

    .entry-weight {
      font-weight: 600;
    }

    .entry-delete {
      background: none;
      border: none;
      color: #c0392b;
      cursor: pointer;
      font-size: 0.8125rem;
      padding: 0;
    }
    .entry-delete:hover { text-decoration: underline; }

    .user-row {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      max-width: 360px;
      margin-bottom: 1.5rem;
    }
    .user-row label {
      font-size: 0.875rem;
      font-weight: 500;
      color: #444;
    }
    .user-row select {
      padding: 0.5rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }

    #api-error {
      color: #c0392b;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      min-height: 1.2em;
    }

    .range-filter {
      display: inline-flex;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }

    .range-btn {
      padding: 0.375rem 0.875rem;
      background: #fff;
      border: none;
      border-right: 1px solid #d1d5db;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      color: #6b7280;
      line-height: 1.5;
    }

    .range-btn:last-child {
      border-right: none;
    }

    .range-btn:hover:not(.active) {
      background: #f3f4f6;
    }

    .range-btn.active {
      background: #1a1a1a;
      color: #fff;
    }

    .ma-toggle {
      margin-top: 0.5rem;
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
      color: #444;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .ma-toggle input[type="checkbox"] {
      cursor: pointer;
      width: 1rem;
      height: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>perf-coach</h1>
    <span id="env-label" class="env-label"></span>
  </header>
  <main>
    <div class="user-row">
      <label for="user-select">User</label>
      <select id="user-select">
        <option value="">Loading…</option>
      </select>
    </div>

    <p id="api-error" role="alert"></p>

    <div class="summary-cards" id="summary-cards">
      <div class="summary-card">
        <div class="card-label">This week avg</div>
        <div class="card-value" id="card-week-avg-value">--</div>
        <div class="card-meta" id="card-week-avg-meta"></div>
        <div class="card-sublabel" id="card-week-avg-sub"></div>
      </div>
      <div class="summary-card">
        <div class="card-label">30-day trend</div>
        <div class="card-value" id="card-trend-value">--</div>
        <div class="card-meta" id="card-trend-meta"></div>
        <div class="card-sublabel" id="card-trend-sub"></div>
      </div>
      <div class="summary-card">
        <div class="card-label">Days logged</div>
        <div class="card-value" id="card-days-value">--</div>
        <div class="card-dots" id="card-days-dots"></div>
        <div class="card-sublabel" id="card-days-sub"></div>
      </div>
    </div>

    <div class="range-filter" role="group" aria-label="Chart date range">
      <button class="range-btn" data-range="7d" type="button">7d</button>
      <button class="range-btn" data-range="30d" type="button">30d</button>
      <button class="range-btn" data-range="90d" type="button">90d</button>
      <button class="range-btn" data-range="all" type="button">All</button>
    </div>

    <div class="chart-wrapper">
      <canvas id="weight-chart"></canvas>
    </div>

    <div class="ma-toggle">
      <input type="checkbox" id="avg-toggle" checked>
      <label for="avg-toggle">Show moving average</label>
    </div>

    <form id="weight-form" class="weight-form" novalidate>
      <div class="form-row">
        <label for="weight-input">Weight (kg)</label>
        <input id="weight-input" type="number" step="0.1" min="0" placeholder="e.g. 72.5">
        <span id="weight-error" class="error-msg" role="alert"></span>
      </div>
      <div class="form-row">
        <label for="date-input">Date</label>
        <input id="date-input" type="date">
      </div>
      <button type="submit">Add entry</button>
    </form>

    <h2>Entries</h2>
    <ul id="entry-list"></ul>

    <p style="margin-top:2rem"><a href="/users">Manage users</a></p>
  </main>
  <script src="js/nav.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/weight.js"></script>
  <script src="js/user.js"></script>
  <script src="js/env.js"></script>
</body>
</html>
