<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training log – perf-coach</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    /* ── Page header ─────────────────────────────────────────────────────── */
    .log-page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.875rem 2rem;
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
    }

    .log-page-header-info { min-width: 0; }

    .log-page-title {
      margin: 0 0 0.2rem;
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .log-subtitle {
      margin: 0;
      font-size: 0.8125rem;
      color: #888;
    }

    .log-page-header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .btn-primary:disabled,
    .btn-secondary:disabled {
      background: #ccc;
      color: #888;
      cursor: not-allowed;
      opacity: 1;
    }

    .btn-primary:disabled:hover,
    .btn-secondary:disabled:hover { background: #ccc; }

    .btn-coming-soon {
      position: relative;
    }

    .btn-coming-soon::after {
      content: 'soon';
      position: absolute;
      top: -7px;
      right: -4px;
      font-size: 0.5625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #f59e0b;
      color: #fff;
      padding: 1px 4px;
      border-radius: 3px;
      line-height: 1.4;
    }

    /* ── Week strip ── */
    #week-strip {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      padding: 0.75rem 2rem;
    }

    .ws-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .ws-label {
      font-size: 0.8125rem;
      font-weight: 600;
      color: #1a1a1a;
    }

    .ws-chevron {
      background: none;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 0.15rem 0.45rem;
      font-size: 1.125rem;
      line-height: 1;
      cursor: pointer;
      color: #555;
      transition: background 0.1s;
    }

    .ws-chevron:hover { background: #f5f5f5; color: #1a1a1a; }

    .ws-pills {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }

    .ws-pills::-webkit-scrollbar { height: 3px; }
    .ws-pills::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

    .day-pill {
      flex: 1;
      min-width: 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.375rem 0.25rem;
      border-radius: 6px;
      background: #f5f5f5;
      border: 2px solid transparent;
      flex-shrink: 0;
    }

    .day-pill.today {
      background: #eff6ff;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
    }

    .day-name {
      font-size: 0.625rem;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .day-num {
      font-size: 0.9375rem;
      font-weight: 600;
      color: #1a1a1a;
      margin: 0.1rem 0 0.2rem;
      line-height: 1;
    }

    .wd-dots {
      display: flex;
      gap: 2px;
      min-height: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .wd-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Filter bar ── */
    #filter-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.75rem 2rem;
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
    }

    .fb-search-wrap {
      flex: 1 1 180px;
      min-width: 140px;
    }

    #log-search {
      width: 100%;
      padding: 0.4rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.875rem;
      background: #fafafa;
      font-family: inherit;
    }

    #log-search:focus {
      outline: none;
      border-color: #0070f3;
      box-shadow: 0 0 0 2px rgba(0,112,243,0.15);
      background: #fff;
    }

    .fb-chips-row {
      display: flex;
      gap: 0.25rem;
    }

    .type-chip {
      padding: 0.3rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 999px;
      background: #fff;
      color: #555;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }

    .type-chip:hover:not(.active) { background: #f5f5f5; color: #1a1a1a; }

    .type-chip.active {
      background: #1a1a1a;
      color: #fff;
      border-color: #1a1a1a;
    }

    .fb-divider {
      width: 1px;
      height: 22px;
      background: #e0e0e0;
      flex-shrink: 0;
      align-self: center;
    }

    .fb-daterange-wrap { position: relative; }

    .dr-chip {
      padding: 0.3rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 999px;
      background: #fff;
      color: #555;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: background 0.1s, color 0.1s;
    }

    .dr-chip:hover { background: #f5f5f5; color: #1a1a1a; }

    .dr-panel {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      z-index: 100;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      min-width: 200px;
    }

    .dr-panel label {
      font-size: 0.75rem;
      color: #666;
      font-weight: 600;
    }

    .dr-panel input[type="date"] {
      width: 100%;
      padding: 0.35rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.8125rem;
      font-family: inherit;
    }

    .dr-panel input[type="date"]:focus {
      outline: none;
      border-color: #0070f3;
      box-shadow: 0 0 0 2px rgba(0,112,243,0.15);
    }

    .log-loading-indicator {
      font-size: 0.8125rem;
      color: #888;
      margin-left: auto;
    }

    /* ── Log list ── */
    #log-list {
      max-width: 800px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
    }

    .log-empty {
      color: #888;
      font-size: 0.9375rem;
      padding: 2rem 0;
      text-align: center;
    }

    .log-error {
      color: #c0392b;
      font-size: 0.875rem;
      padding: 1rem 0;
      text-align: center;
    }

    /* ── Week group ── */
    .week-group { margin-bottom: 2rem; }

    .week-header {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.3rem 0.75rem;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.04);
      margin-bottom: 0.5rem;
    }

    .week-header-title {
      font-weight: 700;
      font-size: 0.8125rem;
      letter-spacing: 0.04em;
      color: #1a1a1a;
    }

    .week-header-range {
      font-size: 0.8125rem;
      color: #666;
    }

    .week-header-summary {
      font-size: 0.8125rem;
      color: #888;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .summary-sep { color: #bbb; }

    /* ── Week card (wraps all rows in the week) ── */
    .week-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      overflow: hidden;
    }

    .week-card > .entry-row {
      border: none;
      border-bottom: 1px solid #f0f0f0;
      border-radius: 0;
      margin-bottom: 0;
    }

    .week-card > .entry-row:last-child,
    .week-card > .rest-day-row:last-child {
      border-bottom: none;
    }

    .week-card > .rest-day-row {
      border-bottom: 1px solid #f0f0f0;
      border-radius: 0;
      margin-bottom: 0;
    }

    /* ── Entry row ── */
    .entry-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0.75rem;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      margin-bottom: 0.4rem;
      cursor: pointer;
      transition: background 0.1s;
      border-left: 3px solid transparent;
    }

    .entry-row:hover { background: #fafafa; }

    .entry-row.is-active {
      background: #eff6ff;
      border-left-color: #3b82f6;
    }

    .entry-date {
      flex-shrink: 0;
      text-align: center;
      width: 2rem;
    }

    .entry-day-num {
      font-size: 1.125rem;
      font-weight: 700;
      line-height: 1.1;
      color: #1a1a1a;
    }

    .entry-day-name {
      font-size: 0.6875rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .entry-badge {
      flex-shrink: 0;
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: #e5e5e5;
      color: #555;
    }

    .entry-badge--run  { background: #dbeafe; color: #1d4ed8; }
    .entry-badge--lift { background: #ede9fe; color: #6d28d9; }
    .entry-badge--wod  { background: #fef3c7; color: #b45309; }
    .entry-badge--bike { background: #ccfbf1; color: #0f766e; }

    .entry-body { flex: 1; min-width: 0; }

    .entry-title {
      font-size: 0.9375rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .entry-meta {
      font-size: 0.8125rem;
      color: #888;
      margin-top: 0.1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .entry-metric {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      white-space: nowrap;
    }

    .entry-metric-primary {
      font-size: 0.875rem;
      font-weight: 600;
      color: #1a1a1a;
    }

    .entry-metric-secondary {
      font-size: 0.75rem;
      color: #888;
      margin-top: 0.05rem;
    }

    .tss-pill {
      flex-shrink: 0;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
    }

    .tss-low  { background: #f5f5f5; color: #555; }
    .tss-mid  { background: #fef3c7; color: #92400e; }
    .tss-high { background: #fee2e2; color: #991b1b; }

    /* ── Source badges ── */
    .source-badges-wrap {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .source-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      line-height: 1;
    }

    .source-badge--strava { background: #fc4c02; color: #fff; }
    .source-badge--stryd  { background: #f97316; color: #fff; }
    .source-badge--manual { background: #e5e5e5; color: #555; }

    /* ── Rest day row ── */
    .rest-day-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0.75rem;
      background: #f8fafc;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      margin-bottom: 0.4rem;
      cursor: default;
    }

    .rest-moon-icon {
      flex-shrink: 0;
      font-size: 1rem;
      line-height: 1;
    }

    .rest-metrics {
      flex: 1;
      min-width: 0;
    }

    .rest-day-label {
      font-size: 0.875rem;
      color: #9ca3af;
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Skeleton loading ── */
    @keyframes skeleton-shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position:  400px 0; }
    }

    .skeleton-row {
      height: 64px;
      border-radius: 6px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
      background-size: 400px 100%;
      animation: skeleton-shimmer 1.4s ease infinite;
      margin-bottom: 0.4rem;
    }

    .skeleton-stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-top: 0.75rem;
      padding: 0 1.25rem;
    }

    .skeleton-stat-bar {
      height: 48px;
      border-radius: 4px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
      background-size: 400px 100%;
      animation: skeleton-shimmer 1.4s ease infinite;
    }

    /* ── Error / empty states ── */
    .list-error-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: #555;
      max-width: 800px;
      margin: 0 auto;
    }

    .list-error-state p {
      margin: 0 0 0.75rem;
      font-size: 0.9375rem;
    }

    .detail-error-state {
      text-align: center;
      padding: 2rem 1.25rem;
      color: #555;
    }

    .detail-error-state p {
      margin: 0 0 0.75rem;
      font-size: 0.9375rem;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      max-width: 800px;
      margin: 0 auto;
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.4;
    }

    .empty-state p {
      color: #888;
      font-size: 0.9375rem;
      margin: 0 0 1.25rem;
    }

    /* ── Responsive: list ≤ 880px ── */
    @media (max-width: 880px) {
      .log-page-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .fb-chips-row {
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 2px;
      }

      .fb-chips-row::-webkit-scrollbar { height: 3px; }
      .fb-chips-row::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
    }

    @media (max-width: 599px) {
      .log-page-header { padding: 0.75rem 1rem; }
      #week-strip { padding: 0.75rem 1rem; }
      #filter-bar { padding: 0.75rem 1rem; flex-direction: column; align-items: stretch; }
      .fb-search-wrap { flex: none; }
      .dr-panel { left: 0; right: 0; }
      #log-list { padding: 1rem; }

      .entry-metric { display: none; }
      .source-badges-wrap { display: none; }

      .day-pill { min-width: 40px; padding: 0.35rem; }
    }

    @media (max-width: 380px) {
      .entry-row { flex-wrap: wrap; gap: 0.5rem; }
      .entry-date  { order: 1; }
      .entry-badge { order: 2; }
      .entry-body  { order: 3; flex-basis: 100%; }
      .entry-metric { order: 4; flex-basis: 100%; }
      .tss-pill, .source-badges-wrap { order: 5; }
    }

    /* ── Layout wrapper (list + panel) ── */
    #layout-wrapper { position: relative; }

    @media (min-width: 880px) {
      #layout-wrapper.has-panel {
        display: grid;
        grid-template-columns: 1fr 520px;
        align-items: start;
      }

      #layout-wrapper.has-panel #list-main { min-width: 0; }
    }

    /* ── Detail panel overlay (mobile only) ── */
    .detail-panel-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .detail-panel-overlay.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    @media (min-width: 880px) {
      .detail-panel-overlay { display: none; }
    }

    /* ── Detail panel ── */
    .detail-panel {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 100%;
      max-width: 520px;
      background: #fff;
      box-shadow: -4px 0 24px rgba(0,0,0,0.12);
      z-index: 201;
      display: none;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.25s ease;
    }

    .detail-panel.is-open {
      display: flex;
      transform: translateX(0);
    }

    @media (min-width: 880px) {
      .detail-panel {
        position: sticky;
        top: 52px;
        height: calc(100vh - 52px);
        transform: none;
        transition: none;
        box-shadow: -1px 0 0 #e5e5e5, -4px 0 16px rgba(0,0,0,0.06);
        z-index: auto;
        display: none;
      }

      .detail-panel.is-open {
        display: flex;
        transform: none;
      }
    }

    /* ── Detail top bar ── */
    .dp-topbar {
      height: 52px;
      padding: 0 10px;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 6px;
      background: #fff;
    }

    .dp-icon-btn {
      width: 34px; height: 34px;
      border: none; background: none; border-radius: 6px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: #555; font-size: 1.125rem; flex-shrink: 0;
      transition: background 0.1s;
      font-family: inherit;
    }

    .dp-icon-btn:hover { background: #f5f5f5; color: #1a1a1a; }

    .dp-position-group {
      display: flex; align-items: center; gap: 5px;
    }

    .dp-position {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 0.75rem; font-weight: 600;
      color: #555; background: #f1f4fa;
      padding: 4px 10px; border-radius: 999px;
      white-space: nowrap; min-width: 60px; text-align: center;
    }

    .dp-nav-btn {
      width: 30px; height: 30px;
      border: 1px solid #e0e0e0; background: #fff; border-radius: 6px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: #555; font-size: 0.75rem; flex-shrink: 0;
      transition: background 0.1s, color 0.1s;
      font-family: inherit;
    }

    .dp-nav-btn:hover:not(:disabled) { background: #f5f5f5; color: #1a1a1a; }
    .dp-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* icon visibility by viewport */
    .dp-icon-close-back, .dp-icon-nav-left, .dp-icon-nav-right { display: none; }

    @media (max-width: 879px) {
      .dp-icon-close-x, .dp-icon-nav-up, .dp-icon-nav-down { display: none; }
      .dp-icon-close-back, .dp-icon-nav-left, .dp-icon-nav-right { display: inline; }
    }

    /* ── Detail scroll area ── */
    .dp-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px 24px;
    }

    .dp-scroll::-webkit-scrollbar { width: 4px; }
    .dp-scroll::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

    /* ── Hero block ── */
    .dp-hero { margin-bottom: 20px; }

    .dp-hero-typebadge {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 10px;
    }

    .dp-icon-pill {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.0625rem; flex-shrink: 0;
    }

    .dp-icon-pill--run  { background: #dbeafe; color: #1d4ed8; }
    .dp-icon-pill--lift { background: #ede9fe; color: #6d28d9; }
    .dp-icon-pill--wod  { background: #fef3c7; color: #b45309; }
    .dp-icon-pill--bike { background: #ccfbf1; color: #0f766e; }
    .dp-icon-pill--other { background: #f0f0f0; color: #555; }

    .dp-type-pill {
      font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 3px 10px; border-radius: 999px;
      background: #f1f4fa; color: #5c6886;
    }

    .dp-hero h1 {
      margin: 0; font-size: 1.3125rem; font-weight: 700; line-height: 1.25;
      letter-spacing: -0.02em; color: #0b1530;
    }

    .dp-hero-meta {
      margin-top: 6px; font-size: 0.8125rem; color: #5c6886;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }

    .dp-hero-sources { display: flex; gap: 3px; }

    .dp-src-badge {
      width: 22px; height: 22px; border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.625rem; font-weight: 700;
    }

    .dp-src-badge--strava { background: #fc4c02; color: #fff; }
    .dp-src-badge--stryd  { background: #f97316; color: #fff; }
    .dp-src-badge--manual { background: #e5e5e5; color: #555; }

    /* ── Sections ── */
    .dp-section { margin-bottom: 20px; }
    .dp-section:last-child { margin-bottom: 0; }

    .dp-section-title {
      font-size: 0.6875rem; font-weight: 600; color: #8b95ad;
      text-transform: uppercase; letter-spacing: 0.07em;
      margin: 0 0 8px;
    }

    /* ── Stats grid 2×3 ── */
    .dp-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 7px;
    }

    .dp-stat {
      background: #f7f9fd;
      border-radius: 8px;
      padding: 10px 11px;
    }

    .dp-stat.highlight {
      background: linear-gradient(135deg, #dde6f8 0%, #c2d2f3 100%);
    }

    .dp-stat-label {
      font-size: 0.625rem; font-weight: 600; color: #8b95ad;
      text-transform: uppercase; letter-spacing: 0.07em;
      margin-bottom: 4px;
    }

    .dp-stat-value {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 1rem; font-weight: 600; color: #0b1530;
      line-height: 1.1;
    }

    .dp-stat-unit {
      font-size: 0.625rem; color: #8b95ad;
      font-family: inherit; font-weight: 500; margin-left: 2px;
    }

    /* ── Intervals table ── */
    .dp-intervals {
      background: #fff;
      border: 1px solid rgba(13,30,67,0.08);
      border-radius: 8px;
      overflow: hidden;
    }

    .dp-interval-row {
      display: grid;
      grid-template-columns: 26px 1fr 76px 48px;
      gap: 10px; align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(13,30,67,0.05);
    }

    .dp-interval-row:last-of-type { border-bottom: none; }

    .dp-rep-badge {
      width: 24px; height: 20px; border-radius: 5px;
      background: #dbeafe; color: #1d4ed8;
      display: flex; align-items: center; justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6875rem; font-weight: 700; flex-shrink: 0;
    }

    .dp-interval-name { font-size: 0.875rem; font-weight: 500; color: #0b1530; }
    .dp-interval-sub  { font-size: 0.75rem; color: #8b95ad; margin-top: 1px; }

    .dp-interval-pace {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 0.8125rem; font-weight: 600;
      color: #0b1530; text-align: right;
    }

    .dp-interval-pace-sub { font-size: 0.625rem; color: #8b95ad; text-align: right; margin-top: 1px; }

    .dp-interval-hr {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 0.75rem; color: #5c6886; text-align: right;
    }

    .dp-interval-footer {
      padding: 9px 12px;
      background: #f7f9fd;
      border-top: 1px solid rgba(13,30,67,0.05);
      font-size: 0.8125rem; color: #5c6886;
      display: flex; justify-content: space-between; align-items: center;
    }

    .dp-interval-footer strong {
      color: #0b1530;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
    }

    /* ── Per-km splits table ── */
    .dp-splits {
      background: #fff;
      border: 1px solid rgba(13,30,67,0.08);
      border-radius: 8px;
      overflow: hidden;
    }

    .dp-split-header {
      display: grid; grid-template-columns: 36px 1fr 72px 44px;
      gap: 10px; align-items: center;
      padding: 6px 12px;
      background: #f7f9fd;
      border-bottom: 1px solid rgba(13,30,67,0.08);
      font-size: 0.625rem; font-weight: 600; color: #8b95ad;
      text-transform: uppercase; letter-spacing: 0.06em;
    }

    .dp-split-row {
      display: grid; grid-template-columns: 36px 1fr 72px 44px;
      gap: 10px; align-items: center;
      padding: 9px 12px;
      border-bottom: 1px solid rgba(13,30,67,0.05);
      font-size: 0.875rem;
    }

    .dp-split-row:last-child { border-bottom: none; }
    .dp-split-km { font-weight: 600; color: #5c6886; font-size: 0.8125rem; }

    .dp-split-pace {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 0.8125rem; font-weight: 600;
      color: #0b1530; text-align: right;
    }

    .dp-split-hr {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 0.75rem; color: #5c6886; text-align: right;
    }

    /* ── Exercises list ── */
    .dp-exercise-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(13,30,67,0.05);
      align-items: center;
    }

    .dp-exercise-item:last-child { border-bottom: none; }

    .dp-exercise-name {
      font-size: 0.9375rem; font-weight: 500; color: #0b1530;
    }

    .dp-exercise-sub {
      font-size: 0.8125rem; color: #8b95ad; margin-top: 2px;
    }

    .dp-exercise-rpe {
      font-size: 0.6875rem; font-weight: 700;
      padding: 3px 7px; border-radius: 4px;
      background: #f1f4fa; color: #5c6886; white-space: nowrap;
      align-self: start;
    }

    /* ── Notes card ── */
    .dp-notes-card {
      background: #f7f9fd;
      border-radius: 8px; padding: 12px 14px;
      font-size: 0.9375rem; color: #5c6886; line-height: 1.55;
      margin: 0;
    }

    /* ── Action bar ── */
    .dp-actions-bar {
      display: flex; gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid #e5e5e5;
      flex-shrink: 0;
      background: #fff;
    }

    .dp-action-btn {
      flex: 1; height: 38px;
      border: 1px solid #e0e0e0; background: #fff;
      border-radius: 8px; cursor: pointer;
      font-family: inherit; font-size: 0.875rem; font-weight: 600;
      color: #0b1530;
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      transition: background 0.1s; text-decoration: none;
    }

    .dp-action-btn:hover { background: #f5f5f5; }

    .dp-action-btn--strava {
      background: #fc4c02; color: #fff; border-color: #fc4c02;
    }

    .dp-action-btn--strava:hover { opacity: 0.9; background: #fc4c02; }

    .dp-action-btn--delete {
      border-color: #fecaca; color: #b91c1c; background: #fff7f7;
    }

    .dp-action-btn--delete:hover { background: #fee2e2; }

    /* ── Skeleton loading in panel ── */
    .dp-skeleton-title {
      height: 18px; border-radius: 4px; margin-bottom: 8px; width: 55%;
      background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
      background-size: 400px 100%;
      animation: skeleton-shimmer 1.4s ease infinite;
    }

    .dp-skeleton-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; margin-top: 12px;
    }

    .dp-skeleton-stat {
      height: 56px; border-radius: 8px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
      background-size: 400px 100%;
      animation: skeleton-shimmer 1.4s ease infinite;
    }
  </style>
</head>
<body>

  <!-- Page header: title, stats subtitle, action buttons -->
  <header class="log-page-header">
    <div class="log-page-header-info">
      <h1 class="log-page-title">Training log</h1>
      <p class="log-subtitle" id="log-subtitle">Loading…</p>
    </div>
    <div class="log-page-header-actions">
      <button id="sync-strava-btn" class="btn-secondary" type="button">Sync Strava</button>
      <button id="sync-stryd-btn" class="btn-secondary btn-coming-soon" type="button" disabled title="Stryd sync coming soon">Sync Stryd</button>
      <button id="log-export-btn" class="btn-secondary">Export CSV</button>
      <button id="log-new-btn" class="btn-primary">Log workout</button>
      <span id="env-label" class="env-label"></span>
    </div>
  </header>

  <!-- Week strip (JS renders into this) -->
  <div id="week-strip"></div>

  <!-- Filter bar (JS renders into this) -->
  <div id="filter-bar"></div>

  <div id="layout-wrapper">
    <div id="list-main">
      <!-- Workout list -->
      <div id="log-list"></div>

      <div id="log-error-msg" style="display:none" class="list-error-state" role="alert">
        <p>Couldn't load workouts.</p>
        <button id="log-retry-btn" class="btn-sm">Retry</button>
      </div>

      <div id="log-empty-msg" style="display:none" class="empty-state">
        <div class="empty-state-icon">🏃</div>
        <p>No workouts logged yet. Start tracking your training!</p>
        <button id="log-empty-cta" class="btn-primary">Log your first workout</button>
      </div>
    </div>

    <!-- Detail panel backdrop (mobile only) -->
    <div id="detail-overlay" class="detail-panel-overlay" aria-hidden="true"></div>

    <!-- Workout detail panel -->
    <aside id="detail-panel" class="detail-panel" role="dialog" aria-modal="true"
           aria-labelledby="dp-title">

      <!-- Top bar: close | prev · position pill · next | overflow -->
      <div class="dp-topbar">
        <button id="dp-close-btn" class="dp-icon-btn" aria-label="Close workout details" type="button">
          <span class="dp-icon-close-x" aria-hidden="true">&#x2715;</span>
          <span class="dp-icon-close-back" aria-hidden="true">&#8592;</span>
        </button>

        <div class="dp-position-group">
          <button id="dp-prev-btn" class="dp-nav-btn" aria-label="Previous workout" type="button">
            <span class="dp-icon-nav-up"    aria-hidden="true">&#9650;</span>
            <span class="dp-icon-nav-left"  aria-hidden="true">&#9664;</span>
          </button>
          <div id="dp-position-pill" class="dp-position" aria-live="polite"></div>
          <button id="dp-next-btn" class="dp-nav-btn" aria-label="Next workout" type="button">
            <span class="dp-icon-nav-down"  aria-hidden="true">&#9660;</span>
            <span class="dp-icon-nav-right" aria-hidden="true">&#9654;</span>
          </button>
        </div>

        <button class="dp-icon-btn" aria-label="More options" type="button">&#8942;</button>
      </div>

      <!-- Scrollable body: loading / error / content -->
      <div id="dp-scroll" class="dp-scroll">
        <div id="dp-loading" style="display:none" aria-busy="true">
          <div class="dp-skeleton-title"></div>
          <div class="dp-skeleton-grid">
            <div class="dp-skeleton-stat"></div>
            <div class="dp-skeleton-stat"></div>
            <div class="dp-skeleton-stat"></div>
            <div class="dp-skeleton-stat"></div>
            <div class="dp-skeleton-stat"></div>
            <div class="dp-skeleton-stat"></div>
          </div>
        </div>

        <div id="dp-error" style="display:none" class="detail-error-state" role="alert">
          <p>Couldn't load workout.</p>
          <button id="dp-retry-btn" class="btn-sm" type="button">Retry</button>
        </div>

        <div id="dp-content"></div>
      </div>

      <!-- Sticky action bar -->
      <div class="dp-actions-bar">
        <a id="dp-edit-btn"   class="dp-action-btn" href="#">Edit</a>
        <a id="dp-strava-btn" class="dp-action-btn dp-action-btn--strava"
           href="#" target="_blank" rel="noopener" style="display:none">Open on Strava</a>
        <button id="dp-delete-btn" class="dp-action-btn dp-action-btn--delete"
                type="button" style="display:none">Delete</button>
      </div>
    </aside>
  </div>

  <script src="js/nav.js"></script>
  <script src="js/training-log.js"></script>
  <script src="js/user.js"></script>
  <script src="js/env.js"></script>
</body>
</html>
