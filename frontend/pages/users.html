<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users – perf-coach</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Users</h1>
    <span id="env-label" class="env-label"></span>
  </header>
  <main>
    <p id="page-error" class="page-error" role="alert"></p>

    <div id="add-form-bar">
      <button id="add-user-btn" type="button" class="btn-primary">+ Add user</button>
    </div>

    <div id="add-form-inline" class="inline-form" hidden>
      <input id="add-name-input" type="text" placeholder="Name" maxlength="100" autocomplete="off">
      <button id="add-save-btn" type="button" class="btn-primary">Save</button>
      <button id="add-cancel-btn" type="button" class="btn-secondary">Cancel</button>
      <span id="add-name-error" class="field-error" role="alert"></span>
    </div>

    <table class="users-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Created</th>
          <th>Weight entries</th>
          <th>Habits</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="users-tbody"></tbody>
    </table>

    <div id="delete-modal" class="modal-overlay" hidden>
      <div class="modal-box">
        <p id="delete-modal-text" style="margin-top:0"></p>
        <div class="modal-actions">
          <button id="delete-confirm-btn" type="button" class="btn-danger">Delete</button>
          <button id="delete-cancel-btn" type="button" class="btn-secondary">Cancel</button>
        </div>
      </div>
    </div>

    <p style="margin-top:2rem"><a href="/home">Back</a></p>
  </main>
  <script src="js/nav.js"></script>
  <script src="js/user.js"></script>
  <script src="js/users.js"></script>
  <script src="js/env.js"></script>
</body>
</html>
