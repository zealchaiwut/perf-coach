<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Log a Run – perf-coach</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Page shell (same gradient + card tokens as Run View) ───────────── */
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter Tight', system-ui, sans-serif;
      background: var(--page-bg);
      min-height: 100vh;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }
    main.rb-main {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 16px calc(92px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Accent vars (same as run-view.html for consistency) ────────────── */
    :root {
      --rv-lime: var(--accent);
      --rv-teal: #14b8a6;
      --rv-purple: #8b5cf6;
      --rb-z-sticky-footer: 40; /* nav bar: 100, nav dropdown: 200, modal: 1000 */
    }

    /* ── Card shell (14 px radius, same shadow as Run View) ─────────────── */
    .rb-card {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--card-border);
      box-shadow: 0 6px 20px rgba(8,18,48,0.16);
      padding: 20px;
    }

    /* ── Typography ─────────────────────────────────────────────────────── */
    .rb-mono { font-family: 'JetBrains Mono', monospace; }
    .rb-section-title {
      margin: 0 0 14px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .rb-empty { color: var(--text-tertiary); font-size: 13px; margin: 0; }

    /* Visually-hidden but screen-reader accessible (scoped to this page) */
    .rb-sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    /* ── Import strip ───────────────────────────────────────────────────── */
    .rb-import-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px 16px;
      background: var(--shell-2, #d8e3f5);
      border-radius: 10px;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    .rb-import-strip strong { color: var(--text-primary); }
    .rb-import-btn {
      min-height: 44px;
      padding: 6px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-input, #d1d5db);
      background: var(--card-bg);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-primary);
    }
    .rb-import-btn:hover { background: var(--shell-1, #eaf0fb); }
    .rb-import-btn:focus-visible { outline: 2px solid var(--primary, #3b82f6); outline-offset: 2px; }
    .rb-import-badge--strava { color: #fc4c02; }
    .rb-import-badge--stryd  { color: #0ea5e9; }

    /* ── Field groups ───────────────────────────────────────────────────── */
    .rb-field-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 16px; }
    .rb-field-group:last-child { margin-bottom: 0; }
    .rb-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .rb-req { color: var(--danger, #dc2626); margin-left: 2px; }
    .rb-hint { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11px; color: var(--text-tertiary); }
    .rb-input {
      min-height: 44px;
      padding: 9px 12px;
      border: 1.5px solid var(--border-input, #d1d5db);
      border-radius: 8px;
      font-family: inherit;
      font-size: 16px;
      color: var(--text-primary);
      background: var(--surface, #fff);
      width: 100%;
    }
    .rb-input:focus-visible, .rb-input:focus {
      outline: none;
      border-color: var(--primary, #3b82f6);
      box-shadow: 0 0 0 3px var(--focus-ring, rgba(59,130,246,0.18));
    }
    .rb-input[aria-invalid="true"] {
      border-color: var(--danger, #dc2626);
      background: var(--danger-soft, #fee2e2);
    }
    .rb-input[aria-invalid="true"]:focus { box-shadow: 0 0 0 3px rgba(220,38,38,0.18); }
    textarea.rb-input { resize: vertical; min-height: 80px; }
    .rb-field-error {
      font-size: 12.5px;
      color: var(--danger, #dc2626);
      margin: 0;
    }
    .rb-field-error:empty { display: none; }

    /* ── Workout type pills ─────────────────────────────────────────────── */
    .rb-type-pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .rb-type-pill {
      min-height: 44px;
      padding: 6px 18px;
      border-radius: 20px;
      border: 1.5px solid var(--border-input, #d1d5db);
      background: none;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .rb-type-pill:hover { border-color: #9aa3b2; }
    .rb-type-pill:focus-visible { outline: 2px solid var(--primary, #3b82f6); outline-offset: 2px; }
    .rb-type-pill--active {
      background: var(--rv-lime);
      color: var(--accent-text, #1a2400);
      border-color: var(--rv-lime);
      font-weight: 700;
    }

    /* ── Segment bar ────────────────────────────────────────────────────── */
    .rb-seg-bar {
      display: flex;
      align-items: flex-end;
      height: 40px;
      border-radius: 6px;
      overflow: hidden;
      gap: 1px;
      margin-bottom: 12px;
      background: var(--shell-2, #d8e3f5);
    }
    .rb-seg-block { min-width: 4px; border-radius: 2px; }

    /* ── Segment rows ───────────────────────────────────────────────────── */
    .rb-seg-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px 12px;
      background: var(--tile, #f7f9fd);
      border-radius: 8px;
      margin-bottom: 6px;
    }
    .rb-seg-bullet { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .rb-seg-effort {
      min-height: 40px;
      padding: 6px 8px; border-radius: 6px; border: 1.5px solid var(--border-input, #d1d5db);
      font-size: 16px; font-family: inherit; background: var(--surface, #fff);
      color: var(--text-primary);
    }
    .rb-seg-label { font-size: 11px; color: var(--text-tertiary); white-space: nowrap; }
    .rb-seg-input {
      min-height: 40px;
      width: 82px; padding: 6px 8px; border-radius: 6px;
      border: 1.5px solid var(--border-input, #d1d5db);
      font-size: 16px; font-family: inherit; background: var(--surface, #fff);
      color: var(--text-primary);
    }
    .rb-seg-dur { width: 88px; }
    .rb-seg-pace { width: 104px; background: var(--shell-2, #d8e3f5); color: var(--text-secondary); }
    .rb-seg-pace[readonly] { cursor: default; }
    .rb-unit { font-size: 12px; color: var(--text-tertiary); }
    .rb-seg-del {
      margin-left: auto; background: none; border: none; cursor: pointer;
      color: var(--text-tertiary); font-size: 15px;
      width: 40px; height: 40px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .rb-seg-del:hover { color: var(--danger, #dc2626); background: var(--danger-soft, #fee2e2); }
    .rb-seg-del:focus-visible { outline: 2px solid var(--danger, #dc2626); outline-offset: 1px; }
    .rb-add-btn {
      display: flex; align-items: center; gap: 6px;
      min-height: 44px;
      padding: 8px 16px; border-radius: 8px;
      border: 1.5px dashed var(--border-input, #d1d5db);
      background: none; cursor: pointer; font-size: 13.5px;
      color: var(--text-secondary); font-weight: 600; margin-top: 6px;
    }
    .rb-add-btn:hover { background: var(--shell-2, #d8e3f5); border-color: #9aa3b2; }
    .rb-add-btn:focus-visible { outline: 2px solid var(--primary, #3b82f6); outline-offset: 2px; }

    /* ── Lap mode toggle ────────────────────────────────────────────────── */
    .rb-lap-mode { display: flex; gap: 8px; margin-bottom: 12px; border: 0; padding: 0; }
    .rb-lap-radio { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .rb-lap-label {
      min-height: 44px;
      display: flex; align-items: center;
      padding: 7px 18px; border-radius: 8px;
      border: 1.5px solid var(--border-input, #d1d5db);
      cursor: pointer; font-size: 13.5px; font-weight: 500;
      color: var(--text-secondary);
    }
    .rb-lap-radio:checked + .rb-lap-label {
      background: var(--rv-lime); color: var(--accent-text, #1a2400); border-color: var(--rv-lime); font-weight: 700;
    }
    .rb-lap-radio:focus-visible + .rb-lap-label {
      outline: 2px solid var(--primary, #3b82f6); outline-offset: 2px;
    }
    .rb-auto-preview { font-size: 12px; color: var(--text-tertiary); margin-bottom: 6px; }

    /* ── Manual lap rows ────────────────────────────────────────────────── */
    .rb-mlap-row {
      display: flex; align-items: center; gap: 8px;
      background: var(--tile, #f7f9fd); border-radius: 8px;
      padding: 10px 12px; margin-bottom: 6px; flex-wrap: wrap;
      font-size: 13px;
    }
    .rb-mlap-num { font-weight: 700; min-width: 20px; }
    .rb-mlap-row label { font-size: 11px; color: var(--text-tertiary); }
    .rb-mlap-row input {
      min-height: 40px;
      width: 76px; padding: 6px 8px; border-radius: 6px;
      border: 1.5px solid var(--border-input, #d1d5db); font-size: 16px;
      font-family: inherit; background: var(--surface, #fff); color: var(--text-primary);
    }
    .rb-mlap-del {
      margin-left: auto; background: none; border: none; cursor: pointer;
      color: var(--text-tertiary); font-size: 14px;
      width: 40px; height: 40px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .rb-mlap-del:hover { color: var(--danger, #dc2626); background: var(--danger-soft, #fee2e2); }
    .rb-mlap-del:focus-visible { outline: 2px solid var(--danger, #dc2626); outline-offset: 1px; }

    /* ── Totals grid ────────────────────────────────────────────────────── */
    #rb-totals {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }
    .rb-total-tile {
      background: var(--tile, #f7f9fd); border-radius: 10px; padding: 12px 10px; text-align: center;
    }
    .rb-total-val { font-size: 18px; font-weight: 700; color: var(--ink, #0b1530); line-height: 1.2; }
    .rb-total-label { font-size: 11px; color: var(--ink-2, #5c6886); margin-top: 4px; }
    .rb-label-tag {
      display: inline-block; font-size: 9px; font-weight: 700; padding: 1px 4px;
      border-radius: 3px; background: var(--rv-lime); color: var(--accent-text, #1a2400);
      vertical-align: middle; margin-left: 3px;
    }
    .rb-label-tag--sync {
      background: var(--rv-teal); color: #fff;
    }

    /* ── SYNC fields ────────────────────────────────────────────────────── */
    .rb-sync-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }
    .rb-sync-field { display: flex; flex-direction: column; gap: 5px; }
    .rb-sync-label {
      font-size: 11px; font-weight: 600; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.04em; display: flex; align-items: center; gap: 4px;
    }
    .rb-sync-input {
      min-height: 44px;
      padding: 7px 10px; border: 1.5px solid var(--border-input, #d1d5db); border-radius: 8px;
      font-size: 16px; font-family: 'JetBrains Mono', monospace; width: 100%;
      background: var(--surface, #fff); color: var(--text-primary);
    }
    .rb-sync-input:focus-visible, .rb-sync-input:focus {
      outline: none; border-color: var(--primary, #3b82f6); box-shadow: 0 0 0 3px var(--focus-ring, rgba(59,130,246,0.18));
    }

    /* ── Save bar (fixed, always reachable — mandate: reachable submit) ──── */
    .rb-save-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: var(--rb-z-sticky-footer);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--card-border);
      box-shadow: 0 -6px 20px rgba(8,18,48,0.12);
    }
    .rb-save-bar > * { max-width: 828px; margin: 0 auto; }
    .rb-form-error {
      color: var(--danger, #dc2626);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 0 10px;
    }
    .rb-form-error:empty { display: none; margin: 0; }
    .rb-actions {
      display: flex; justify-content: flex-end; gap: 10px;
    }
    .rb-btn-primary {
      min-height: 44px;
      padding: 10px 26px; border-radius: 8px; border: none;
      background: var(--primary, #3b82f6); color: #fff;
      font-size: 14.5px; font-weight: 600; cursor: pointer;
      flex: 1;
    }
    .rb-btn-primary:hover { background: var(--primary-dark, #2563eb); }
    .rb-btn-primary:focus-visible { outline: 2px solid var(--primary-dark, #2563eb); outline-offset: 2px; }
    .rb-btn-primary:disabled { opacity: 0.65; cursor: not-allowed; }
    .rb-btn-secondary {
      min-height: 44px;
      padding: 10px 22px; border-radius: 8px;
      border: 1.5px solid var(--border-input, #d1d5db); background: none;
      font-size: 14.5px; font-weight: 500; cursor: pointer; color: var(--text-secondary);
      flex: 0 0 auto;
    }
    .rb-btn-secondary:hover { background: var(--shell-2, #d8e3f5); }
    .rb-btn-secondary:focus-visible { outline: 2px solid var(--primary, #3b82f6); outline-offset: 2px; }

    /* ── Page header ────────────────────────────────────────────────────── */
    .rb-page-header { padding: 0 2px 12px; }
    .rb-page-title {
      margin: 0 0 4px;
      font-size: 26px; font-weight: 700;
      letter-spacing: -0.025em; color: #fff;
      text-shadow: 0 1px 8px rgba(0,0,0,0.15);
    }
    .rb-page-sub { margin: 0; font-size: 13.5px; color: rgba(255,255,255,0.92); }

    /* ── Mobile (<640px) ──────────────────────────────────────────────────
       DESIGN.md breakpoint: mobile < 640px. Inputs kept at 16px (above) to
       avoid iOS Safari zoom-on-focus; tap targets kept >= 44px throughout. */
    @media (max-width: 640px) {
      main.rb-main { padding: 16px 12px calc(88px + env(safe-area-inset-bottom)); gap: 10px; }
      .rb-card { padding: 16px; }
      .rb-seg-effort { flex: 1 1 100%; order: -1; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>

  <main class="rb-main">
    <!-- Page header (on gradient) -->
    <div class="rb-page-header">
      <h1 class="rb-page-title">Log a Run</h1>
      <p class="rb-page-sub">Record or plan a running workout</p>
    </div>

    <form id="rb-form" novalidate>

      <!-- Import strip -->
      <div class="rb-card">
        <div class="rb-import-strip">
          <strong>Pull from device:</strong>
          <button type="button" class="rb-import-btn rb-import-badge--strava" id="rb-import-strava">Strava</button>
          <button type="button" class="rb-import-btn rb-import-badge--stryd" id="rb-import-stryd">Stryd</button>
          <span>or log manually below</span>
        </div>
      </div>

      <!-- Workout Basics -->
      <div class="rb-card">
        <h2 class="rb-section-title">Workout Basics</h2>

        <div class="rb-field-group">
          <label class="rb-label" for="rb-name">Name <span class="rb-req" aria-hidden="true">*</span></label>
          <input id="rb-name" class="rb-input" type="text" placeholder="e.g. Morning Tempo Run" required aria-required="true" aria-describedby="rb-name-error">
          <p class="rb-field-error" id="rb-name-error" role="alert"></p>
        </div>

        <div class="rb-field-group">
          <label class="rb-label" for="rb-date">Date <span class="rb-req" aria-hidden="true">*</span></label>
          <input id="rb-date" class="rb-input" type="date" required aria-required="true" aria-describedby="rb-date-error">
          <p class="rb-field-error" id="rb-date-error" role="alert"></p>
        </div>

        <div class="rb-field-group">
          <span class="rb-label" id="rb-type-label">Type</span>
          <div class="rb-type-pills" role="group" aria-labelledby="rb-type-label">
            <button type="button" class="rb-type-pill" data-type="strength" aria-pressed="false">Strength</button>
            <button type="button" class="rb-type-pill rb-type-pill--active" data-type="run" aria-pressed="true">Running</button>
            <button type="button" class="rb-type-pill" data-type="race" aria-pressed="false">Race</button>
            <button type="button" class="rb-type-pill" data-type="yoga" aria-pressed="false">Yoga</button>
            <button type="button" class="rb-type-pill" data-type="custom" aria-pressed="false">Custom</button>
          </div>
        </div>

        <div class="rb-field-group">
          <label class="rb-label" for="rb-remarks">Remarks / Notes</label>
          <textarea id="rb-remarks" class="rb-input" placeholder="How did it feel? Any notes…"></textarea>
        </div>

        <div class="rb-field-group">
          <label class="rb-label" for="rb-tss">TSS <span class="rb-hint">(optional — leave blank to enter later)</span></label>
          <input id="rb-tss" class="rb-input" type="number" min="0" step="1" placeholder="Auto-estimated when blank" style="max-width:160px">
        </div>
      </div>

      <!-- Run Structure -->
      <div class="rb-card">
        <h2 class="rb-section-title">Run Structure</h2>

        <div class="rb-field-group">
          <label class="rb-label" for="rb-preset">Start from preset</label>
          <select id="rb-preset" class="rb-input" style="max-width:240px">
            <option value="easy run">Easy run</option>
            <option value="intervals">Intervals</option>
            <option value="tempo" selected>Tempo</option>
            <option value="long run">Long run</option>
            <option value="race">Race</option>
          </select>
        </div>

        <!-- Live segment bar (auto-updates) -->
        <div class="rb-seg-bar" id="rb-seg-bar"></div>

        <!-- Editable segment rows -->
        <div id="rb-seg-rows"></div>

        <button type="button" class="rb-add-btn" id="rb-add-segment">+ Add segment</button>

        <!-- Σ totals summary line -->
        <div id="rb-totals" style="margin-top:14px"></div>
      </div>

      <!-- Laps Input -->
      <div class="rb-card">
        <h2 class="rb-section-title">Laps</h2>

        <fieldset class="rb-lap-mode">
          <legend class="rb-sr-only">Lap mode</legend>
          <input type="radio" id="rb-lap-auto" name="rb-lap-mode" value="auto" class="rb-lap-radio" checked>
          <label for="rb-lap-auto" class="rb-lap-label">Auto 1 km splits</label>
          <input type="radio" id="rb-lap-manual" name="rb-lap-mode" value="manual" class="rb-lap-radio">
          <label for="rb-lap-manual" class="rb-lap-label">Manual laps</label>
        </fieldset>

        <!-- Auto lap preview -->
        <div id="rb-auto-lap-section">
          <p class="rb-auto-preview" id="rb-auto-lap-preview">Enter segment distances above</p>
        </div>

        <!-- Manual laps editor -->
        <div id="rb-manual-lap-section" style="display:none">
          <div id="rb-manual-laps"></div>
          <button type="button" class="rb-add-btn" id="rb-add-lap">+ Add lap</button>
        </div>
      </div>

      <!-- SYNC fields (device data: HR, power, cadence, stride) -->
      <div class="rb-card">
        <h2 class="rb-section-title">Device Metrics <span class="rb-label-tag rb-label-tag--sync">SYNC</span></h2>
        <p style="font-size:13px;color:var(--text-tertiary);margin:0 0 14px">These are auto-filled when a device is connected. Enter manually if you have the data.</p>
        <div class="rb-sync-grid">
          <div class="rb-sync-field">
            <label class="rb-sync-label" for="rb-sync-avg-hr">Avg HR <span class="rb-label-tag rb-label-tag--sync">SYNC</span></label>
            <input id="rb-sync-avg-hr" class="rb-sync-input" type="number" min="20" max="250" placeholder="—">
          </div>
          <div class="rb-sync-field">
            <label class="rb-sync-label" for="rb-sync-max-hr">Max HR <span class="rb-label-tag rb-label-tag--sync">SYNC</span></label>
            <input id="rb-sync-max-hr" class="rb-sync-input" type="number" min="20" max="250" placeholder="—">
          </div>
          <div class="rb-sync-field">
            <label class="rb-sync-label" for="rb-sync-elev">Elevation (m) <span class="rb-label-tag rb-label-tag--sync">SYNC</span></label>
            <input id="rb-sync-elev" class="rb-sync-input" type="number" min="0" placeholder="—">
          </div>
          <div class="rb-sync-field">
            <label class="rb-sync-label" for="rb-sync-avg-power">Avg Power (W) <span class="rb-label-tag rb-label-tag--sync">SYNC</span></label>
            <input id="rb-sync-avg-power" class="rb-sync-input" type="number" min="0" placeholder="—">
          </div>
          <div class="rb-sync-field">
            <label class="rb-sync-label" for="rb-sync-max-power">Max Power (W) <span class="rb-label-tag rb-label-tag--sync">SYNC</span></label>
            <input id="rb-sync-max-power" class="rb-sync-input" type="number" min="0" placeholder="—">
          </div>
          <div class="rb-sync-field">
            <label class="rb-sync-label" for="rb-sync-np">NP (W) <span class="rb-label-tag rb-label-tag--sync">SYNC</span></label>
            <input id="rb-sync-np" class="rb-sync-input" type="number" min="0" placeholder="—">
          </div>
          <div class="rb-sync-field">
            <label class="rb-sync-label" for="rb-sync-cad">Cadence (spm) <span class="rb-label-tag rb-label-tag--sync">SYNC</span></label>
            <input id="rb-sync-cad" class="rb-sync-input" type="number" min="0" placeholder="—">
          </div>
          <div class="rb-sync-field">
            <label class="rb-sync-label" for="rb-sync-stride">Stride (m) <span class="rb-label-tag rb-label-tag--sync">SYNC</span></label>
            <input id="rb-sync-stride" class="rb-sync-input" type="number" min="0" step="0.01" placeholder="—">
          </div>
        </div>
      </div>

      <!-- Save actions: sticky so it stays reachable without scrolling through the whole form -->
      <div class="rb-save-bar">
        <div class="rb-form-error" id="rb-form-error" role="alert"></div>
        <div class="rb-actions">
          <button type="button" class="rb-btn-secondary" onclick="history.back()">Cancel</button>
          <button type="submit" class="rb-btn-primary" id="rb-submit-btn">Save Run</button>
        </div>
      </div>

    </form>
  </main>

  <script src="js/lib/sync-poller.js"></script>

  <script src="js/nav.js"></script>
  <script src="js/zone2-constants.js"></script>
  <script src="js/run-builder.js"></script>
</body>
</html>
