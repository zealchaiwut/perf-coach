<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home – perf-coach</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/revamp.css">
</head>
<body class="rv-page">
  <div class="rv-shell rv-shell--wide">
    <header class="rv-shell-head rv-shell-head--home">
      <div class="rv-shell-head-text">
        <h1 class="rv-title rv-title--invert" id="rv-home-greet">Home</h1>
        <p class="rv-subtitle rv-subtitle--invert" id="rv-home-date">Loading…</p>
      </div>
      <nav aria-label="Primary">
        <ul class="rv-tabnav rv-tabnav--invert">
          <li><a class="rv-tab on" href="/v2/home" aria-current="page">Home</a></li>
          <li><a class="rv-tab" href="/v2/training/plan">Training</a></li>
          <li><a class="rv-tab" href="/v2/performance">Performance</a></li>
          <li id="rv-admin-tab" hidden><a class="rv-tab" href="/admin">Admin</a></li>
        </ul>
      </nav>
    </header>

    <div id="rv-home-alerts" class="rv-home-alerts" hidden></div>

    <section class="rv-card rv-home-today" id="rv-home-today" aria-live="polite">
      <p class="rv-subtitle">Loading today…</p>
    </section>

    <div class="rv-home-cols">
      <div class="rv-home-col">
        <section class="rv-card" id="rv-home-week" aria-labelledby="rv-week-h">
          <p class="rv-subtitle">Loading week…</p>
        </section>
        <section class="rv-card rv-card--soft" id="rv-home-recent" aria-labelledby="rv-recent-h"></section>
      </div>
      <div class="rv-home-col">
        <section class="rv-card" id="rv-home-next-race"></section>
        <section class="rv-card" id="rv-home-focus"></section>
        <section class="rv-card" id="rv-home-coach"></section>
      </div>
    </div>

    <p class="rv-row" style="margin-top:16px">
      <a class="rv-btn rv-btn--secondary" href="/home">Classic home</a>
      <a class="rv-btn rv-btn--secondary" href="/v2/components">Component gallery</a>
    </p>
  </div>
  <script src="/js/lib/app-common.js"></script>
  <script src="/js/v2-home.js"></script>
  <script>
    fetch("/api/auth/me").then(function (r) { return r.ok ? r.json() : null; }).then(function (u) {
      if (u && u.is_admin) document.getElementById("rv-admin-tab").hidden = false;
    });
  </script>
</body>
</html>
