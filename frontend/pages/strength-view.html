<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Strength View – perf-coach</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── Page shell ─────────────────────────────────────────────────────── */
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Inter Tight", system-ui, sans-serif;
        background: var(--page-bg);
        min-height: 100vh;
        color: var(--text-primary);
        letter-spacing: -0.01em;
      }
      main.sv-main {
        max-width: 900px;
        margin: 0 auto;
        padding: 16px 16px 56px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #sv-root {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* ── Utility ────────────────────────────────────────────────────────── */
      .u-sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* ── Back link ──────────────────────────────────────────────────────── */
      .sv-back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        align-self: flex-start;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 8px;
        padding: 8px 12px;
        min-height: 36px;
        text-decoration: none;
        line-height: 1;
      }
      .sv-back-link:hover {
        background: rgba(255, 255, 255, 0.24);
      }
      .sv-back-link:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      .sv-back-link__arrow {
        font-size: 14px;
      }

      /* ── Card shell ─────────────────────────────────────────────────────── */
      .sv-card {
        background: var(--card-bg);
        border-radius: 14px;
        border: 1px solid var(--card-border);
        box-shadow: 0 6px 20px rgba(8, 18, 48, 0.16);
        padding: 20px;
      }

      /* ── Typography ─────────────────────────────────────────────────────── */
      .sv-section-title {
        margin: 0 0 14px;
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-secondary);
      }
      .sv-empty {
        color: var(--text-tertiary);
        font-size: 13px;
        margin: 0;
      }
      .sv-error {
        background: var(--card-bg);
        border-radius: 14px;
        padding: 20px;
        color: var(--text-primary);
      }
      .sv-error__title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 6px;
        font-size: 15px;
        font-weight: 700;
        color: var(--danger);
      }
      .sv-error__msg {
        margin: 0 0 14px;
        font-size: 13px;
        color: var(--text-secondary);
      }
      .sv-retry-btn {
        appearance: none;
        border: none;
        border-radius: 8px;
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        padding: 10px 16px;
        min-height: 44px;
        cursor: pointer;
      }
      .sv-retry-btn:hover {
        background: var(--primary-dark);
      }
      .sv-retry-btn:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
        box-shadow: 0 0 0 4px var(--focus-ring);
      }

      /* ── Header card ────────────────────────────────────────────────────── */
      .sv-header {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .sv-badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        padding: 4px 9px;
        border-radius: 4px;
        color: var(--ink, #0b1530);
        align-self: flex-start;
      }
      .sv-workout-name {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        overflow-wrap: break-word;
      }
      .sv-date {
        font-size: 13px;
        color: var(--text-secondary);
      }

      /* ── Stats grid ─────────────────────────────────────────────────────── */
      .sv-stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 10px;
        margin: 0;
      }
      .sv-stat-tile {
        background: var(--tile, #f7f9fd);
        border-radius: 10px;
        padding: 12px 10px;
        text-align: center;
      }
      .sv-stat-val {
        font-family: "JetBrains Mono", monospace;
        font-size: 18px;
        font-weight: 700;
        color: var(--ink, #0b1530);
        line-height: 1.2;
        margin: 0;
      }
      .sv-stat-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--ink-2, #5c6886);
        margin: 4px 0 0;
      }

      /* ── Session-profile bar ────────────────────────────────────────────── */
      .sv-profile-bar {
        display: flex;
        align-items: flex-end;
        height: 48px;
        border-radius: 6px;
        overflow: hidden;
        gap: 2px;
      }
      .sv-profile-bar-seg {
        border-radius: 3px 3px 0 0;
        min-width: 6px;
        flex-shrink: 0;
      }
      .sv-profile-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 12px;
        padding-top: 0;
        list-style: none;
      }
      .sv-profile-legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        color: var(--ink-2, #5c6886);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .sv-profile-legend-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      /* ── Exercises ──────────────────────────────────────────────────────── */
      .sv-exercises-list {
        display: flex;
        flex-direction: column;
      }
      .sv-exercise-block {
        padding: 16px 0;
        border-top: 1px solid var(--border, #e5e7eb);
      }
      .sv-exercise-block:first-child {
        padding-top: 0;
        border-top: none;
      }
      .sv-ex-head {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .sv-ex-bullet {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .sv-ex-name {
        font-weight: 600;
        font-size: 14px;
        flex: 1 1 auto;
        min-width: 120px;
      }
      .sv-ex-count {
        font-size: 12px;
        color: var(--text-secondary);
      }
      .sv-rpe-pill {
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 4px;
        color: var(--ink, #0b1530);
        flex-shrink: 0;
      }

      /* ── Sets table ─────────────────────────────────────────────────────── */
      .sv-set-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      .sv-set-table th {
        text-align: left;
        font-family: "Inter Tight", system-ui, sans-serif;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--ink-2, #5c6886);
        padding: 6px 10px;
        border-bottom: 1px solid var(--border, #e5e7eb);
      }
      .sv-set-table td {
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        color: var(--ink, #0b1530);
        padding: 8px 10px;
        border-bottom: 1px solid rgba(11, 21, 48, 0.05);
      }
      .sv-set-table tbody tr:last-child td {
        border-bottom: none;
      }
      .sv-set-table tbody tr:nth-child(even) {
        background: var(--tile, #f7f9fd);
      }
      .sv-set-num {
        font-weight: 700;
      }

      /* ── Mobile: exercises become tinted blocks, table reflows ───────────── */
      @media (max-width: 639px) {
        .sv-exercise-block {
          background: var(--tile, #f7f9fd);
          border-radius: 10px;
          padding: 12px;
          border-top: none;
        }
        .sv-exercise-block + .sv-exercise-block {
          margin-top: 10px;
        }
        .sv-set-table thead {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip: rect(0, 0, 0, 0);
          white-space: nowrap;
        }
        .sv-set-table,
        .sv-set-table tbody,
        .sv-set-table tr {
          display: block;
          width: 100%;
        }
        .sv-set-table tbody tr {
          display: flex;
          flex-wrap: wrap;
          align-items: baseline;
          column-gap: 14px;
          row-gap: 2px;
          padding: 8px 0;
          border-bottom: 1px solid rgba(11, 21, 48, 0.08);
          background: none !important;
        }
        .sv-set-table tbody tr:last-child {
          border-bottom: none;
          padding-bottom: 0;
        }
        .sv-set-table tbody tr:first-child {
          padding-top: 0;
        }
        .sv-set-table td {
          display: flex;
          align-items: baseline;
          gap: 4px;
          padding: 0;
          border-bottom: none;
        }
        .sv-set-table td::before {
          content: attr(data-label) ":";
          font-family: "Inter Tight", system-ui, sans-serif;
          font-size: 10px;
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 0.04em;
          color: var(--ink-2, #5c6886);
        }
      }

      @media (max-width: 480px) {
        .sv-workout-name {
          font-size: 18px;
        }
        .sv-stats-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      /* ── Skeleton loading ───────────────────────────────────────────────── */
      .sv-skel-badge,
      .sv-skel-title,
      .sv-skel-date,
      .sv-skel-tile,
      .sv-skel-bar,
      .sv-skel-row {
        background: linear-gradient(90deg, #eef1f7 25%, #e4e8f2 50%, #eef1f7 75%);
        background-size: 400px 100%;
        border-radius: 6px;
        animation: sv-shimmer 1.4s ease infinite;
      }
      .sv-skel-badge {
        width: 64px;
        height: 18px;
        border-radius: 4px;
        margin-bottom: 10px;
      }
      .sv-skel-title {
        width: 60%;
        height: 22px;
        margin-bottom: 8px;
      }
      .sv-skel-date {
        width: 40%;
        height: 13px;
      }
      .sv-skel-tiles {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 10px;
      }
      .sv-skel-tile {
        height: 58px;
        border-radius: 10px;
      }
      .sv-skel-bar {
        height: 48px;
        border-radius: 6px;
      }
      .sv-skel-row {
        height: 44px;
        margin-bottom: 8px;
      }
      .sv-skel-row:last-child {
        margin-bottom: 0;
      }
      @keyframes sv-shimmer {
        0% {
          background-position: -400px 0;
        }
        100% {
          background-position: 400px 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sv-skel-badge,
        .sv-skel-title,
        .sv-skel-date,
        .sv-skel-tile,
        .sv-skel-bar,
        .sv-skel-row {
          animation: none;
          background: #eef1f7;
        }
      }
    </style>
  </head>
  <body>
    <div id="nav-placeholder"></div>

    <main class="sv-main">
      <a class="sv-back-link" href="training-log.html">
        <span class="sv-back-link__arrow" aria-hidden="true">←</span>
        Training log
      </a>

      <div id="sv-root" aria-live="polite" aria-busy="true">
        <div class="sv-card">
          <div class="sv-skel-badge"></div>
          <div class="sv-skel-title"></div>
          <div class="sv-skel-date"></div>
        </div>
        <div class="sv-card">
          <div class="sv-skel-tiles">
            <div class="sv-skel-tile"></div>
            <div class="sv-skel-tile"></div>
            <div class="sv-skel-tile"></div>
            <div class="sv-skel-tile"></div>
            <div class="sv-skel-tile"></div>
            <div class="sv-skel-tile"></div>
          </div>
        </div>
        <div class="sv-card">
          <div class="sv-skel-bar"></div>
        </div>
        <div class="sv-card">
          <div class="sv-skel-row"></div>
          <div class="sv-skel-row"></div>
          <div class="sv-skel-row"></div>
        </div>
      </div>
    </main>

    <script src="js/lib/sync-poller.js"></script>

    <script src="js/nav.js"></script>
    <script src="js/strength-view.js"></script>
  </body>
</html>
