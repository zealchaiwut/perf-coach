<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Performance (revamp) – perf-coach</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/revamp.css">
</head>
<body class="rv-page">
  <div class="rv-shell">
    <header class="rv-shell-head">
      <div><h1 class="rv-title">Performance</h1><p class="rv-subtitle">Where you stand, and what work moves it.</p></div>
      <nav aria-label="Primary">
        <ul class="rv-tabnav">
          <li><a class="rv-tab" href="/v2/home">Home</a></li>
          <li><a class="rv-tab" href="/v2/training/plan">Training</a></li>
          <li><a class="rv-tab" href="/v2/performance" aria-current="page">Performance</a></li>
        </ul>
      </nav>
    </header>

    <div id="v2-perf-shell" class="rv-stack">
      <section class="rv-card rv-stack" id="v2-perf-hero" aria-label="A race"></section>
      <section class="rv-card rv-card--soft rv-stack" id="v2-perf-after-race" aria-label="After the race"></section>
      <section class="rv-card rv-stack" id="v2-perf-radar" aria-label="Performance radar">
        <span class="rv-label">Status</span>
        <div data-perf-radar data-size="large" id="v2-perf-radar-chart"></div>
      </section>
      <section class="rv-stack" id="v2-perf-focus" aria-label="Focus"></section>
      <section class="rv-stack" id="v2-perf-score-cards" aria-label="Endurance and Speed"></section>
      <section class="rv-card rv-stack" id="v2-perf-mobility" aria-label="Mobility self-test"></section>
      <section class="rv-card rv-stack" id="v2-perf-strength-anchors" aria-label="Strength anchor lifts"></section>
    </div>
  </div>

  <div class="rv-toast" id="rv-toast" role="status" aria-live="polite"></div>
  <div id="v2-perf-drawer-backdrop" class="rv-drawer-backdrop" hidden></div>
  <aside id="v2-perf-drawer" class="rv-drawer" role="dialog" aria-modal="true" aria-labelledby="v2-perf-drawer-title" hidden>
    <div class="rv-drawer-scroll" id="v2-perf-drawer-body"></div>
  </aside>
  <script src="/js/lib/app-common.js"></script>
  <script src="/js/revamp-ui.js"></script>
  <script src="/js/lib/perf-radar.js"></script>
  <script src="/js/v2-performance.js"></script>
</body>
</html>
