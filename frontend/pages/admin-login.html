<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin – perf-coach</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100vh; }
    body {
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 380px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      width: 100%;
      box-shadow: 0 1px 2px rgba(17, 24, 39, 0.04), 0 12px 32px rgba(17, 24, 39, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--ink);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .brand-text {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .subtitle {
      margin: 0 0 24px;
      font-size: 13px;
      color: var(--text-sub);
    }

    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .field input {
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      border: 1.5px solid var(--border-input);
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface-2);
      outline: none;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .field input:focus {
      border-color: var(--ink);
      background: var(--surface);
      box-shadow: 0 0 0 4px var(--focus-ring);
    }
    .field input[aria-invalid="true"] {
      border-color: var(--danger);
    }
    .field input[aria-invalid="true"]:focus {
      box-shadow: 0 0 0 4px var(--danger-soft);
    }

    .error-msg {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: var(--danger-soft);
      color: var(--danger-dark);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
    }
    .error-msg i { font-size: 15px; flex-shrink: 0; margin-top: 1px; }

    .submit-btn {
      width: 100%;
      min-height: 44px;
      padding: 12px;
      background: var(--ink);
      color: #fff;
      border: 0;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s;
    }
    .submit-btn:hover:not(:disabled) { opacity: 0.9; }
    .submit-btn:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }
    .submit-btn:disabled { opacity: 0.6; cursor: default; }
    .submit-btn .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .submit-btn .spinner { animation-duration: 1.4s; }
    }

    @media (max-width: 440px) {
      .login-card { padding: 28px 20px; }
    }
  </style>
</head>
<body>
<main>
<div class="login-card">
  <div class="brand">
    <span class="brand-mark"><i class="ti ti-shield-lock" aria-hidden="true"></i></span>
    <span class="brand-text">perf-coach</span>
  </div>
  <h1>Admin access</h1>
  <p class="subtitle">Enter the admin secret to continue.</p>
  <form id="admin-form" novalidate>
    <div class="field">
      <label for="secret">Secret</label>
      <input type="password" id="secret" name="secret" autocomplete="off" required autofocus
             aria-invalid="false" aria-describedby="error-text">
    </div>
    <div id="error-msg" class="error-msg" role="alert" aria-live="assertive" hidden>
      <i class="ti ti-alert-circle" aria-hidden="true"></i>
      <span id="error-text"></span>
    </div>
    <button type="submit" id="submit-btn" class="submit-btn">
      <span id="btn-label">Enter</span>
    </button>
  </form>
</div>
</main>
<script>
(function () {
  'use strict';

  var form = document.getElementById('admin-form');
  var btn = document.getElementById('submit-btn');
  var btnLabel = document.getElementById('btn-label');
  var errorMsg = document.getElementById('error-msg');
  var errorText = document.getElementById('error-text');
  var secretInput = document.getElementById('secret');

  function setLoading(on) {
    btn.disabled = on;
    if (on) {
      btnLabel.textContent = '';
      var spinner = document.createElement('span');
      spinner.className = 'spinner';
      spinner.id = 'btn-spinner';
      btn.appendChild(spinner);
    } else {
      var s = document.getElementById('btn-spinner');
      if (s) s.remove();
      btnLabel.textContent = 'Enter';
    }
  }

  function showError(msg) {
    errorText.textContent = msg;
    errorMsg.hidden = false;
    secretInput.setAttribute('aria-invalid', 'true');
  }

  function hideError() {
    errorMsg.hidden = true;
    secretInput.setAttribute('aria-invalid', 'false');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    hideError();

    var secret = secretInput.value;
    if (!secret) {
      showError('Please enter the admin secret.');
      return;
    }

    setLoading(true);

    // The global CSRF fetch-patch (nav.js/user.js) is not loaded on this
    // standalone page, so attach the token manually. Fetch /api/csrf-token
    // first to ensure the csrf-token cookie exists, then send it as a header —
    // required when the visitor already has an app session cookie.
    fetch('/api/csrf-token', { method: 'GET' })
      .then(function (r) { return r.ok ? r.json() : { csrf_token: '' }; })
      .catch(function () { return { csrf_token: '' }; })
      .then(function (tok) {
        var headers = { 'Content-Type': 'application/json' };
        if (tok && tok.csrf_token) { headers['X-CSRF-Token'] = tok.csrf_token; }
        return fetch('/api/admin/login', {
          method: 'POST',
          headers: headers,
          body: JSON.stringify({ secret: secret }),
        });
      })
      .then(function (res) {
        if (res.ok) {
          window.location.href = '/admin';
        } else {
          return res.json().then(function (body) {
            setLoading(false);
            if (res.status === 429) {
              showError('Too many failed attempts. Try again later.');
            } else {
              showError('Incorrect secret.');
            }
          }).catch(function () {
            setLoading(false);
            showError('Login failed. Try again.');
          });
        }
      })
      .catch(function () {
        setLoading(false);
        showError('Network error. Check your connection.');
      });
  });
}());
</script>
</body>
</html>
