<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revamp components – perf-coach</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/revamp.css">
</head>
<body class="rv-page">
  <div class="rv-shell">
    <header class="rv-shell-head">
      <div>
        <h1 class="rv-title">Revamp components</h1>
        <p class="rv-subtitle">Design tokens and primitives (P0-6).</p>
      </div>
    </header>
    <a class="rv-btn rv-btn--secondary" href="/v2/home">Back to v2 shell</a>
    <section class="rv-card rv-stack" style="margin-top:16px">
      <span class="rv-label">Buttons</span>
      <div class="rv-row">
        <button type="button" class="rv-btn rv-btn--primary">Primary</button>
        <button type="button" class="rv-btn rv-btn--secondary">Secondary</button>
        <button type="button" class="rv-btn rv-btn--danger">Danger</button>
        <button type="button" class="rv-btn rv-btn--secondary" data-rv-drawer-open>Open drawer</button>
        <button type="button" class="rv-btn rv-btn--primary" data-rv-toast="Week saved">Toast</button>
      </div>
      <span class="rv-label">Chips and metrics</span>
      <div class="rv-row">
        <span class="rv-chip">Easy run</span>
        <div class="rv-metric"><span class="rv-label">TSS</span><br><strong>260</strong></div>
      </div>
      <span class="rv-label">Progress</span>
      <div class="rv-progress" aria-hidden="true"><span></span></div>
      <span class="rv-label">Session cards</span>
      <div class="rv-session rv-session--run">Long run — done</div>
      <div class="rv-session rv-session--support">Strength — planned</div>
      <div class="rv-session rv-session--rest">Rest day</div>
      <div class="rv-session rv-session--missed">Missed tempo</div>
    </section>
  </div>
  <div class="rv-drawer-backdrop" id="rv-drawer-backdrop" aria-hidden="true"></div>
  <aside class="rv-drawer" id="rv-drawer" aria-hidden="true" aria-label="Example drawer">
    <h2 class="rv-title" style="font-size:1.1rem">Drawer</h2>
    <p>Press Escape to close and restore focus.</p>
    <button type="button" class="rv-btn rv-btn--secondary" data-rv-drawer-close>Close</button>
  </aside>
  <div class="rv-toast" id="rv-toast" role="status" aria-live="polite"></div>
  <script src="/js/lib/app-common.js"></script>
  <script src="/js/revamp-ui.js"></script>
</body>
</html>
