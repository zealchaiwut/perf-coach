<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home – perf-coach</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" rel="stylesheet">
  <!-- gridstack.js: Home dashboard layout engine (see js/home-grid.js). extra
       css is required for column counts other than 12 (we use 8/6/4/1). -->
  <link href="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack-extra.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack-all.js"></script>
  <link rel="stylesheet" href="css/weight-current-card.css">
  <style>
    :root {
      --bg-1: #5a8dee;
      --bg-2: #1f3b8a;
      --shell-1: #eaf0fb;
      --shell-2: #d8e3f5;
      --card-border: rgba(13, 30, 67, 0.06);
      --text-primary: #0b1530;
      --text-secondary: #5c6886;
      /* #8b95ad (the previous value) failed WCAG AA at 3.0:1 on white —
         DESIGN.md documents this exact failure and its retirement to
         #6b7280 (4.9:1) for the instrument palette; applying the same fix
         here since --text-tertiary carries 50+ small labels site-wide. */
      --text-tertiary: #6b7280;
      --accent: #e4ff52;
      --accent-text: #1a2400;
      --hero-1: #b6c5ff;
      --hero-2: #8aa1ff;
      --sleep-1: #2a1d54;
      --sleep-2: #4d3a8c;
      --green: #2d5e10;
      --green-soft: #dff5d6;
      --red: #7a1a1a;
      --red-soft: #ffd9d9;
      --amber: #6b4408;
      --amber-soft: #fff0c4;
      --chip-bg: #f1f4fa;
      --card-divider: rgba(13, 30, 67, 0.05);
      --gold: #b8893c;
      --blue-text: #1e3a8a;
      --blue-soft: #dde6f8;
      --purple-text: #4f3c8c;
      --purple-soft: #ebe5f9;
      --orange-text: #8a3d12;
      --orange-soft: #ffe1d4;
      --teal-text: #1e6438;
      --teal-soft: #d4f0e2;
      /* Home v3 color grouping (Task 4) — paired tint stops following the
         existing --bg-1/--bg-2, --hero-1/--hero-2, --sleep-1/--sleep-2
         naming convention. Blue tint reuses the existing --shell-1/--shell-2
         pair directly (no new tokens needed); amber tint is new since no
         light/dark amber PAIR existed (--amber/--amber-soft are text/chip
         colors, not a gradient pair). */
      --amber-tint-1: #fffaf0;
      --amber-tint-2: #fdecc8;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter Tight', system-ui, sans-serif;
      color: var(--text-primary);
      background: radial-gradient(ellipse at top left, var(--bg-1) 0%, var(--bg-2) 70%);
      min-height: 100vh;
      letter-spacing: -0.01em;
    }

    /* Baseline visible focus ring for every interactive element on this page
       (links, buttons, inputs, and div-based custom controls like
       .hw-check-circle) — keyboard-only, via :focus-visible, so mouse/touch
       taps stay clean. Individual controls with a specific tokenized surface
       (chip/pill buttons, steppers) may override with an inset variant, but
       nothing on this page should ship with an invisible focus state. */
    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid #2b4ca8;
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* ---- PAGE ----
       Widened from 760px (home v2 layout follow-up #2): the unified dashboard
       grid below needs real desktop width to pack 3-4 widgets per row —
       760px only ever fit 2 columns of a sane card width, so the auto-fit
       grid's column count is capped by THIS max-width, not just its own
       minmax floor. 1320 fits 4 columns of minmax(280px,1fr) + 16px gaps
       (4*280 + 3*16 = 1168 <= 1320 - 2*28 padding = 1264) at 1280-1440
       viewport widths. */
    .page {
      max-width: 1320px;
      margin: 0 auto;
      padding: 28px;
    }
    .greeting { margin-bottom: 22px; }
    .greeting h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: #fff;
      text-shadow: 0 1px 8px rgba(0,0,0,0.15);
    }
    .greeting p {
      margin: 6px 0 0;
      color: rgba(255,255,255,0.78);
      font-size: 14px;
    }

    /* ---- DASHBOARD GRID (gridstack.js — see js/home-grid.js) ----
       gridstack packs the widgets (float:false auto-compaction) and sizes each
       item's height to its content (sizeToContent), driven by the registry in
       home-grid.js — no hand-placed grid-column/grid-row and no per-breakpoint
       @media grid rules here anymore. These rules only strip gridstack's own
       chrome so each widget's existing .card styling shows through unchanged.
       #home-log-today-strip, #body-modifier-guardrail, #strava-stale-banner,
       and #row-log stay OUTSIDE this grid. */
    #home-dashboard-grid.grid-stack { margin-bottom: 16px; }
    #home-dashboard-grid .grid-stack-item-content {
      background: transparent;
      border-radius: 20px;
      overflow: visible;
      padding: 0;
      /* No `inset:0` here — gridstack insets the content by its `margin` option
         (see home-grid.js) to create the gaps between widgets; overriding inset
         would collapse those gaps. */
    }
    /* The widget container fills the item's WIDTH; its height must stay natural
       (auto) so gridstack's sizeToContent can measure the real content height —
       forcing height:100% here collapses that measurement to the item's current
       (often still-empty) height and the content then overflows into its
       neighbours. */
    #home-dashboard-grid .grid-stack-item-content > * {
      width: 100%;
      height: auto;
    }

    @media (max-width: 759px) {
      .page { padding: 14px; }
      .card { padding: 12px; }
      /* card-head's default 14px margin-bottom is the next-biggest whitespace
         cost inside a 12px-padded card, so it gets pulled in a notch too. */
      .card-head { margin-bottom: 13px; }
      /* These widgets set their own id-selector padding, which beats the .card
         override above on specificity — restate it so the tighter padding
         actually reaches them. */
      #home-top-row-right,
      #home-habits-widget,
      #home-training-card,
      #home-weight-widget .card { padding: 12px; }
    }

    /* Card affordance: hover lift conveys "this is interactive" (most tiles
       carry a "-> " link or clickable row) — state, not decoration. Instant
       fallback under reduced motion. */
    .card {
      transition: box-shadow 200ms cubic-bezier(0.22, 1, 0.36, 1),
                  transform 200ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .card:hover {
      box-shadow: 0 10px 28px rgba(13, 30, 67, 0.12), 0 2px 8px rgba(13, 30, 67, 0.06);
      transform: translateY(-2px);
    }
    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .card:hover { transform: none; }
    }

    /* ---- CARD ---- */
    .card {
      background: #fff;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      padding: 22px;
      display: flex;
      flex-direction: column;
    }

    /* ---- HOME V3 COLOR GROUPING (Task 4) ----
       Training cluster (Readiness/Next+Recent/Performance/Training/Personal
       records/Habits) shares one light blue tint; Weight gets its own soft
       amber tint. Sleep is untouched (keeps its own dark indigo background).
       Habits follows the prose spec here, NOT the reference mock's separate
       green .grp-habits class — the mock's own markup contradicted its
       prose on this point; prose wins. */
    .grp-training { background: linear-gradient(150deg, var(--shell-1), var(--shell-2)); }
    .grp-weight   { background: linear-gradient(150deg, var(--amber-tint-1), var(--amber-tint-2)); }

    /* ---- Readiness factor arrows (shared by the compact readiness tile's
       top-3-factors row, #home-top-row-right .rd-tile-factor) ---- */
    .rd-arrow { font-size: 14px; font-weight: 700; }
    .rd-arrow--positive { color: var(--green); }
    .rd-arrow--negative { color: var(--red); }
    .rd-arrow--neutral  { color: var(--text-tertiary); }

    /* ---- SLEEP HERO CARD ---- */
    .sleep-card {
      background: linear-gradient(160deg, var(--sleep-1) 0%, var(--sleep-2) 100%);
      color: #fff;
      border: 0;
      min-height: 280px;
      padding: 22px;
    }
    .sleep-card .slp-lbl {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 12px;
    }
    .sleep-card .slp-body {
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .sleep-card .slp-score {
      font-size: 56px;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .sleep-card .slp-score small {
      font-size: 19px;
      opacity: 0.5;
      font-weight: 500;
    }
    .sleep-card .slp-quality {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      margin: 4px 0 0;
    }
    /* Fills the gap below slp-quality with the numeric Quality X/5 readout
       (was previously unstyled — inherited body defaults with no size/
       spacing rule at all, so it rendered oversized and mismatched). */
    .sleep-card .slp-quality-detail {
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      margin: 2px 0 16px;
    }
    .sleep-card .slp-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      text-align: center;
      padding: 20px 0;
    }

    /* ---- CARD HEADER (shared) ---- */
    .card-head {
      display: flex; align-items: center; justify-content: space-between;
      /* Narrower tiles (home v2 unified grid, ~280-340px) can't always fit
         title + trailing link on one line — wrap instead of letting them
         crowd/touch ("PerformanceView trends →"). row-gap keeps the wrapped
         link from sitting flush under the title. */
      flex-wrap: wrap;
      row-gap: 4px;
      margin-bottom: 14px;
    }
    .card-head .ttl { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; min-width: 0; }
    .card-head .ttl i { font-size: 17px; color: var(--text-tertiary); }
    .card-head a { font-size: 12px; color: #2b4ca8; text-decoration: none; white-space: nowrap; }
    .card-head .meta { font-size: 12px; color: var(--text-tertiary); }

    /* ---- PERSONAL RECORDS CARD (home v3, Task 6 — 10K/Half/Marathon tiles
       from /api/athletes/{id}/run-personal-records, see loadPerformanceCard) ---- */
    .pr-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .pr-tile {
      background: var(--chip-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 9px;
      text-align: center;
    }
    .pr-lbl {
      font-size: 8px; font-weight: 800; color: var(--text-tertiary);
      text-transform: uppercase; letter-spacing: 0.03em;
    }
    .pr-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px; font-weight: 800; margin-top: 5px;
    }
    .pr-date { font-size: 9px; color: var(--text-tertiary); font-family: 'JetBrains Mono', monospace; margin-top: 3px; }

    .perf-empty {
      padding: 28px 4px;
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .perf-empty a { color: #2b4ca8; text-decoration: none; }

    /* ---- RECENT WORKOUTS (rendered as .nw-row entries inside
       #home-recent-workout-section — see NEXT WORKOUT CARD rules below) ---- */
    .workouts-empty {
      font-size: 13.5px; color: var(--text-secondary);
      padding: 16px 4px; line-height: 1.5;
    }

    /* ---- Strava stale sync banner ----
       Card-treatment matching .bm-guardrail's small-notice pattern
       (background/border/radius/padding scale) — was bare floating text
       directly on the page's blue gradient background, which now sits right
       after the log-today strip (above the dashboard grid) instead of nestled
       between two large cards, so the lack of a container reads as broken. */
    .strava-stale-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 16px;
      margin-bottom: 14px;
      font-size: 12.5px;
      color: #64748b;
    }
    .strava-stale-banner--syncing { color: #3a4361; font-style: italic; }
    .strava-stale-msg { flex: 1; }
    .strava-stale-banner a { color: #FC4C02; font-weight: 600; text-decoration: none; }
    .strava-stale-banner a:hover { text-decoration: underline; }

    /* ---- BODY-MODIFIER GUARDRAIL WARNING (issue #1161) ---- */
    .bm-guardrail {
      display: flex; align-items: flex-start; gap: 10px;
      background: #fff7ed; border: 1px solid #fb923c; border-radius: 10px;
      padding: 12px 16px; margin-bottom: 14px; font-size: 13px; line-height: 1.5;
    }
    .bm-guardrail-icon { font-size: 18px; flex-shrink: 0; line-height: 1; margin-top: 1px; }
    .bm-guardrail-label { font-weight: 700; color: #c2410c; margin-right: 4px; }
    .bm-guardrail-msg { color: #7c2d12; }

    /* ---- HOME WEIGHT WIDGET (full-width) ---- */
    #home-weight-widget .card { padding: 22px; }
    .hww-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    .hww-main { display: flex; flex-direction: column; gap: 0; }
    .hww-top-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .hww-current { font-size: 36px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
    .hww-unit { font-size: 14px; color: var(--text-tertiary); font-weight: 500; }
    .hww-gap-pill {
      font-size: 11px; font-weight: 600; padding: 3px 9px;
      border-radius: 999px; white-space: nowrap; margin-left: 6px;
    }
    .hww-gap--behind { background: var(--red-soft); color: var(--red); }
    .hww-gap--ahead  { background: var(--green-soft); color: var(--green); }
    .hww-gap--flat   { background: var(--chip-bg); color: var(--text-tertiary); }
    .hww-avg { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
    .hww-sparkline {
      width: 100%; height: 52px; display: block;
      overflow: visible; flex-shrink: 0; margin-top: 8px;
    }
    .hww-rate { font-size: 12px; margin-top: 6px; font-weight: 500; }
    .hww-rate--goal  { color: var(--green); }
    .hww-rate--flat  { color: var(--text-tertiary); }
    .hww-progress-wrap { margin-top: 8px; }
    .hww-progress-bar {
      height: 4px; border-radius: 2px;
      background: var(--chip-bg); overflow: hidden;
    }
    .hww-progress-fill { height: 100%; border-radius: 2px; background: #2b4ca8; }
    .hww-goal-line { font-size: 11.5px; color: var(--text-secondary); margin-top: 6px; line-height: 1.5; }
    .hww-goal-line a { color: #2b4ca8; text-decoration: none; }
    .hww-no-data { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-top: 8px; }
    /* Stepper section */
    .hww-stepper { display: flex; flex-direction: column; gap: 12px; }
    .hww-stepper-label {
      font-size: 11px; font-weight: 600; color: var(--text-tertiary);
      text-transform: uppercase; letter-spacing: 0.07em;
    }
    .hww-step-row {
      display: flex; align-items: center; gap: 0;
      border: 1.5px solid var(--card-border); border-radius: 12px;
      overflow: hidden; background: #f7f9fd;
    }
    .hww-step-btn {
      width: 48px; min-height: 48px; background: var(--chip-bg);
      color: var(--text-primary); border: 0; font-size: 22px;
      font-family: inherit; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .hww-step-btn:hover { background: #dde6f8; }
    .hww-step-btn:active { background: #c8d6f4; }
    .hww-step-input {
      flex: 1; min-width: 0; border: 0; background: transparent;
      text-align: center; font-family: 'JetBrains Mono', monospace;
      font-size: 20px; font-weight: 600; letter-spacing: -0.02em;
      color: var(--text-primary); padding: 10px 4px;
      -moz-appearance: textfield; min-height: 48px;
    }
    .hww-step-input::-webkit-outer-spin-button,
    .hww-step-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .hww-step-input:focus { outline: none; box-shadow: inset 0 0 0 2px #2b4ca8; border-radius: 6px; }
    .hww-log-btn {
      width: 100%; padding: 14px 20px; background: var(--accent);
      color: var(--accent-text); border: 0; border-radius: 12px;
      font-family: inherit; font-size: 14px; font-weight: 700;
      cursor: pointer; letter-spacing: -0.01em; min-height: 48px;
      transition: opacity 0.12s;
    }
    .hww-log-btn:disabled { opacity: 0.55; cursor: default; }
    .hww-compact {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px; background: var(--green-soft);
      border-radius: 12px; font-size: 13px; font-weight: 500; color: var(--green);
    }
    .hww-compact-edit {
      margin-left: auto; font-size: 12px; font-weight: 600;
      color: #2b4ca8; cursor: pointer; text-decoration: none; background: none;
      border: 0; font-family: inherit; padding: 0;
    }
    @media (max-width: 880px) {
      .hww-layout { grid-template-columns: 1fr; gap: 20px; }
      .hww-current { font-size: 32px; }
    }

    /* #row-log wraps the live Fast-log form (revealed by the Log-today
       strip's CTA — see FAST LOG FORM rules below and home-strip-habits.js). */
    #row-log { margin-bottom: 16px; }

    /* ---- FAST LOG FORM ---- */
    .fast-log {
      padding: 20px 22px 22px;
      border-left: 3px solid var(--bg-1);
    }
    .fast-log .card-head { margin-bottom: 16px; }

    .fm-fields {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .fm-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .fm-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .fm-unit {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-tertiary);
      text-transform: none;
      letter-spacing: 0;
      margin-left: 3px;
    }
    .fm-optional {
      font-size: 10px;
      font-weight: 400;
      color: var(--text-tertiary);
      text-transform: none;
      letter-spacing: 0;
    }

    /* Stepper row: [−] [input] [+] */
    .fm-stepper {
      display: flex;
      align-items: center;
      gap: 0;
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      background: #f7f9fd;
    }
    .fm-step-btn {
      width: 48px;
      min-height: 48px;
      background: var(--chip-bg);
      color: var(--text-primary);
      border: 0;
      font-size: 20px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .fm-step-btn:hover { background: #dde6f8; }
    .fm-step-btn:active { background: #c8d6f4; }
    .fm-step-btn:disabled { opacity: 0.35; cursor: default; }
    .fm-input {
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      padding: 10px 4px;
      -moz-appearance: textfield;
      min-height: 48px;
    }
    .fm-input::-webkit-outer-spin-button,
    .fm-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .fm-input:focus { outline: none; box-shadow: inset 0 0 0 2px #2b4ca8; border-radius: 6px; }

    /* Segmented pill groups */
    .fm-pills {
      display: flex;
      gap: 8px;
    }
    .fm-pill {
      flex: 1;
      min-height: 44px;
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      background: var(--chip-bg);
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .fm-pill:hover { background: #dde6f8; border-color: #2b4ca8; color: #2b4ca8; }
    .fm-pill.active {
      background: #0b1530;
      border-color: #0b1530;
      color: #fff;
    }

    /* Textarea */
    .fm-textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      background: #f7f9fd;
      color: var(--text-primary);
      resize: vertical;
      min-height: 80px;
    }
    .fm-textarea:focus { outline: none; border-color: #2b4ca8; background: #fff; }

    /* Save row */
    .fm-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 18px;
    }
    .fm-save-btn {
      padding: 13px 28px;
      background: #0b1530;
      color: #fff;
      border: 0;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: -0.01em;
      min-height: 48px;
    }

      font-size: 12.5px;
      color: rgba(11, 21, 48, 0.72);
      margin-top: 14px;

      border-top: 1px solid rgba(11, 21, 48, 0.08);
      line-height: 1.5;

    /* ---- NEXT WORKOUT CARD (home-next-workout-card) ----
       home v3 (Task 1): this card now holds two merged sub-sections (Next
       workout / Recent workout), each with its own sub-head + link row
       (.nw-worksub/.nw-subhead) and a thin divider (.nw-sep) between them —
       "nw-" prefix kept for the whole card, not renamed to a shared
       cross-widget name, since it's still this one card's own scoped
       vocabulary. */
    .nw-worksub {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .nw-subhead {
      font-size: 10px;
      font-weight: 800;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .nw-worksub a { font-size: 12px; color: #2b4ca8; text-decoration: none; white-space: nowrap; }
    .nw-sep {
      border-top: 1px solid var(--card-divider);
      margin: 13px 0;
    }
    /* Rows are a 3-column grid — [fixed label col][name/meta][arrow] — so the
       name column starts at the same x on every row (Next and Recent alike),
       regardless of whether the badge reads RUN or STRENGTH. Recent rows omit
       the arrow; the auto arrow column collapses to 0 so names still align. */
    #home-next-workout-section, #home-recent-workout-section { display: flex; flex-direction: column; gap: 9px; }
    .nw-row {
      display: grid;
      grid-template-columns: 62px 1fr auto;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }

      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 3px 0;
      border-radius: 6px;
      text-transform: uppercase;
      text-align: center;
      justify-self: stretch;

      font-size: 13.5px; font-weight: 700; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .nw-meta {
      font-size: 11px; color: var(--text-secondary); font-family: 'JetBrains Mono', monospace;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;

    .nw-arrow { font-size: 14px; color: #2b4ca8; font-weight: 700; flex-shrink: 0; }
    .nw-empty, .nw-loading { font-size: 13.5px; color: var(--text-secondary); padding: 4px 0; }
    .nw-empty a { color: #2b4ca8; text-decoration: none; }

    /* ---- TRAINING CARD: 8-week trend link-out ---- */
    .tw-trendlink {

      margin-top: 9px;
      display: inline-block;
      text-decoration: none;

    /* ---- PERFORMANCE CARD (home-performance-card) ----
       Distinct "hperf-" prefix — #home-perf-container's "Personal records"
       card already owns the "perf-" prefix; unrelated widget, same-name
       coincidence only, do not collide with or touch it. */
    /* Stacked (1 column, "2 lines") instead of side-by-side — frees up width
       so each tile can run full-card-width, letting the score number itself
       be sized up instead of being squeezed into a half-width tile. */
    .hperf-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }

    #home-performance-card .hperf-grid { flex: 1; align-content: center; }

      padding: 16px 18px;

    .hperf-delta--down { color: var(--red); }

    @media (max-width: 640px) {

      border: 1.5px solid rgba(13,30,67,0.12); cursor: pointer; font-family: inherit;
    }
    .goal-form__cancel:hover { background: rgba(13,30,67,0.04); }
    .goal-display { display: flex; align-items: center; gap: 12px; }
    .goal-display__main { flex: 1; min-width: 0; }
    .goal-display__title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
    .goal-display__sub { font-size: 13px; color: var(--text-secondary); margin-top: 3px; }
    .goal-display__edit {
      flex-shrink: 0; padding: 6px 13px; border-radius: 999px; background: transparent;
      color: var(--text-secondary); font-size: 12px; font-weight: 500;
      border: 1.5px solid rgba(13,30,67,0.12); cursor: pointer; font-family: inherit;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .goal-display__edit:hover { background: rgba(13,30,67,0.04); }
  </style>
</head>
<body>

<!-- MAIN PAGE -->
<main class="page">
  <div class="greeting">
    <h1 id="greeting-text">Good morning</h1>
    <p id="greeting-date"></p>
  </div>

  <!-- Quick-log injury/illness action -->
  <div style="padding:0 16px 4px; display:flex; justify-content:flex-end;">
    <button id="home-injury-log-btn" type="button"
      style="display:inline-flex; align-items:center; gap:6px; padding:7px 14px;
             border-radius:999px; border:1.5px solid rgba(255,255,255,0.35);
             background:rgba(255,255,255,0.15); color:#fff;
             font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit;
             letter-spacing:-.01em; backdrop-filter:blur(4px);">
      <span aria-hidden="true" style="font-size:15px;">🩹</span> Log niggle / illness
    </button>
  </div>

  <!-- Log-today strip (rendered by JS) -->
  <div id="home-log-today-strip"></div>

  <!-- Active injury/illness/niggle strip -->
  <div id="home-injury-strip" style="padding:0 16px;"></div>

  <!-- Banners — stay outside the dashboard grid below, in their own full-width
       block, so they don't have to interrupt a single continuous grid flow. -->
  <div id="body-modifier-guardrail"></div>
  <div id="strava-stale-banner"></div>

  <!-- Dashboard grid — gridstack.js engine (js/home-grid.js). Each widget is a
       .grid-stack-item wrapping the SAME container id it always used; the
       renderers (home.js / home-readiness-training-sleep.js /
       home-strip-habits.js) fill those ids unchanged. gridstack owns width +
       position from home-grid.js's registry (this DOM order = the fixed widget
       order: Readiness → Next+Recent → Performance → Training → Personal
       records → Habits → Weight → Sleep) and auto-fits each item's height to
       content. gs-w is stamped by home-grid.js per breakpoint before init.
       #home-log-today-strip, #body-modifier-guardrail, #strava-stale-banner,
       and #row-log stay OUTSIDE this grid. -->
  <div id="home-dashboard-grid" class="grid-stack">
    <div class="grid-stack-item"><div class="grid-stack-item-content"><div id="home-top-row-right" class="grp-training"></div></div></div>
    <div class="grid-stack-item"><div class="grid-stack-item-content"><div id="home-today-rec-card" class="card grp-training"></div></div></div>
    <div class="grid-stack-item"><div class="grid-stack-item-content"><div id="home-next-workout-card" class="card grp-training"></div></div></div>
    <div class="grid-stack-item"><div class="grid-stack-item-content"><div id="home-performance-card" class="card grp-training"></div></div></div>
    <div class="grid-stack-item"><div class="grid-stack-item-content"><div id="home-training-card" class="card grp-training"></div></div></div>
    <div class="grid-stack-item"><div class="grid-stack-item-content"><div id="home-perf-container"></div></div></div>
    <div class="grid-stack-item"><div class="grid-stack-item-content"><div id="home-habits-widget" class="card grp-training"></div></div></div>
    <div class="grid-stack-item"><div class="grid-stack-item-content"><div id="home-weight-widget"></div></div></div>
    <div class="grid-stack-item"><div class="grid-stack-item-content"><div id="home-sleep-card" class="card sleep-card"></div></div></div>
    <div class="grid-stack-item"><div class="grid-stack-item-content"><div id="home-goal-card" class="card"></div></div></div>
  </div>

  <!-- Fast-log form: revealed when Log Today strip CTA is tapped.
       hidden by default (frontend/js/home-strip-habits.js's lts-cta-btn click
       handler removes the attribute) — the "revealed when tapped" comment
       above was previously aspirational: nothing actually hid this before. -->
  <div id="row-log" style="margin-top:16px;" hidden>
    <section id="fast-log-section" class="card fast-log">
      <div class="card-head">
        <div class="ttl"><i class="ti ti-pencil-plus"></i>Log Today</div>
        <span id="fast-log-date-label" class="meta"></span>
      </div>
      <form id="fast-log-form" novalidate>
        <div class="fm-fields">

          <!-- RHR (30–120) -->
          <div class="fm-field">
            <label class="fm-label" for="fm-rhr">
              Resting HR <span class="fm-unit">bpm</span>
            </label>
            <div class="fm-stepper">
              <button id="fm-rhr-minus" type="button" class="fm-step-btn" aria-label="Decrease RHR">−</button>
              <input id="fm-rhr" class="fm-input" type="number"
                min="30" max="120" step="1" inputmode="numeric" placeholder="—"
                autocomplete="off">
              <button id="fm-rhr-plus" type="button" class="fm-step-btn" aria-label="Increase RHR">+</button>
            </div>
          </div>

          <!-- HRV (0–200) -->
          <div class="fm-field">
            <label class="fm-label" for="fm-hrv">
              HRV <span class="fm-unit">ms</span>
            </label>
            <div class="fm-stepper">
              <button id="fm-hrv-minus" type="button" class="fm-step-btn" aria-label="Decrease HRV">−</button>
              <input id="fm-hrv" class="fm-input" type="number"
                min="0" max="200" step="1" inputmode="numeric" placeholder="—"
                autocomplete="off">
              <button id="fm-hrv-plus" type="button" class="fm-step-btn" aria-label="Increase HRV">+</button>
            </div>
          </div>

          <!-- Sleep hours (0–12, step 0.5) -->
          <div class="fm-field">
            <label class="fm-label" for="fm-sleep">
              Sleep <span class="fm-unit">hours</span>
            </label>
            <div class="fm-stepper">
              <button id="fm-sleep-minus" type="button" class="fm-step-btn" aria-label="Decrease sleep">−</button>
              <input id="fm-sleep" class="fm-input" type="number"
                min="0" max="12" step="0.5" inputmode="decimal" placeholder="—"
                autocomplete="off">
              <button id="fm-sleep-plus" type="button" class="fm-step-btn" aria-label="Increase sleep">+</button>
            </div>
          </div>

          <!-- Fueling / Intake (kcal) -->
          <div class="fm-field">
            <label class="fm-label" for="fm-kcal">
              Intake <span class="fm-unit">kcal</span>
              <span class="fm-optional">(optional)</span>
            </label>
            <div class="fm-stepper">
              <button id="fm-kcal-minus" type="button" class="fm-step-btn" aria-label="Decrease intake">−</button>
              <input id="fm-kcal" class="fm-input" type="number"
                min="1" max="10000" step="50" inputmode="numeric" placeholder="—"
                autocomplete="off">
              <button id="fm-kcal-plus" type="button" class="fm-step-btn" aria-label="Increase intake">+</button>
            </div>
          </div>

          <!-- Energy (1–5 segmented pills) -->
          <div class="fm-field">
            <label class="fm-label">Energy</label>
            <div class="fm-pills" id="fm-energy-pills" role="group" aria-label="Energy 1 to 5">
              <button type="button" class="fm-pill" data-val="1">1</button>
              <button type="button" class="fm-pill" data-val="2">2</button>
              <button type="button" class="fm-pill" data-val="3">3</button>
              <button type="button" class="fm-pill" data-val="4">4</button>
              <button type="button" class="fm-pill" data-val="5">5</button>
            </div>
            <input type="hidden" id="fm-energy-val" name="energy">
          </div>

          <!-- Mood (1–5 segmented pills) -->
          <div class="fm-field">
            <label class="fm-label">Mood</label>
            <div class="fm-pills" id="fm-mood-pills" role="group" aria-label="Mood 1 to 5">
              <button type="button" class="fm-pill" data-val="1">1</button>
              <button type="button" class="fm-pill" data-val="2">2</button>
              <button type="button" class="fm-pill" data-val="3">3</button>
              <button type="button" class="fm-pill" data-val="4">4</button>
              <button type="button" class="fm-pill" data-val="5">5</button>
            </div>
            <input type="hidden" id="fm-mood-val" name="mood">
          </div>

          <!-- Weight (optional, 30–200) -->
          <div class="fm-field">
            <label class="fm-label" for="fm-weight">
              Weight <span class="fm-unit">kg</span>
              <span class="fm-optional">(optional)</span>
            </label>
            <div class="fm-stepper">
              <button id="fm-weight-minus" type="button" class="fm-step-btn" aria-label="Decrease weight">−</button>
              <input id="fm-weight" class="fm-input" type="number"
                min="30" max="200" step="1" inputmode="decimal" placeholder="—"
                autocomplete="off">
              <button id="fm-weight-plus" type="button" class="fm-step-btn" aria-label="Increase weight">+</button>
            </div>
          </div>

          <!-- Notes (optional textarea) -->
          <div class="fm-field">
            <label class="fm-label" for="fm-notes">
              Notes <span class="fm-optional">(optional)</span>
            </label>
            <textarea id="fm-notes" class="fm-textarea" rows="3"
              placeholder="How are you feeling today?"></textarea>
          </div>

        </div><!-- /.fm-fields -->

        <div class="fm-actions">
          <button id="fm-save" type="submit" class="fm-save-btn">Save</button>
          <div id="fm-feedback" class="fm-feedback"></div>
        </div>
      </form>
    </section>
  </div>
</main>

<script src="js/lib/sync-poller.js"></script>

<script src="js/nav.js"></script>
<script src="js/ui-states.js"></script>
<script src="js/wheel-helpers.js"></script>
<script src="js/home-strip-habits.js"></script>
<script src="js/home-readiness-training-sleep.js"></script>
<script src="js/lib/weight-current-card.js"></script>
<script src="js/home.js"></script>
<script src="js/home-grid.js"></script>

<script src="js/injury-log.js"></script>
<script>
  document.getElementById('home-injury-log-btn').addEventListener('click', () => InjuryLog.openModal());
  InjuryLog.renderActiveStrip('home-injury-strip');
</script>

<script src="js/env.js"></script>
</body>
</html>
