<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home – perf-coach</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/load-readiness-tiles.css?v=20260801a">
  <!-- Shared design tokens (issue: Home anti-pattern audit, re-audit #6) —
       this page used to skip styles.css entirely and re-declare a full
       parallel :root with the same names (--bg-1, --text-tertiary,
       --accent, --green, ...), which is the exact duplicate-namespace
       pattern the original baseline audit blamed for a contrast bug.
       Every token below that collides with a styles.css name has the
       IDENTICAL value there (verified by diff during the fix), so linking
       it in is a no-op for existing rendering — only Home-specific tokens
       with no styles.css equivalent stay declared locally below. Placed
       BEFORE the local <style> blocks so same-specificity rules below
       still win the cascade (nothing here changes visually). -->
  <link rel="stylesheet" href="css/styles.css">
  <style>
    :root {
      /* Home-only tokens — no equivalent in styles.css's shared
         --bg-1/--bg-2/--shell-1/--shell-2/--card-border/--text-primary/
         --text-secondary/--text-tertiary/--accent/--accent-text/--green/
         --green-soft/--red/--red-soft/--amber/--amber-soft (all identical
         values there now, so those were deleted from here). */
      --hero-1: #b6c5ff;
      --hero-2: #8aa1ff;
      --sleep-1: #2a1d54;
      --sleep-2: #4d3a8c;
      --chip-bg: #f1f4fa;
      --card-divider: rgba(13, 30, 67, 0.05);
      /* Darkened from #b8893c (re-audit #12): the original failed the
         3:1 non-text contrast minimum as a border on --amber-soft
         (2.77:1). This variant clears 3.4:1 there and reads as the
         same gold/bronze everywhere else it's used (trophy icon). */
      --gold: #a67a2e;
      --blue-text: #1e3a8a;
      --blue-soft: #dde6f8;
      --purple-text: #4f3c8c;
      --purple-soft: #ebe5f9;
      --orange-text: #8a3d12;
      --orange-soft: #ffe1d4;
      --teal-text: #1e6438;
      --teal-soft: #d4f0e2;
      /* Redesign (issue: Home anti-pattern audit, Task 4) — link-blue was a
         bare literal (#2b4ca8) repeated ~24 times across this file with no
         token; promoted here. No --link-hover: none of the existing hover
         states on this page actually change this color (they swap
         background or add an underline instead), so there's nothing to
         capture. */
      --link: #2b4ca8;
      /* Coach brief v4 / Week plan reinvented an "info" indigo and a "rest"
         sky-blue as raw hex in several places (tags, badges, chips) instead
         of reusing this file's own token vocabulary — promoted the two
         repeated ones (2+ raw uses each) to tokens, same text/soft pairing
         convention as blue/purple/orange/teal above. */
      --indigo-text: #3b4bb8;
      --indigo-soft: #e4e8fd;
      --sky-text: #0369a1;
      --sky-soft: #e0f2fe;
      /* Home v3 color grouping (Task 4) — paired tint stops following the
         existing --bg-1/--bg-2, --hero-1/--hero-2, --sleep-1/--sleep-2
         naming convention. Blue tint reuses the existing --shell-1/--shell-2
         pair directly (no new tokens needed); amber tint is new since no
         light/dark amber PAIR existed (--amber/--amber-soft are text/chip
         colors, not a gradient pair). */
      --amber-tint-1: #fffaf0;
      --amber-tint-2: #fdecc8;
      /* Amber-family consolidation (re-audit #8) — .bm-guardrail and the
         threshold banner each reinvented their own raw-hex amber
         ramp (orange-50/400/700/900 and amber-50/300/700/800/900
         respectively) instead of this file's own --amber/--amber-soft.
         Both now use --amber/--amber-soft for text/background; --gold
         (already used for the trophy icon) doubles as the shared mid-tone
         border so no third amber family gets invented for that role. */
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter Tight', system-ui, sans-serif;
      color: var(--text-primary);
      background: radial-gradient(ellipse at top left, var(--bg-1) 0%, var(--bg-2) 70%);
      min-height: 100vh;
      letter-spacing: -0.01em;
    }

    /* Baseline visible focus ring for every interactive element on this page
       (links, buttons, inputs, and div-based custom controls like
       .hw-check-circle) — keyboard-only, via :focus-visible, so mouse/touch
       taps stay clean. Individual controls with a specific tokenized surface
       (chip/pill buttons, steppers) may override with an inset variant, but
       nothing on this page should ship with an invisible focus state. */
    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* ---- PAGE ----
       Widened from 760px (home v2 layout follow-up #2): the unified dashboard
       grid below needs real desktop width to pack 3-4 widgets per row —
       760px only ever fit 2 columns of a sane card width, so the auto-fit
       grid's column count is capped by THIS max-width, not just its own
       minmax floor. 1320 fits 4 columns of minmax(280px,1fr) + 16px gaps
       (4*280 + 3*16 = 1168 <= 1320 - 2*28 padding = 1264) at 1280-1440
       viewport widths. */
    .page {
      max-width: 1320px;
      margin: 0 auto;
      /* Match mock home-revamp-v2 (14px 24px) so morning + cols share one edge */
      padding: 14px 24px 46px;
    }
    .greeting { margin-bottom: 22px; }
    .greeting h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: #fff;
      text-shadow: 0 1px 8px rgba(0,0,0,0.15);
    }
    .greeting p {
      margin: 6px 0 0;
      color: rgba(255,255,255,0.78);
      font-size: 14px;
    }

    /* ---- HOME REVAMP v2: MORNING STRIP + TWO-COLUMN STACKS ----
       Mock-faithful layout: #home-cols is a 2-col grid of .home-col flex
       stacks (not a flat grid of 9 cards with shared row tracks — that made
       Week plan stretch left-column rows and leave blue holes under Race).
       Mobile ≤900px: .home-col { display:contents } so card `order` still
       stacks as morning → workout → coach → weight → race → perf →
       readiness → training → week plan → recent. */
    #home-morning { margin-bottom: 13px; width: 100%; }
    #home-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
      align-items: start;
      width: 100%;
      margin-bottom: 16px;
    }
    .home-col {
      display: flex;
      flex-direction: column;
      gap: 13px;
      min-width: 0;
    }

    @media (max-width: 900px) {
      #home-cols {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .home-col { display: contents; }
      #home-next-up              { order: 1; }
      #home-today-rec-card       { order: 2; }
      #home-weight-trend         { order: 3; }
      #home-race-card            { order: 4; }
      #home-performance-card     { order: 5; }
      #home-top-row-right        { order: 6; }
      #home-training-card        { order: 7; }
      #home-brief-week-plan-card { order: 8; }
      #home-recent-workouts-card { order: 9; }
    }

    /* Breakpoint consolidation (redesign pass): was 759px, one of three
       uncoordinated systems on this page (CSS @media at 430/640/759/880 vs.
       home-grid.js's colFor() at 480/760/1000) — none matching the
       project's documented mobile<640 / tablet 640-1024 / desktop>=1024
       scale. Renumbered to 1024 (tablet-and-below gets the tighter
       padding; only true desktop keeps the roomier 28/22px). */
    @media (max-width: 1024px) {
      .page { padding: 14px; }
      .card { padding: 12px; }
      /* card-head's default 14px margin-bottom is the next-biggest whitespace
         cost inside a 12px-padded card, so it gets pulled in a notch too. */
      .card-head { margin-bottom: 13px; }
      /* These widgets set their own id-selector padding, which beats the .card
         override above on specificity — restate it so the tighter padding
         actually reaches them. */
      #home-top-row-right,
      #home-training-card,
      #home-recent-workouts-card,
      #home-weight-trend,
      #home-race-card { padding: 12px; }
    }

    /* Card affordance: hover lift conveys "this is interactive" (most tiles
       carry a "-> " link or clickable row) — state, not decoration. Instant
       fallback under reduced motion. */
    .card {
      transition: box-shadow 200ms cubic-bezier(0.22, 1, 0.36, 1),
                  transform 200ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .card:hover {
      box-shadow: 0 10px 28px rgba(13, 30, 67, 0.12), 0 2px 8px rgba(13, 30, 67, 0.06);
      transform: translateY(-2px);
    }
    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .card:hover { transform: none; }
    }

    /* ---- CARD ---- */
    .card {
      background: #fff;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      padding: 22px;
      display: flex;
      flex-direction: column;
    }

    /* ---- HOME V3 COLOR GROUPING (Task 4) ----
       Training cluster (Readiness/Next+Recent/Performance/Training/Personal
       records/Habits) shares one light blue tint; Weight gets its own soft
       amber tint. Sleep is untouched (keeps its own dark indigo background).
       Habits follows the prose spec here, NOT the reference mock's separate
       green .grp-habits class — the mock's own markup contradicted its
       prose on this point; prose wins. */
    .grp-training { background: linear-gradient(150deg, var(--shell-1), var(--shell-2)); }
    .grp-weight   { background: linear-gradient(150deg, var(--amber-tint-1), var(--amber-tint-2)); }

    /* ---- Readiness factor arrows (shared by the compact readiness tile's
       top-3-factors row, #home-top-row-right .rd-tile-factor) ---- */
    .rd-arrow { font-size: 14px; font-weight: 700; }
    .rd-arrow--positive { color: var(--green); }
    .rd-arrow--negative { color: var(--red); }
    .rd-arrow--neutral  { color: var(--text-tertiary); }

    /* ---- SLEEP HERO CARD ---- */
    .sleep-card {
      background: linear-gradient(160deg, var(--sleep-1) 0%, var(--sleep-2) 100%);
      color: #fff;
      border: 0;
      min-height: 280px;
      padding: 22px;
    }
    .sleep-card .slp-lbl {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 7px;
      /* Now an <h2> (re-audit #12) — margin:0 replaces the div's implicit
         zero top margin; bottom spacing unchanged. */
      margin: 0 0 12px;
    }
    .sleep-card .slp-body {
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .sleep-card .slp-score {
      font-size: 56px;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .sleep-card .slp-score small {
      font-size: 19px;
      opacity: 0.5;
      font-weight: 500;
    }
    .sleep-card .slp-quality {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      margin: 4px 0 0;
    }
    /* Fills the gap below slp-quality with the numeric Quality X/5 readout
       (was previously unstyled — inherited body defaults with no size/
       spacing rule at all, so it rendered oversized and mismatched). */
    .sleep-card .slp-quality-detail {
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      margin: 2px 0 16px;
    }
    .sleep-card .slp-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      text-align: center;
      padding: 20px 0;
    }
    /* .slp-log-link is a <button> standing in for the old /calendar link
       (nav-cleanup removed that page) — reset button chrome, keep the
       underlined-link look against the card's dark background. */
    .sleep-card .slp-empty button.slp-log-link {
      background: none; border: 0; padding: 0; font: inherit; cursor: pointer;
      color: #fff; text-decoration: underline;
    }

    /* ---- CARD HEADER (shared) ---- */
    .card-head {
      display: flex; align-items: center; justify-content: space-between;
      /* Narrower tiles (home v2 unified grid, ~280-340px) can't always fit
         title + trailing link on one line — wrap instead of letting them
         crowd/touch ("PerformanceView trends →"). row-gap keeps the wrapped
         link from sitting flush under the title. */
      flex-wrap: wrap;
      row-gap: 4px;
      margin-bottom: 14px;
    }
    /* .ttl is now an <h2> (re-audit #12 — was a <div>, zero real headings on
       an 11-widget dashboard) — margin:0 keeps the browser's default h2
       margin from shifting layout; sizing/weight were already overridden. */
    .card-head .ttl { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; min-width: 0; margin: 0; }
    .card-head .ttl i { font-size: 17px; color: var(--text-tertiary); }
    .card-head a { font-size: 12px; color: var(--link); text-decoration: none; white-space: nowrap; }
    .card-head .meta { font-size: 12px; color: var(--text-tertiary); }
    /* .rd-tile-log-link is a <button> standing in for the old /calendar link
       (nav-cleanup removed that page) — reset button chrome so it reads the
       same as the other .card-head a trailing links. */
    .card-head button.rd-tile-log-link {
      background: none; border: 0; padding: 0; font: inherit; cursor: pointer;
      font-size: 12px; color: var(--link); text-decoration: none; white-space: nowrap;
    }

    /* ---- PERSONAL RECORDS CARD (home v3, Task 6 — 10K/Half/Marathon tiles
       from /api/athletes/{id}/run-personal-records, see loadPerformanceCard) ---- */
    .pr-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    /* Flatten (Task 2): was its own bordered/tinted tile nested inside
       #perf-card.card — the outer card border already contains it, so this
       is now a thin vertical divider between the 3 side-by-side stats
       (the row-divider treatment, rotated for a horizontal layout) instead
       of a boxed chip. */
    .pr-tile {
      padding: 4px 9px;
      text-align: center;
      border-left: 1px solid var(--card-border);
    }
    .pr-tile:first-child { border-left: 0; }
    .pr-lbl {
      font-size: 8px; font-weight: 800; color: var(--text-tertiary);
      text-transform: uppercase; letter-spacing: 0.03em;
    }
    .pr-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px; font-weight: 800; margin-top: 5px;
    }
    .pr-date { font-size: 9px; color: var(--text-tertiary); font-family: 'JetBrains Mono', monospace; margin-top: 3px; }

    .perf-empty {
      padding: 28px 4px;
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .perf-empty a { color: var(--link); text-decoration: none; }

    /* ---- RECENT WORKOUTS (rendered as .nw-row entries inside
       #home-recent-workout-section — see RECENT WORKOUTS CARD rules below) ---- */
    .workouts-empty {
      font-size: 13.5px; color: var(--text-secondary);
      padding: 16px 4px; line-height: 1.5;
    }

    /* ---- Strava stale sync banner (home revamp v2: mock's red .alert
       treatment — a stale sync means every load-derived number on the page
       below is stale, so this reads as a warning, not a quiet notice). ---- */
    .strava-stale-banner {
      display: flex;
      align-items: center;
      gap: 11px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 11px 15px;
      margin-bottom: 14px;
      font-size: 13px;
      color: #7f1d1d;
    }
    .strava-stale-banner--syncing { color: #7f1d1d; font-style: italic; }
    .strava-stale-msg { flex: 1; }
    .strava-stale-msg b { font-weight: 700; }
    .strava-stale-banner button {
      margin-left: auto;
      border: 1px solid #fca5a5;
      background: #fff;
      color: #b91c1c;
      border-radius: 8px;
      padding: 8px 15px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      min-height: 36px;
    }
    .strava-stale-banner button:disabled { opacity: 0.6; cursor: default; }

    /* ---- BODY-MODIFIER GUARDRAIL WARNING (issue #1161) ----
       Was its own raw-hex orange family (#fff7ed/#fb923c/#c2410c/#7c2d12) —
       consolidated onto this page's own --amber/--amber-soft tokens (same
       pairing already used by .hc-chip--warn), with --gold (the existing
       trophy-icon token) reused for the border so no third amber family
       gets invented. */
    .bm-guardrail {
      display: flex; align-items: flex-start; gap: 10px;
      background: var(--amber-soft); border: 1px solid var(--gold); border-radius: 10px;
      padding: 12px 16px; margin-bottom: 14px; font-size: 13px; line-height: 1.5;
    }
    .bm-guardrail-icon { font-size: 18px; flex-shrink: 0; line-height: 1; margin-top: 1px; }
    .bm-guardrail-label { font-weight: 700; color: var(--amber); margin-right: 4px; }
    .bm-guardrail-msg { color: var(--amber); }

    /* ---- HOME WEIGHT WIDGET (full-width) ---- */
    #home-weight-widget .card { padding: 22px; }
    .hww-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    .hww-main { display: flex; flex-direction: column; gap: 0; }
    .hww-top-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .hww-current { font-size: 36px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
    .hww-unit { font-size: 14px; color: var(--text-tertiary); font-weight: 500; }
    .hww-gap-pill {
      font-size: 11px; font-weight: 600; padding: 3px 9px;
      border-radius: 999px; white-space: nowrap; margin-left: 6px;
    }
    .hww-gap--behind { background: var(--red-soft); color: var(--red); }
    .hww-gap--ahead  { background: var(--green-soft); color: var(--green); }
    .hww-gap--flat   { background: var(--chip-bg); color: var(--text-tertiary); }
    .hww-avg { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
    .hww-sparkline {
      width: 100%; height: 52px; display: block;
      overflow: visible; flex-shrink: 0; margin-top: 8px;
    }
    .hww-rate { font-size: 12px; margin-top: 6px; font-weight: 500; }
    .hww-rate--goal  { color: var(--green); }
    .hww-rate--flat  { color: var(--text-tertiary); }
    .hww-progress-wrap { margin-top: 8px; }
    .hww-progress-bar {
      height: 4px; border-radius: 2px;
      background: var(--chip-bg); overflow: hidden;
    }
    .hww-progress-fill { height: 100%; border-radius: 2px; background: var(--link); }
    .hww-goal-line { font-size: 11.5px; color: var(--text-secondary); margin-top: 6px; line-height: 1.5; }
    .hww-goal-line a { color: var(--link); text-decoration: none; }
    .hww-no-data { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-top: 8px; }
    /* Stepper section */
    .hww-stepper { display: flex; flex-direction: column; gap: 12px; }
    .hww-stepper-label {
      font-size: 11px; font-weight: 600; color: var(--text-tertiary);
      text-transform: uppercase; letter-spacing: 0.07em;
    }
    /* Flatten (Task 2): the stepper used to be one bordered/tinted box
       nested inside the weight widget's own card — a redundant containment
       cue one level down. Now it's plain spacing between three
       independently-styled controls: the two buttons keep their own chip
       background (they're buttons — they should look pressable), and the
       input gets its own light border/radius so it still reads as an
       editable field without a wrapper box around the whole group. */
    .hww-step-row {
      display: flex; align-items: center; gap: 6px;
    }
    .hww-step-btn {
      width: 48px; min-height: 48px; background: var(--chip-bg);
      color: var(--text-primary); border: 0; border-radius: 10px; font-size: 22px;
      font-family: inherit; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .hww-step-btn:hover { background: #dde6f8; }
    .hww-step-btn:active { background: #c8d6f4; }
    .hww-step-input {
      flex: 1; min-width: 0; border: 1.5px solid var(--card-border); border-radius: 10px;
      background: #f7f9fd;
      text-align: center; font-family: 'JetBrains Mono', monospace;
      font-size: 20px; font-weight: 600; letter-spacing: -0.02em;
      color: var(--text-primary); padding: 10px 4px;
      -moz-appearance: textfield; min-height: 48px;
    }
    .hww-step-input::-webkit-outer-spin-button,
    .hww-step-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .hww-step-input:focus { outline: none; border-color: var(--link); box-shadow: inset 0 0 0 1.5px var(--link); }
    .hww-log-btn {
      width: 100%; padding: 14px 20px; background: var(--accent);
      color: var(--accent-text); border: 0; border-radius: 12px;
      font-family: inherit; font-size: 14px; font-weight: 700;
      cursor: pointer; letter-spacing: -0.01em; min-height: 48px;
      transition: opacity 0.12s;
    }
    .hww-log-btn:disabled { opacity: 0.55; cursor: default; }
    .hww-compact {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px; background: var(--green-soft);
      border-radius: 12px; font-size: 13px; font-weight: 500; color: var(--green);
    }
    .hww-compact-edit {
      margin-left: auto; font-size: 12px; font-weight: 600;
      color: var(--link); cursor: pointer; text-decoration: none; background: none;
      border: 0; font-family: inherit; padding: 0;
    }
    /* Was 880px — consolidated onto 1024 (see Breakpoint consolidation note
       above). The weight card runs at roughly half the grid width at both
       the old "6" and "8" column tiers, so it only needs to stack below
       the tablet/desktop split, not at some mid-tablet number. */
    @media (max-width: 1024px) {
      .hww-layout { grid-template-columns: 1fr; gap: 20px; }
      .hww-current { font-size: 32px; }
    }

    /* #row-log wraps the live Fast-log form (revealed by the Log-today
       strip's CTA — see FAST LOG FORM rules below and home-strip-habits.js). */
    #row-log { margin-bottom: 16px; }

    /* ---- FAST LOG FORM ----
       Was a bare 3px left stripe in --bg-1 (decorative accent with no real
       edge) — replaced with a full border + a fading tint of the same blue
       family (--blue-soft) so the "this is the active/highlighted form"
       signal reads as a real surface, not a hairline. Fades to white by
       ~160px so the long field list underneath stays plain and legible. */

    /* ---- RACE (home-race-card.js) ---- */
    .hrc-loading { font-size: 13.5px; color: var(--text-secondary); padding: 8px 0; }
    .hrc-empty { padding: 8px 0; }
    .hrc-empty-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
    .hrc-empty-cta {
      display: inline-block; padding: 8px 18px; border-radius: 999px;
      background: var(--text-primary); color: #fff; font-size: 13px; font-weight: 600;
      text-decoration: none;
    }
    .hrc-race { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
    .hrc-days {
      width: 54px; height: 54px; border-radius: 12px; background: var(--bg-1); color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .hrc-days-n { font-family: 'JetBrains Mono', monospace; font-size: 19px; font-weight: 800; line-height: 1; }
    .hrc-days-k { font-size: 8.5px; text-transform: uppercase; letter-spacing: .05em; opacity: .85; }
    .hrc-info-t { font-size: 15px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.02em; }
    .hrc-info-m { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .hrc-stats { display: flex; gap: 10px; flex-wrap: wrap; }
    .hrc-est { flex: 1; min-width: 80px; background: var(--tile, var(--chip-bg)); border-radius: 10px; padding: 9px 12px; text-align: center; }
    .hrc-est-k { font-size: 9px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-tertiary); }
    .hrc-est-v { font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700; margin-top: 3px; }
    .hrc-est-v--ok { color: var(--green); }
    .hrc-est-s { font-size: 10px; color: var(--text-tertiary); margin-top: 2px; }
    /* Simple countdown progress (created_at → race date) — no named phases */
    .hrc-progress { margin-top: 12px; }
    .hrc-progress-bar {
      height: 8px; border-radius: 99px; background: var(--chip-bg, #f1f4fa);
      overflow: hidden;
    }
    .hrc-progress-fill {
      height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, #4f6ef7, #16a34a);
      min-width: 0;
    }
    .hrc-progress-meta {
      display: flex; justify-content: space-between; gap: 10px;
      margin-top: 5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; font-weight: 600; color: var(--text-tertiary);
    }

    /* ---- Coach digest — numbered focus rows (unhidden, home revamp v2) ---- */
    .hc-dg-focus { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .hc-dg-focus .hc-focus-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0; border-top: 1px solid var(--card-divider);
    }
    .hc-dg-focus .hc-focus-item:first-child { border-top: 0; padding-top: 0; }
    .hc-dg-focus .hc-f-p {
      margin-left: auto; font-family: 'JetBrains Mono', monospace;
      font-size: 11px; font-weight: 700; color: var(--amber, #d97706);
      white-space: nowrap;
    }
    .hc-dg-focus .hc-f-p.ok,
    .hc-dg-focus .hc-f-p--ok { color: var(--green, #16a34a); }

    /* Performance tiles side-by-side (home revamp v2) */
    .hperf-grid--side {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 480px) {
      .hperf-grid--side { grid-template-columns: 1fr; }
    }

    /* Readiness: TSB+ACWR headline; CTL/ATL behind <details> */
    .rd-load-tiles--headline .rd-load-headline {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .rd-load-more {
      margin-top: 10px;
      border-top: 1px solid var(--card-divider);
      padding-top: 8px;
    }
    .rd-load-more > summary {
      cursor: pointer;
      list-style: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 32px;
      user-select: none;
    }
    .rd-load-more > summary::-webkit-details-marker { display: none; }
    .rd-load-more-arrow { font-size: 10px; color: var(--text-tertiary); }
    .rd-load-more[open] .rd-load-more-arrow { transform: rotate(180deg); }
    .rd-load-expand {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<!-- MAIN PAGE -->
<main class="page">
  <div class="greeting">
    <h1 id="greeting-text">Good morning</h1>
    <p id="greeting-date"></p>
  </div>

  <!-- Active injury/illness/niggle strip -->
  <div id="home-injury-strip" style="padding:0 16px;"></div>

  <!-- Banners — stay outside the morning strip / column grid below, in their
       own full-width block. -->
  <div id="body-modifier-guardrail"></div>
  <div id="strava-stale-banner" hidden></div>

  <!-- This morning — weigh-in, today's session, habits (home-morning.js). -->
  <div id="home-morning"></div>

  <!-- Two-column body (home revamp v2 — two .home-col flex stacks inside a
       2-col grid, matching docs/mocks/home-revamp-v2.html). Right column
       leads with #home-next-up. Mobile uses display:contents + order (see
       ≤900px rules). Banners and #row-log stay outside. -->
  <div id="home-cols">
    <div class="home-col home-col--left">
      <div id="home-today-rec-card" class="card grp-training"></div>
      <div id="home-weight-trend" class="card grp-weight"></div>
      <div id="home-race-card" class="card"></div>
      <div id="home-performance-card" class="card grp-training"></div>
      <div id="home-top-row-right" class="grp-training"></div>
    </div>
    <div class="home-col home-col--right">
      <div id="home-next-up"></div>
      <div id="home-training-card" class="card grp-training"></div>
      <div id="home-brief-week-plan-card" class="card"></div>
      <div id="home-recent-workouts-card" class="card grp-training"></div>
    </div>
  </div>

  <!-- Fast-log form: hidden by default, revealed by Readiness's
       "Log metrics →" (data-rd-log-metrics in home-readiness-training-sleep.js). -->
  <div id="row-log" style="margin-top:16px;" hidden>
    <section id="fast-log-section" class="card fast-log">
      <div class="card-head">
        <h2 class="ttl"><i class="ti ti-pencil-plus"></i>Log Today</h2>
        <span id="fast-log-date-label" class="meta"></span>
      </div>
      <form id="fast-log-form" novalidate>
        <div class="fm-fields">

          <!-- RHR (30–120) -->
          <div class="fm-field">
            <label class="fm-label" for="fm-rhr">
              Resting HR <span class="fm-unit">bpm</span>
            </label>
            <div class="fm-stepper">
              <button id="fm-rhr-minus" type="button" class="fm-step-btn" aria-label="Decrease RHR">−</button>
              <input id="fm-rhr" class="fm-input" type="number"
                min="30" max="120" step="1" inputmode="numeric" placeholder="—"
                autocomplete="off">
              <button id="fm-rhr-plus" type="button" class="fm-step-btn" aria-label="Increase RHR">+</button>
            </div>
          </div>

          <!-- HRV (0–200) -->
          <div class="fm-field">
            <label class="fm-label" for="fm-hrv">
              HRV <span class="fm-unit">ms</span>
            </label>
            <div class="fm-stepper">
              <button id="fm-hrv-minus" type="button" class="fm-step-btn" aria-label="Decrease HRV">−</button>
              <input id="fm-hrv" class="fm-input" type="number"
                min="0" max="200" step="1" inputmode="numeric" placeholder="—"
                autocomplete="off">
              <button id="fm-hrv-plus" type="button" class="fm-step-btn" aria-label="Increase HRV">+</button>
            </div>
          </div>

          <!-- Sleep hours (0–12, step 0.5) -->
          <div class="fm-field">
            <label class="fm-label" for="fm-sleep">
              Sleep <span class="fm-unit">hours</span>
            </label>
            <div class="fm-stepper">
              <button id="fm-sleep-minus" type="button" class="fm-step-btn" aria-label="Decrease sleep">−</button>
              <input id="fm-sleep" class="fm-input" type="number"
                min="0" max="12" step="0.5" inputmode="decimal" placeholder="—"
                autocomplete="off">
              <button id="fm-sleep-plus" type="button" class="fm-step-btn" aria-label="Increase sleep">+</button>
            </div>
          </div>

          <!-- Fueling / Intake (kcal) -->
          <div class="fm-field">
            <label class="fm-label" for="fm-kcal">
              Intake <span class="fm-unit">kcal</span>
              <span class="fm-optional">(optional)</span>
            </label>
            <div class="fm-stepper">
              <button id="fm-kcal-minus" type="button" class="fm-step-btn" aria-label="Decrease intake">−</button>
              <input id="fm-kcal" class="fm-input" type="number"
                min="1" max="10000" step="50" inputmode="numeric" placeholder="—"
                autocomplete="off">
              <button id="fm-kcal-plus" type="button" class="fm-step-btn" aria-label="Increase intake">+</button>
            </div>
          </div>

          <!-- Energy (1–5 segmented pills) -->
          <div class="fm-field">
            <label class="fm-label">Energy</label>
            <div class="fm-pills" id="fm-energy-pills" role="group" aria-label="Energy 1 to 5">
              <button type="button" class="fm-pill" data-val="1" aria-pressed="false">1</button>
              <button type="button" class="fm-pill" data-val="2" aria-pressed="false">2</button>
              <button type="button" class="fm-pill" data-val="3" aria-pressed="false">3</button>
              <button type="button" class="fm-pill" data-val="4" aria-pressed="false">4</button>
              <button type="button" class="fm-pill" data-val="5" aria-pressed="false">5</button>
            </div>
            <input type="hidden" id="fm-energy-val" name="energy">
          </div>

          <!-- Mood (1–5 segmented pills) -->
          <div class="fm-field">
            <label class="fm-label">Mood</label>
            <div class="fm-pills" id="fm-mood-pills" role="group" aria-label="Mood 1 to 5">
              <button type="button" class="fm-pill" data-val="1" aria-pressed="false">1</button>
              <button type="button" class="fm-pill" data-val="2" aria-pressed="false">2</button>
              <button type="button" class="fm-pill" data-val="3" aria-pressed="false">3</button>
              <button type="button" class="fm-pill" data-val="4" aria-pressed="false">4</button>
              <button type="button" class="fm-pill" data-val="5" aria-pressed="false">5</button>
            </div>
            <input type="hidden" id="fm-mood-val" name="mood">
          </div>

          <!-- Weight (optional, 30–200) -->
          <div class="fm-field">
            <label class="fm-label" for="fm-weight">
              Weight <span class="fm-unit">kg</span>
              <span class="fm-optional">(optional)</span>
            </label>
            <div class="fm-stepper">
              <button id="fm-weight-minus" type="button" class="fm-step-btn" aria-label="Decrease weight">−</button>
              <input id="fm-weight" class="fm-input" type="number"
                min="30" max="200" step="1" inputmode="decimal" placeholder="—"
                autocomplete="off">
              <button id="fm-weight-plus" type="button" class="fm-step-btn" aria-label="Increase weight">+</button>
            </div>
          </div>

          <!-- Notes (optional textarea) -->
          <div class="fm-field">
            <label class="fm-label" for="fm-notes">
              Notes <span class="fm-optional">(optional)</span>
            </label>
            <textarea id="fm-notes" class="fm-textarea" rows="3"
              placeholder="How are you feeling today?"></textarea>
          </div>

        </div><!-- /.fm-fields -->

        <div class="fm-actions">
          <button id="fm-save" type="submit" class="fm-save-btn">Save</button>
          <div id="fm-feedback" class="fm-feedback"></div>
        </div>
      </form>
    </section>
  </div>
</main>

<script src="js/lib/app-common.js"></script>
<script src="js/lib/sync-poller.js"></script>

<script src="js/nav.js?v=20260718nav1"></script>
<script src="js/ui-states.js"></script>
<script src="js/wheel-helpers.js"></script>

<script src="js/home-coach-digest.js?v=20260808revamp3"></script>
<script src="js/home-readiness-training-sleep.js?v=20260808revamp3"></script>
<script src="js/home-brief-week-plan-card.js?v=20260808revamp3"></script>
<script src="js/lib/next-up-card.js?v=20260808revamp3"></script>
<script src="js/home-morning.js?v=20260808revamp3"></script>
<script src="js/home-weight-trend.js?v=20260808revamp3"></script>
<script src="js/home-race-card.js?v=20260808racebar1"></script>
<script src="js/home.js?v=20260808revamp3"></script>

<script src="js/injury-log.js"></script>
<script>
  InjuryLog.renderActiveStrip('home-injury-strip');
</script>

</body>
</html>
