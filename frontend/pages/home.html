<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home – perf-coach</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/weight-current-card.css">
  <style>
    :root {
      --bg-1: #5a8dee;
      --bg-2: #1f3b8a;
      --shell-1: #eaf0fb;
      --shell-2: #d8e3f5;
      --card-border: rgba(13, 30, 67, 0.06);
      --text-primary: #0b1530;
      --text-secondary: #5c6886;
      /* #8b95ad (the previous value) failed WCAG AA at 3.0:1 on white —
         DESIGN.md documents this exact failure and its retirement to
         #6b7280 (4.9:1) for the instrument palette; applying the same fix
         here since --text-tertiary carries 50+ small labels site-wide. */
      --text-tertiary: #6b7280;
      --accent: #e4ff52;
      --accent-text: #1a2400;
      --hero-1: #b6c5ff;
      --hero-2: #8aa1ff;
      --sleep-1: #2a1d54;
      --sleep-2: #4d3a8c;
      --green: #2d5e10;
      --green-soft: #dff5d6;
      --red: #7a1a1a;
      --red-soft: #ffd9d9;
      --amber: #6b4408;
      --amber-soft: #fff0c4;
      --chip-bg: #f1f4fa;
      --card-divider: rgba(13, 30, 67, 0.05);
      --gold: #b8893c;
      --blue-text: #1e3a8a;
      --blue-soft: #dde6f8;
      --purple-text: #4f3c8c;
      --purple-soft: #ebe5f9;
      --orange-text: #8a3d12;
      --orange-soft: #ffe1d4;
      --teal-text: #1e6438;
      --teal-soft: #d4f0e2;
      /* Home v3 color grouping (Task 4) — paired tint stops following the
         existing --bg-1/--bg-2, --hero-1/--hero-2, --sleep-1/--sleep-2
         naming convention. Blue tint reuses the existing --shell-1/--shell-2
         pair directly (no new tokens needed); amber tint is new since no
         light/dark amber PAIR existed (--amber/--amber-soft are text/chip
         colors, not a gradient pair). */
      --amber-tint-1: #fffaf0;
      --amber-tint-2: #fdecc8;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter Tight', system-ui, sans-serif;
      color: var(--text-primary);
      background: radial-gradient(ellipse at top left, var(--bg-1) 0%, var(--bg-2) 70%);
      min-height: 100vh;
      letter-spacing: -0.01em;
    }

    /* ---- PAGE ----
       Widened from 760px (home v2 layout follow-up #2): the unified dashboard
       grid below needs real desktop width to pack 3-4 widgets per row —
       760px only ever fit 2 columns of a sane card width, so the auto-fit
       grid's column count is capped by THIS max-width, not just its own
       minmax floor. 1320 fits 4 columns of minmax(280px,1fr) + 16px gaps
       (4*280 + 3*16 = 1168 <= 1320 - 2*28 padding = 1264) at 1280-1440
       viewport widths. */
    .page {
      max-width: 1320px;
      margin: 0 auto;
      padding: 28px;
    }
    .greeting { margin-bottom: 22px; }
    .greeting h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: #fff;
      text-shadow: 0 1px 8px rgba(0,0,0,0.15);
    }
    .greeting p {
      margin: 6px 0 0;
      color: rgba(255,255,255,0.78);
      font-size: 14px;
    }

    /* ---- DASHBOARD GRID (home v3 bento layouts) ----
       Four explicit, hand-placed layouts (Wide/Medium/Narrow/Mobile) replace
       the previous single fluid repeat(auto-fit,minmax(280px,1fr)) grid —
       that auto-fit grid packed cards wherever they happened to fit, which
       drifted at odd widths and gave no control over which widgets sit next
       to each other. Each breakpoint below hand-places all 8 widgets by id
       via grid-column/grid-row so the layout is exact and predictable at
       every width. #home-log-today-strip, #body-modifier-guardrail,
       #strava-stale-banner, and #row-log stay OUTSIDE this grid. */
    #home-dashboard-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-auto-rows: 100px;
      gap: 14px;
      margin-bottom: 16px;
      align-items: start;
    }
    /* Wide (>=1000px, unqualified — the base rule above is the widest
       breakpoint, so no media query needed here).
       Row spans below are sized from measured rendered content height,
       re-verified against a standalone static harness (real markup emitted
       by home.js / home-readiness-training-sleep.js / home-strip-habits.js,
       reconstructed with realistic full data — not the live app; see
       docs note below) at 1120/820/620/390px. The previous commit's claim
       of a live-Playwright measurement pass did not hold up: #home-perf-
       container ("Personal records") was still undersized here (row span 2
       = 214px vs ~249px of real content with 2 PR tracks), overlapping
       #home-habits-widget below by ~21px. Bumped to span 3 and pushed
       Habits down one row to match. */
    #home-top-row-right      { grid-column: 1 / span 4; grid-row: 1 / span 4; }
    #home-next-workout-card  { grid-column: 5 / span 2; grid-row: 1 / span 3; }
    #home-performance-card   { grid-column: 7 / span 2; grid-row: 1 / span 3; }
    #home-training-card      { grid-column: 5 / span 4; grid-row: 4 / span 3; }
    #home-sleep-card         { grid-column: 1 / span 4; grid-row: 5 / span 2; }
    #home-perf-container     { grid-column: 5 / span 4; grid-row: 7  / span 3; }
    #home-weight-widget      { grid-column: 1 / span 4; grid-row: 7  / span 3; }
    #home-habits-widget      { grid-column: 5 / span 4; grid-row: 10 / span 3; }
    /* Performance is padded to match Next+Recent's row-3 height so the two
       top-right cards share a bottom edge — the extra space inside
       Performance's own box is an intentional, expected gap, not a bug. */

    @media (max-width: 999px) {
      #home-dashboard-grid {
        grid-template-columns: repeat(6, 1fr);
        grid-auto-rows: 100px;
        gap: 14px;
      }
      #home-top-row-right      { grid-column: 1 / span 4; grid-row: 1  / span 4; }
      #home-next-workout-card  { grid-column: 5 / span 2; grid-row: 1  / span 3; }
      #home-performance-card   { grid-column: 5 / span 2; grid-row: 4  / span 2; }
      #home-sleep-card         { grid-column: 5 / span 2; grid-row: 6  / span 2; }
      #home-training-card      { grid-column: 1 / span 4; grid-row: 5  / span 3; }
      #home-habits-widget      { grid-column: 1 / span 4; grid-row: 8  / span 3; }
      #home-perf-container     { grid-column: 1 / span 3; grid-row: 11 / span 3; }
      #home-weight-widget      { grid-column: 4 / span 3; grid-row: 11 / span 4; }
      /* PRs/Weight stay paired side by side (spec's "3x2 paired" intent) —
         Weight's real content needs more height than PRs at this width, so
         the pair no longer shares a bottom edge; that height mismatch is
         expected, not an overlap bug. PRs bumped from span 2 to span 3 —
         measured content (2 PR tracks, desktop .perf-grid table at this
         width) was ~277px, taller than span 2's 214px track. */
    }

    @media (max-width: 759px) {
      .page { padding: 14px; }
      .card { padding: 12px; }
      /* Third tighter-padding step (13px) — card-head's default 14px
         margin-bottom is the next-biggest whitespace cost inside a
         12px-padded card, so it gets pulled in a notch too. */
      .card-head { margin-bottom: 13px; }
      /* These 4 widgets set their own (id-selector) padding, which beats
         the .card override above on specificity — restate it here so
         Narrow's tighter padding actually reaches them too. */
      #home-top-row-right,
      #home-habits-widget,
      #home-training-card,
      #home-weight-widget .card { padding: 12px; }
      #home-dashboard-grid {
        grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: 90px;
        gap: 10px;
      }
      #home-top-row-right      { grid-column: 1 / span 4; grid-row: 1  / span 4; }
      #home-next-workout-card  { grid-column: 1 / span 2; grid-row: 5  / span 3; }
      #home-performance-card   { grid-column: 3 / span 2; grid-row: 5  / span 3; }
      #home-sleep-card         { grid-column: 1 / span 2; grid-row: 8  / span 2; }
      #home-training-card      { grid-column: 1 / span 4; grid-row: 10 / span 3; }
      #home-habits-widget      { grid-column: 1 / span 4; grid-row: 13 / span 3; }
      /* #home-perf-container switches to its .perf-mobile block (buildMobileBlock
         per track) below the page's own 640px breakpoint, which is narrower than
         this 759px one — so at Narrow it's ALWAYS the taller mobile-block markup,
         not the desktop .perf-grid table. Measured ~375px for 2 PR tracks; the
         previous span 2 (190px) was undersized by ~185px, which is the overlap
         the user saw ("worst at Narrow"). Bumped to span 5 (490px); Weight is
         pushed down to start after it (was row 18, now row 21). */
      #home-perf-container     { grid-column: 1 / span 4; grid-row: 16 / span 5; }
      #home-weight-widget      { grid-column: 1 / span 4; grid-row: 21 / span 4; }
    }

    @media (max-width: 479px) {
      #home-dashboard-grid {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      /* DOM order (see markup below) already matches the required Mobile
         stack order — flex just follows document order, no per-widget rule
         needed here. */
    }

    /* Card affordance: hover lift conveys "this is interactive" (most tiles
       carry a "-> " link or clickable row) — state, not decoration. Instant
       fallback under reduced motion. */
    .card {
      transition: box-shadow 200ms cubic-bezier(0.22, 1, 0.36, 1),
                  transform 200ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .card:hover {
      box-shadow: 0 10px 28px rgba(13, 30, 67, 0.12), 0 2px 8px rgba(13, 30, 67, 0.06);
      transform: translateY(-2px);
    }
    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .card:hover { transform: none; }
    }

    /* Dashboard load reveal: a light stagger on the grid's own children.
       Cards are markup-visible by default (no JS gate) — this only enhances
       an already-rendered page; disabled entirely under reduced motion. */
    @media (prefers-reduced-motion: no-preference) {
      #home-dashboard-grid > * {
        animation: hv2-tile-in 420ms cubic-bezier(0.22, 1, 0.36, 1) backwards;
      }
      #home-dashboard-grid > *:nth-child(1) { animation-delay: 0ms; }
      #home-dashboard-grid > *:nth-child(2) { animation-delay: 30ms; }
      #home-dashboard-grid > *:nth-child(3) { animation-delay: 60ms; }
      #home-dashboard-grid > *:nth-child(4) { animation-delay: 90ms; }
      #home-dashboard-grid > *:nth-child(5) { animation-delay: 120ms; }
      #home-dashboard-grid > *:nth-child(6) { animation-delay: 150ms; }
      #home-dashboard-grid > *:nth-child(7) { animation-delay: 180ms; }
      #home-dashboard-grid > *:nth-child(8) { animation-delay: 210ms; }
    }
    @keyframes hv2-tile-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---- CARD ---- */
    .card {
      background: #fff;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      padding: 22px;
      display: flex;
      flex-direction: column;
    }

    /* ---- HOME V3 COLOR GROUPING (Task 4) ----
       Training cluster (Readiness/Next+Recent/Performance/Training/Personal
       records/Habits) shares one light blue tint; Weight gets its own soft
       amber tint. Sleep is untouched (keeps its own dark indigo background).
       Habits follows the prose spec here, NOT the reference mock's separate
       green .grp-habits class — the mock's own markup contradicted its
       prose on this point; prose wins. */
    .grp-training { background: linear-gradient(150deg, var(--shell-1), var(--shell-2)); }
    .grp-weight   { background: linear-gradient(150deg, var(--amber-tint-1), var(--amber-tint-2)); }

    /* ---- READINESS HERO CARD ---- */
    .readiness {
      background: linear-gradient(135deg, var(--hero-1) 0%, var(--hero-2) 100%);
      color: #0b1530;
      border: 0;
      padding: 28px;
      position: relative;
      overflow: hidden;
      min-height: 280px;
    }
    .readiness .lbl {
      font-size: 11px;
      color: rgba(11, 21, 48, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 500;
    }
    .readiness h2 {
      margin: 8px 0 8px;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
      max-width: 65%;
      line-height: 1.2;
    }
    .readiness .sub {
      font-size: 14px;
      color: rgba(11, 21, 48, 0.7);
      max-width: 65%;
      line-height: 1.5;
      margin: 0;
    }
    .readiness .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      margin-top: 16px;
    }
    .readiness .status-pill.pill-green { background: var(--accent); color: var(--accent-text); }
    .readiness .status-pill.pill-amber { background: var(--amber-soft); color: var(--amber); }
    .readiness .status-pill.pill-red   { background: var(--red-soft);   color: var(--red); }
    .readiness .score-block {
      position: absolute;
      right: 28px;
      top: 28px;
      text-align: right;
    }
    .readiness .score-label {
      font-size: 10px;
      color: rgba(11, 21, 48, 0.55);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 500;
    }
    .readiness .score {
      font-size: 96px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.045em;
      margin-top: 4px;
    }
    .readiness .score small {
      font-size: 22px;
      font-weight: 500;
      opacity: 0.5;
      margin-left: 2px;
    }
    .readiness .score-avg {
      font-size: 12px;
      color: rgba(11, 21, 48, 0.6);
      margin-top: 4px;
    }
    .readiness .components {
      display: flex;
      gap: 10px;
      margin-top: auto;
      padding-top: 20px;
    }
    .component {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(10px);
      border-radius: 13px;
      padding: 11px 14px;
      flex: 1;
    }
    .component .l {
      font-size: 10px;
      color: rgba(11, 21, 48, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 500;
    }
    .component .v {
      font-size: 17px;
      font-weight: 600;
      margin-top: 3px;
      letter-spacing: -0.01em;
    }
    .delta {
      font-size: 10.5px;
      margin-left: 4px;
      font-weight: 500;
    }
    .delta.up   { color: var(--green); }
    .delta.down { color: var(--red); }
    .delta.flat { color: var(--text-tertiary); }

    /* CTA / empty states */
    .readiness-cta-body,
    .readiness-empty-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 14px;
    }
    .readiness-cta-msg,
    .readiness-empty-msg {
      margin: 0;
      font-size: 15px;
      color: rgba(11, 21, 48, 0.7);
      line-height: 1.5;
    }
    .readiness-cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #0b1530;
      color: #fff;
      border: 0;
      border-radius: 999px;
      padding: 10px 20px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: -0.01em;
    }
    .readiness-cta-btn:disabled { opacity: 0.6; cursor: default; }
    .readiness-cta-btn i { font-size: 16px; }

    /* ---- Readiness contributor list ---- */
    .rd-contributors {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 60%;
    }
    .rd-contributor {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
    }
    .rd-factor-name {
      font-weight: 600;
      min-width: 50px;
    }
    .rd-arrow { font-size: 14px; font-weight: 700; }
    .rd-arrow--positive { color: var(--green); }
    .rd-arrow--negative { color: var(--red); }
    .rd-arrow--neutral  { color: var(--text-tertiary); }
    .rd-factor-val {
      font-size: 13px;
      color: rgba(11, 21, 48, 0.75);
    }

    /* ---- PR trend icon ---- */
    .pr-trend { display: inline-flex; align-items: center; font-weight: 600; font-size: 14px; }
    .pr-trend--green { color: var(--green); }
    .pr-trend--red   { color: var(--red); }
    .pr-trend--flat  { color: var(--text-tertiary); }
    .pr-dash { color: var(--text-tertiary); }

    /* ---- SLEEP HERO CARD ---- */
    .sleep-card {
      background: linear-gradient(160deg, var(--sleep-1) 0%, var(--sleep-2) 100%);
      color: #fff;
      border: 0;
      min-height: 280px;
      padding: 22px;
    }
    .sleep-card .slp-lbl {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 12px;
    }
    .sleep-card .slp-body {
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .sleep-card .slp-score {
      font-size: 56px;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .sleep-card .slp-score small {
      font-size: 19px;
      opacity: 0.5;
      font-weight: 500;
    }
    .sleep-card .slp-quality {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      margin: 4px 0 16px;
    }
    .sleep-card .slp-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }
    .sleep-card .slp-m-l {
      font-size: 10px;
      color: rgba(255,255,255,0.55);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-weight: 500;
    }
    .sleep-card .slp-m-v {
      font-size: 19px;
      font-weight: 600;
      margin-top: 4px;
    }
    .sleep-card .slp-stages {
      margin-top: auto;
    }
    .sleep-card .slp-stages-lbl {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: rgba(255,255,255,0.55);
      font-weight: 500;
      margin-bottom: 7px;
    }
    .sleep-card .slp-stages-bar {
      display: flex;
      height: 9px;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .slp-seg-deep  { background: #1f6feb; }
    .slp-seg-rem   { background: #a86eff; }
    .slp-seg-light { background: rgba(255,255,255,0.4); }
    .sleep-card .slp-legend {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 6px;
    }
    .sleep-card .slp-legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .slp-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .sleep-card .slp-pct {
      color: rgba(255,255,255,0.55);
      font-size: 11px;
    }
    .sleep-card .slp-demo-note {
      font-size: 10.5px;
      color: rgba(255,255,255,0.4);
      font-style: italic;
      margin-top: 2px;
    }
    .sleep-card .slp-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      text-align: center;
      padding: 20px 0;
    }

    /* ---- CARD HEADER (shared) ---- */
    .card-head {
      display: flex; align-items: center; justify-content: space-between;
      /* Narrower tiles (home v2 unified grid, ~280-340px) can't always fit
         title + trailing link on one line — wrap instead of letting them
         crowd/touch ("PerformanceView trends →"). row-gap keeps the wrapped
         link from sitting flush under the title. */
      flex-wrap: wrap;
      row-gap: 4px;
      margin-bottom: 14px;
    }
    .card-head .ttl { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; min-width: 0; }
    .card-head .ttl i { font-size: 17px; color: var(--text-tertiary); }
    .card-head a { font-size: 12px; color: #2b4ca8; text-decoration: none; white-space: nowrap; }
    .card-head .meta { font-size: 12px; color: var(--text-tertiary); }

    /* ---- PERFORMANCE CARD ---- */
    .icon-wrap.run  { background: var(--blue-soft);   color: var(--blue-text); }
    .icon-wrap.lift { background: var(--purple-soft); color: var(--purple-text); }

    .perf-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr 1fr;
    }
    .perf-hdr { display: contents; }
    .perf-row { display: contents; }
    .perf-hdr > div {
      font-size: 10px; color: var(--text-tertiary);
      text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500;
      padding: 4px 14px 10px;
      border-bottom: 1px solid var(--card-divider);
    }
    .perf-row > div {
      padding: 14px;
      border-bottom: 1px solid var(--card-divider);
      display: flex; flex-direction: column; justify-content: center;
    }
    .perf-hdr > div:first-child,
    .perf-row > div:first-child { padding-left: 4px; }
    .perf-row-last > div { border-bottom: 0; }

    .perf-track { display: flex; align-items: center; gap: 11px; }
    .perf-track .icon-wrap {
      width: 38px; height: 38px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .perf-track .trk-name { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
    .perf-track .trk-sub { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }

    .pc-value {

    .pc-unit { font-size: 11px; color: var(--text-tertiary); font-weight: 500; margin-left: 3px; font-family: 'Inter Tight', sans-serif; }
    .pc-date { font-size: 10.5px; color: var(--text-tertiary); margin-top: 4px; }
    .pc-delta { font-size: 11px; margin-top: 4px; font-weight: 500; }

    .pc-delta.ahead  { color: var(--green); font-weight: 600; }
    .pc-trophy { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--gold); margin-top: 4px; }
    .pc-trophy i { font-size: 12px; }
    .pc-dash { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600; color: var(--text-tertiary); }

    .perf-mobile { display: none; }
    .perf-track-block {
      padding: 14px 0;
      border-bottom: 1px solid var(--card-divider);
    }
    .perf-track-block:first-of-type { padding-top: 4px; }
    .perf-track-block:last-of-type  { padding-bottom: 0; border-bottom: 0; }

    .perf-empty {
      padding: 28px 4px;
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .perf-empty a { color: #2b4ca8; text-decoration: none; }

    /* ---- RECENT WORKOUTS CARD ---- */
    .icon-wrap.wod  { background: var(--orange-soft); color: var(--orange-text); }
    .icon-wrap.bike { background: var(--teal-soft);   color: var(--teal-text); }

    .workouts .list { display: flex; flex-direction: column; gap: 4px; }
    .workout {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0; border-bottom: 1px solid var(--card-divider);
    }
    .workout:last-child { border: 0; padding-bottom: 0; }
    .workout .icon-wrap {
      width: 36px; height: 36px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .workout .info { flex: 1; min-width: 0; }
    .workout .ttl {
      font-size: 13px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .workout .meta {
      font-size: 11.5px; color: var(--text-secondary); margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .workout .sources { display: flex; gap: 4px; flex-shrink: 0; }
    /* Zone-2 badge (issue #441) */
    .z2-badge {
      font-size: 10px; font-weight: 700; letter-spacing: 0.03em;
      background: rgba(16,185,129,0.12); color: #047857;
      border-radius: 5px; padding: 2px 6px; flex-shrink: 0;
      align-self: center; white-space: nowrap;
    }
    .src-badge {
      width: 26px; height: 26px; border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      background: var(--chip-bg); color: var(--text-secondary);
      font-size: 11px; font-weight: 700;
    }
    .src-badge.strava { background: #fc4c02; color: #fff; }
    .src-badge.stryd  { background: #ff6b1a; color: #fff; }
    .src-badge.manual { background: var(--chip-bg); color: var(--text-secondary); }
    .workouts-empty {
      font-size: 13.5px; color: var(--text-secondary);
      padding: 16px 4px; line-height: 1.5;
    }

    /* ---- Strava stale sync banner ----
       Card-treatment matching .bm-guardrail's small-notice pattern
       (background/border/radius/padding scale) — was bare floating text
       directly on the page's blue gradient background, which now sits right
       after the log-today strip (above the dashboard grid) instead of nestled
       between two large cards, so the lack of a container reads as broken. */
    .strava-stale-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 16px;
      margin-bottom: 14px;
      font-size: 12.5px;
      color: #64748b;
    }
    .strava-stale-banner--syncing { color: #3a4361; font-style: italic; }
    .strava-stale-msg { flex: 1; }
    .strava-stale-banner a { color: #FC4C02; font-weight: 600; text-decoration: none; }
    .strava-stale-banner a:hover { text-decoration: underline; }

    /* ---- ROW 3: TREND CARDS (HRV · Weekly TSS · RHR · Weight) ---- */
    #row-3 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .trend-card {
      background: #fff;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .trend-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .trend-card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      flex: 1;
    }

    .trend-card-period {
      font-size: 11px;
      color: var(--text-tertiary);
      background: var(--chip-bg);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 500;
    }

    .trend-card-stat {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }

    .trend-card-big {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1;
    }

    .trend-card-unit {
      font-size: 13px;
      color: var(--text-tertiary);
      font-weight: 500;
    }

    .trend-delta-pill {
      margin-left: auto;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .trend-delta-pill--up   { background: var(--green-soft); color: var(--green); }
    .trend-delta-pill--down { background: var(--red-soft);   color: var(--red); }
    .trend-delta-pill--flat { background: var(--chip-bg);    color: var(--text-tertiary); }

    .trend-sparkline {
      width: 100%;
      height: 48px;
      display: block;
      overflow: visible;
      flex-shrink: 0;
    }

    .trend-card-footer {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: auto;
    }

    .trend-card-error {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--text-tertiary);
      text-align: center;
      padding: 10px 0;
      min-height: 60px;
    }

    .trend-quick-input {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .trend-quick-input input[type="number"] {
      flex: 1;
      min-width: 0;
      padding: 6px 10px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      background: #f7f9fd;
      color: var(--text-primary);
    }

    .trend-quick-input input[type="number"]:focus {
      outline: none;
      border-color: #2b4ca8;
      background: #fff;
    }

    .trend-quick-save-btn {
      padding: 6px 14px;
      background: #0b1530;
      color: #fff;
      border: 0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .trend-quick-save-btn:disabled { opacity: 0.6; cursor: default; }

    .trend-skeleton-line {
      background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: trend-shimmer 1.3s infinite;
      border-radius: 4px;
    }

    @keyframes trend-shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ---- WEIGHT WIDGET ---- */
    .ww-stat { display: flex; align-items: baseline; gap: 5px; margin-top: 4px; }
    .ww-current { font-size: 28px; font-weight: 700; letter-spacing: -0.025em; line-height: 1; }
    .ww-unit { font-size: 13px; color: var(--text-tertiary); font-weight: 500; }
    .ww-avg { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
    .ww-pills { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .ww-pill {
      font-size: 11px; font-weight: 600;
      padding: 3px 9px; border-radius: 999px; white-space: nowrap;
    }
    .ww-pill--green { background: var(--green-soft); color: var(--green); }
    .ww-pill--red   { background: var(--red-soft);   color: var(--red); }
    .ww-pill--flat  { background: var(--chip-bg);    color: var(--text-tertiary); }
    .ww-sparkline { width: 100%; height: 40px; display: block; overflow: visible; flex-shrink: 0; margin-top: 8px; }
    .ww-progress-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .ww-progress-bar {
      flex: 1; height: 5px; border-radius: 3px;
      background: var(--chip-bg); overflow: hidden;
    }
    .ww-progress-fill { height: 100%; border-radius: 3px; background: #2b4ca8; }
    .ww-status-pill {
      font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
    }
    .ww-status--green { background: var(--green-soft); color: var(--green); }
    .ww-status--amber { background: var(--amber-soft); color: var(--amber); }
    .ww-status--blue  { background: var(--blue-soft);  color: var(--blue-text); }
    .ww-set-target { margin-top: 8px; font-size: 12px; }
    .ww-empty { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-top: 8px; }
    .ww-error { font-size: 13px; color: var(--text-secondary); margin-top: 8px; display: flex; align-items: center; }
    .ww-on_track { background: var(--green-soft); color: var(--green); }

    /* ---- BODY-MODIFIER GUARDRAIL WARNING (issue #1161) ---- */
    .bm-guardrail {
      display: flex; align-items: flex-start; gap: 10px;
      background: #fff7ed; border: 1px solid #fb923c; border-radius: 10px;
      padding: 12px 16px; margin-bottom: 14px; font-size: 13px; line-height: 1.5;
    }
    .bm-guardrail-icon { font-size: 18px; flex-shrink: 0; line-height: 1; margin-top: 1px; }
    .bm-guardrail-label { font-weight: 700; color: #c2410c; margin-right: 4px; }
    .bm-guardrail-msg { color: #7c2d12; }

    /* ---- HOME WEIGHT WIDGET (full-width) ---- */
    #home-weight-widget .card { padding: 22px; }
    .hww-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    .hww-main { display: flex; flex-direction: column; gap: 0; }
    .hww-top-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .hww-current { font-size: 36px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
    .hww-unit { font-size: 14px; color: var(--text-tertiary); font-weight: 500; }
    .hww-gap-pill {
      font-size: 11px; font-weight: 600; padding: 3px 9px;
      border-radius: 999px; white-space: nowrap; margin-left: 6px;
    }
    .hww-gap--behind { background: var(--red-soft); color: var(--red); }
    .hww-gap--ahead  { background: var(--green-soft); color: var(--green); }
    .hww-gap--flat   { background: var(--chip-bg); color: var(--text-tertiary); }
    .hww-avg { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
    .hww-sparkline {
      width: 100%; height: 52px; display: block;
      overflow: visible; flex-shrink: 0; margin-top: 8px;
    }
    .hww-rate { font-size: 12px; margin-top: 6px; font-weight: 500; }
    .hww-rate--goal  { color: var(--green); }
    .hww-rate--flat  { color: var(--text-tertiary); }
    .hww-progress-wrap { margin-top: 8px; }
    .hww-progress-bar {
      height: 4px; border-radius: 2px;
      background: var(--chip-bg); overflow: hidden;
    }
    .hww-progress-fill { height: 100%; border-radius: 2px; background: #2b4ca8; }
    .hww-goal-line { font-size: 11.5px; color: var(--text-secondary); margin-top: 6px; line-height: 1.5; }
    .hww-goal-line a { color: #2b4ca8; text-decoration: none; }
    .hww-no-data { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-top: 8px; }
    /* Stepper section */
    .hww-stepper { display: flex; flex-direction: column; gap: 12px; }
    .hww-stepper-label {
      font-size: 11px; font-weight: 600; color: var(--text-tertiary);
      text-transform: uppercase; letter-spacing: 0.07em;
    }
    .hww-step-row {
      display: flex; align-items: center; gap: 0;
      border: 1.5px solid var(--card-border); border-radius: 12px;
      overflow: hidden; background: #f7f9fd;
    }
    .hww-step-btn {
      width: 48px; min-height: 48px; background: var(--chip-bg);
      color: var(--text-primary); border: 0; font-size: 22px;
      font-family: inherit; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .hww-step-btn:hover { background: #dde6f8; }
    .hww-step-btn:active { background: #c8d6f4; }
    .hww-step-input {
      flex: 1; min-width: 0; border: 0; background: transparent;
      text-align: center; font-family: 'JetBrains Mono', monospace;
      font-size: 20px; font-weight: 600; letter-spacing: -0.02em;
      color: var(--text-primary); padding: 10px 4px;
      -moz-appearance: textfield; min-height: 48px;
    }
    .hww-step-input::-webkit-outer-spin-button,
    .hww-step-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .hww-step-input:focus { outline: none; }
    .hww-log-btn {
      width: 100%; padding: 14px 20px; background: var(--accent);
      color: var(--accent-text); border: 0; border-radius: 12px;
      font-family: inherit; font-size: 14px; font-weight: 700;
      cursor: pointer; letter-spacing: -0.01em; min-height: 48px;
      transition: opacity 0.12s;
    }
    .hww-log-btn:disabled { opacity: 0.55; cursor: default; }
    .hww-compact {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px; background: var(--green-soft);
      border-radius: 12px; font-size: 13px; font-weight: 500; color: var(--green);
    }
    .hww-compact-edit {
      margin-left: auto; font-size: 12px; font-weight: 600;
      color: #2b4ca8; cursor: pointer; text-decoration: none; background: none;
      border: 0; font-family: inherit; padding: 0;
    }
    @media (max-width: 880px) {
      .hww-layout { grid-template-columns: 1fr; gap: 20px; }
      .hww-current { font-size: 32px; }
    }

      font-weight: 600;

      font-size: 11px;
      font-weight: 600;
      margin-top: 3px;
      padding: 2px 7px;
      border-radius: 999px;
      display: inline-block;
    }
    .tw-delta--green { background: var(--green-soft); color: var(--green); }
    .tw-delta--red   { background: var(--red-soft);   color: var(--red); }
    .tw-delta--flat  { background: var(--chip-bg);     color: var(--text-tertiary); }

    /* 7-bar daily-load chart */
    .tw-bar-chart {
      display: flex;
      gap: 6px;
      align-items: flex-end;
      height: 72px;
      margin-top: 8px;
    }
    .tw-bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      height: 100%;
    }
    .tw-bar-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: flex-end;
    }
    .tw-bar {
      width: 100%;
      border-radius: 4px 4px 0 0;
      background: var(--bg-1);
      min-height: 4px;
      transition: height 0.2s;
    }
    .tw-bar--rest  { background: var(--chip-bg); }
    .tw-bar--today { background: var(--accent); }
    .tw-bar-lbl {
      font-size: 10px;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 500;
    }
    .tw-empty {
      font-size: 13.5px;
      color: var(--text-secondary);
      padding: 16px 4px;
    }

    /* ---- SLEEP CARD RIGHT (home-sleep-card) ---- */
    #home-sleep-card {
      min-height: 160px;
    }

    /* ---- RESPONSIVE ---- */
    @media (max-width: 880px) {
      #row-training-sleep { grid-template-columns: 1fr; }
    }

    /* ---- HABITS PROGRESS WIDGET ---- */
    #habits-progress-widget { margin-bottom: 16px; }
    .hp-widget .card-head { margin-bottom: 12px; }
    .hp-body { display: flex; flex-direction: column; gap: 2px; }
    .hp-row {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border-radius: 12px;
      text-decoration: none; color: var(--text-primary);
      transition: background 0.12s;
      cursor: pointer;
    }
    .hp-row:hover { background: var(--shell-1); }
    .hp-row--complete { opacity: 0.7; }
    .hp-icon {
      width: 32px; height: 32px; border-radius: 9px;
      background: var(--chip-bg); display: flex; align-items: center;
      justify-content: center; font-size: 15px; color: var(--text-secondary);
      flex-shrink: 0;
    }
    .hp-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .hp-name-row { display: flex; align-items: center; gap: 6px; }
    .hp-name {
      font-size: 13px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
    }
    .hp-check { color: var(--teal-text); font-size: 13px; flex-shrink: 0; }
    .hp-days { font-size: 11px; color: var(--text-tertiary); flex-shrink: 0; }
    .hp-meta { font-size: 11.5px; color: var(--text-secondary); }
    .hp-bar-outer {
      height: 5px; border-radius: 3px; background: var(--shell-2); overflow: hidden;
    }
    .hp-bar-inner {
      height: 100%; border-radius: 3px; background: var(--bg-1);
      transition: width 0.25s;
    }
    .hp-row--complete .hp-bar-inner { background: var(--teal-text); }
    .hp-empty { font-size: 13.5px; color: var(--text-secondary); padding: 12px 4px; }
    .hp-empty a { color: var(--blue-text); text-decoration: none; }
    .hp-error { font-size: 13px; color: var(--text-secondary); padding: 12px 4px; }
    .hp-retry {
      background: none; border: 1px solid var(--card-border); border-radius: 6px;
      padding: 3px 10px; font-size: 12px; cursor: pointer; font-family: inherit;
      color: var(--text-primary); margin-left: 6px;
    }
    .hp-retry:hover { background: var(--shell-1); }
    /* Skeleton rows */
    .hp-skel-row {
      display: flex; align-items: center; gap: 10px; padding: 9px 10px;
    }
    .hp-skel {
      background: var(--shell-2); border-radius: 4px; animation: hp-pulse 1.4s ease-in-out infinite;
    }
    @keyframes hp-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.45; }
    }
    .hp-skel--icon { width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0; }
    .hp-skel-info { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .hp-skel--name { height: 11px; width: 55%; }
    .hp-skel--bar  { height: 5px;  width: 80%; border-radius: 3px; }

    .habit-inline-error {
      font-size: 12px;
      color: #dc2626;
      padding: 6px 4px 2px;
    }
    /* ==== HOME V2 ==== */

    /* ---- READINESS CTL/ATL/TSB TRIO (extends home-top-row-right) ---- */
    .rd-ctl-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(11, 21, 48, 0.08);
    }
    .rd-ctl-card {
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid #dde3f6;
      border-radius: 10px;
      padding: 9px 8px;
      text-align: center;
    }
    .rd-ctl-v {
      font-family: 'JetBrains Mono', monospace;
      font-size: 17px;
      font-weight: 800;
      line-height: 1;
    }
    .rd-ctl-l {
      font-size: 8px;
      color: var(--text-tertiary);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-top: 3px;
    }
    .rd-ctl-band {
      height: 4px;
      border-radius: 3px;
      margin: 8px 0 4px;
      position: relative;
    }
    .rd-ctl-mk {
      position: absolute;
      top: -2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      border: 1.5px solid #475569;
      transform: translateX(-50%);
    }
    .rd-ctl-stat { font-size: 8.5px; font-weight: 800; letter-spacing: 0.03em; }
    .rd-ctl-spark { width: 100%; height: 24px; margin-top: 5px; display: block; }
    .rd-ctl-bb {
      font-size: 12.5px;
      color: rgba(11, 21, 48, 0.72);
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(11, 21, 48, 0.08);
      line-height: 1.5;
    }

    /* ---- NEXT WORKOUT CARD (home-next-workout-card) ----
       home v3 (Task 1): this card now holds two merged sub-sections (Next
       workout / Recent workout), each with its own sub-head + link row
       (.nw-worksub/.nw-subhead) and a thin divider (.nw-sep) between them —
       "nw-" prefix kept for the whole card, not renamed to a shared
       cross-widget name, since it's still this one card's own scoped
       vocabulary. */
    .nw-worksub {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .nw-subhead {
      font-size: 10px;
      font-weight: 800;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .nw-worksub a { font-size: 12px; color: #2b4ca8; text-decoration: none; white-space: nowrap; }
    .nw-sep {
      border-top: 1px solid var(--card-divider);
      margin: 13px 0;
    }
    .nw-row {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }
    .nw-badge {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .nw-badge--run  { background: var(--blue-soft);   color: var(--blue-text); }
    .nw-badge--lift { background: var(--purple-soft); color: var(--purple-text); }
    .nw-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .nw-name {
      font-size: 13.5px; font-weight: 700; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .nw-meta {
      font-size: 11px; color: var(--text-secondary); font-family: 'JetBrains Mono', monospace;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .nw-arrow { font-size: 14px; color: #2b4ca8; font-weight: 700; flex-shrink: 0; }
    .nw-empty, .nw-loading { font-size: 13.5px; color: var(--text-secondary); padding: 4px 0; }
    .nw-empty a { color: #2b4ca8; text-decoration: none; }

    /* ---- TRAINING CARD: 8-week trend link-out ---- */
    .tw-trendlink {
      font-size: 11px;
      font-weight: 700;
      color: #2b4ca8;
      margin-top: 9px;
      display: inline-block;
      text-decoration: none;
    }

    /* ---- PERFORMANCE CARD (home-performance-card) ----
       Distinct "hperf-" prefix — #home-perf-container's "Personal records"
       card already owns the "perf-" prefix; unrelated widget, same-name
       coincidence only, do not collide with or touch it. */
    .hperf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .hperf-tile {
      background: var(--chip-bg);
      border: 1px solid var(--card-border);
      border-radius: 11px;
      padding: 11px 13px;
    }
    .hperf-lbl {
      font-size: 9px; font-weight: 800; color: var(--text-tertiary);
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .hperf-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px; font-weight: 800; line-height: 1; margin-top: 5px;
    }
    .hperf-tile--e .hperf-val { color: var(--green); }
    .hperf-tile--s .hperf-val { color: var(--orange-text); }
    .hperf-dash { color: var(--text-tertiary); }
    .hperf-delta { font-size: 10.5px; font-family: 'JetBrains Mono', monospace; margin-top: 4px; font-weight: 600; }
    .hperf-delta--up   { color: var(--green); }
    .hperf-delta--down { color: var(--red); }
    .hperf-delta--flat { color: var(--text-tertiary); }
    .hperf-msg, .hperf-loading { font-size: 13.5px; color: var(--text-secondary); padding: 4px 0; line-height: 1.5; }
    .hperf-msg a { color: #2b4ca8; text-decoration: none; }

    /* ---- HOME V2: mobile (home.html's own breakpoint is 640px, not 880) ---- */
    @media (max-width: 640px) {
      .rd-ctl-row  { gap: 6px; }
      .rd-ctl-card { padding: 7px 5px; }
      .rd-ctl-v    { font-size: 14px; }
      .rd-ctl-l    { font-size: 7px; }
      .rd-ctl-stat { font-size: 8px; }
      .nw-name     { font-size: 12.5px; }
      .nw-meta     { font-size: 10px; }
      .hperf-val   { font-size: 20px; }
    }

    /* Mobile (<=479px, home v3): the daily-signal block (ring/score/hint/
       4-tile factor row) stays visible — only the CTL/ATL/TSB trio, a denser
       second data set below it, is dropped to keep the stacked mobile card
       scannable. */
    @media (max-width: 479px) {
      .rd-ctl-row { display: none; }
    }
  </style>
</head>
<body>

<!-- MAIN PAGE -->
<main class="page">
  <div class="greeting">
    <h1 id="greeting-text">Good morning</h1>
    <p id="greeting-date"></p>
  </div>

  <!-- Log-today strip (rendered by JS) -->
  <div id="home-log-today-strip"></div>

  <!-- Banners — stay outside the dashboard grid below, in their own full-width
       block, so they don't have to interrupt a single continuous grid flow. -->
  <div id="body-modifier-guardrail"></div>
  <div id="strava-stale-banner"></div>

  <!-- Unified dashboard grid (home v3 bento layouts). Wide/Medium/Narrow
       hand-place every widget by grid-column/grid-row (see CSS above), so
       DOM order doesn't affect those three. Mobile (<=479px) switches to a
       plain flex column and follows DOM order — this order (Readiness →
       Next+Recent → Performance → Training → Personal records → Habits →
       Weight → Sleep) IS the required Mobile stack order. Each widget still
       finds its own container by the SAME element id it always used — only
       the parent/grid-column/DOM-order changed. #home-workouts-container
       (recent workouts) is gone: merged into #home-next-workout-card, see
       home.js's loadRecentWorkoutsCard / home-readiness-training-sleep.js's
       renderNextWorkoutCard. -->
  <div id="home-dashboard-grid">
    <div id="home-top-row-right" class="grp-training"></div>
    <div id="home-next-workout-card" class="card grp-training"></div>
    <div id="home-performance-card" class="card grp-training"></div>
    <div id="home-training-card" class="card grp-training"></div>
    <div id="home-perf-container"></div>
    <div id="home-habits-widget" class="card grp-training"></div>
    <div id="home-weight-widget"></div>
    <div id="home-sleep-card" class="card sleep-card"></div>
  </div>

  <!-- Fast-log form: revealed when Log Today strip CTA is tapped.
       hidden by default (frontend/js/home-strip-habits.js's lts-cta-btn click
       handler removes the attribute) — the "revealed when tapped" comment
       above was previously aspirational: nothing actually hid this before. -->
  <div id="row-log" style="margin-top:16px;" hidden>
    <section id="fast-log-section" class="card fast-log">
      <div class="card-head">
        <div class="ttl"><i class="ti ti-pencil-plus"></i>Log Today</div>
        <span id="fast-log-date-label" class="meta"></span>
      </div>
      <form id="fast-log-form" novalidate>
        <div class="fm-fields">

          <!-- RHR (30–120) -->
          <div class="fm-field">
            <label class="fm-label" for="fm-rhr">
              Resting HR <span class="fm-unit">bpm</span>
            </label>
            <div class="fm-stepper">
              <button id="fm-rhr-minus" type="button" class="fm-step-btn" aria-label="Decrease RHR">−</button>
              <input id="fm-rhr" class="fm-input" type="number"
                min="30" max="120" step="1" inputmode="numeric" placeholder="—"
                autocomplete="off">
              <button id="fm-rhr-plus" type="button" class="fm-step-btn" aria-label="Increase RHR">+</button>
            </div>
          </div>

          <!-- HRV (0–200) -->
          <div class="fm-field">
            <label class="fm-label" for="fm-hrv">
              HRV <span class="fm-unit">ms</span>
            </label>
            <div class="fm-stepper">
              <button id="fm-hrv-minus" type="button" class="fm-step-btn" aria-label="Decrease HRV">−</button>
              <input id="fm-hrv" class="fm-input" type="number"
                min="0" max="200" step="1" inputmode="numeric" placeholder="—"
                autocomplete="off">
              <button id="fm-hrv-plus" type="button" class="fm-step-btn" aria-label="Increase HRV">+</button>
            </div>
          </div>

          <!-- Sleep hours (0–12, step 0.5) -->
          <div class="fm-field">
            <label class="fm-label" for="fm-sleep">
              Sleep <span class="fm-unit">hours</span>
            </label>
            <div class="fm-stepper">
              <button id="fm-sleep-minus" type="button" class="fm-step-btn" aria-label="Decrease sleep">−</button>
              <input id="fm-sleep" class="fm-input" type="number"
                min="0" max="12" step="0.5" inputmode="decimal" placeholder="—"
                autocomplete="off">
              <button id="fm-sleep-plus" type="button" class="fm-step-btn" aria-label="Increase sleep">+</button>
            </div>
          </div>

          <!-- Fueling / Intake (kcal) -->
          <div class="fm-field">
            <label class="fm-label" for="fm-kcal">
              Intake <span class="fm-unit">kcal</span>
              <span class="fm-optional">(optional)</span>
            </label>
            <div class="fm-stepper">
              <button id="fm-kcal-minus" type="button" class="fm-step-btn" aria-label="Decrease intake">−</button>
              <input id="fm-kcal" class="fm-input" type="number"
                min="1" max="10000" step="50" inputmode="numeric" placeholder="—"
                autocomplete="off">
              <button id="fm-kcal-plus" type="button" class="fm-step-btn" aria-label="Increase intake">+</button>
            </div>
          </div>

          <!-- Energy (1–5 segmented pills) -->
          <div class="fm-field">
            <label class="fm-label">Energy</label>
            <div class="fm-pills" id="fm-energy-pills" role="group" aria-label="Energy 1 to 5">
              <button type="button" class="fm-pill" data-val="1">1</button>
              <button type="button" class="fm-pill" data-val="2">2</button>
              <button type="button" class="fm-pill" data-val="3">3</button>
              <button type="button" class="fm-pill" data-val="4">4</button>
              <button type="button" class="fm-pill" data-val="5">5</button>
            </div>
            <input type="hidden" id="fm-energy-val" name="energy">
          </div>

          <!-- Mood (1–5 segmented pills) -->
          <div class="fm-field">
            <label class="fm-label">Mood</label>
            <div class="fm-pills" id="fm-mood-pills" role="group" aria-label="Mood 1 to 5">
              <button type="button" class="fm-pill" data-val="1">1</button>
              <button type="button" class="fm-pill" data-val="2">2</button>
              <button type="button" class="fm-pill" data-val="3">3</button>
              <button type="button" class="fm-pill" data-val="4">4</button>
              <button type="button" class="fm-pill" data-val="5">5</button>
            </div>
            <input type="hidden" id="fm-mood-val" name="mood">
          </div>

          <!-- Weight (optional, 30–200) -->
          <div class="fm-field">
            <label class="fm-label" for="fm-weight">
              Weight <span class="fm-unit">kg</span>
              <span class="fm-optional">(optional)</span>
            </label>
            <div class="fm-stepper">
              <button id="fm-weight-minus" type="button" class="fm-step-btn" aria-label="Decrease weight">−</button>
              <input id="fm-weight" class="fm-input" type="number"
                min="30" max="200" step="1" inputmode="decimal" placeholder="—"
                autocomplete="off">
              <button id="fm-weight-plus" type="button" class="fm-step-btn" aria-label="Increase weight">+</button>
            </div>
          </div>

          <!-- Notes (optional textarea) -->
          <div class="fm-field">
            <label class="fm-label" for="fm-notes">
              Notes <span class="fm-optional">(optional)</span>
            </label>
            <textarea id="fm-notes" class="fm-textarea" rows="3"
              placeholder="How are you feeling today?"></textarea>
          </div>

        </div><!-- /.fm-fields -->

        <div class="fm-actions">
          <button id="fm-save" type="submit" class="fm-save-btn">Save</button>
          <div id="fm-feedback" class="fm-feedback"></div>
        </div>
      </form>
    </section>
  </div>
</main>

<script src="js/lib/sync-poller.js"></script>

<script src="js/nav.js"></script>
<script src="js/ui-states.js"></script>
<script src="js/wheel-helpers.js"></script>
<script src="js/home-strip-habits.js"></script>
<script src="js/home-readiness-training-sleep.js"></script>
<script src="js/lib/weight-current-card.js"></script>
<script src="js/home.js"></script>

<script src="js/env.js"></script>
</body>
</html>
