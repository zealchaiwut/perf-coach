<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training plan (revamp) – perf-coach</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/revamp.css">
</head>
<body class="rv-page">
  <div class="rv-shell">
    <header class="rv-shell-head">
      <div>
        <h1 class="rv-title">Training</h1>
        <p class="rv-subtitle">Plan week</p>
      </div>
      <nav aria-label="Primary">
        <ul class="rv-tabnav">
          <li><a class="rv-tab" href="/v2/home">Home</a></li>
          <li><a class="rv-tab" href="/v2/training/plan" aria-current="page">Training</a></li>
          <li><a class="rv-tab" href="/v2/performance">Performance</a></li>
        </ul>
      </nav>
    </header>

    <section class="rv-card rv-toolbar-card" aria-label="Training toolbar">
      <nav class="rv-segnav" aria-label="Training views">
        <a href="/v2/training/plan" aria-current="page">Plan</a>
        <a href="/v2/training/log">Log</a>
        <a href="/v2/training/trends">Trends</a>
      </nav>
      <div class="rv-row" id="v2-sync-toolbar"></div>
    </section>

    <div id="v2-plan-shell" class="rv-stack">
      <section class="rv-card rv-stack" id="v2-plan-road" aria-label="Road to race chart"></section>
      <section class="rv-card rv-stack" id="v2-plan-week-load" aria-label="This week load"></section>
      <section class="rv-card rv-stack" id="v2-plan-week-board" aria-label="Week plan board"></section>
    </div>
  </div>

  <div class="rv-toast" id="rv-toast" role="status" aria-live="polite"></div>
  <div class="rv-popover-backdrop" id="v2-coach-popover-backdrop" hidden></div>
  <div class="rv-popover" id="v2-coach-popover" role="dialog" aria-labelledby="v2-coach-popover-title" hidden>
    <h2 class="rv-label" id="v2-coach-popover-title">Coach session</h2>
    <p id="v2-coach-popover-body"></p>
    <button type="button" class="rv-btn rv-btn--secondary" id="v2-coach-popover-close">Close</button>
  </div>

  <script src="/js/lib/app-common.js"></script>
  <script src="/js/lib/v2-sync-toolbar.js"></script>
  <script src="/js/revamp-ui.js"></script>
  <script src="/js/v2-plan-week-board.js"></script>
  <script src="/js/v2-training-plan.js"></script>
</body>
</html>
