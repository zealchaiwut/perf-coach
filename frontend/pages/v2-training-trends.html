<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training trends (revamp) – perf-coach</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/revamp.css">
</head>
<body class="rv-page">
  <div class="rv-shell rv-shell--wide rv-training-page">
    <header class="rv-shell-head rv-home-top">
      <div class="rv-shell-head-text">
        <h1 class="rv-title rv-title--invert">Training</h1>
        <p class="rv-subtitle rv-subtitle--invert">What Stryd and Strava show over months</p>
      </div>
      <nav aria-label="Primary">
        <ul class="rv-tabnav rv-tabnav--invert">
          <li><a class="rv-tab" href="/v2/home">Home</a></li>
          <li><a class="rv-tab on" href="/v2/training/plan" aria-current="page">Training</a></li>
          <li><a class="rv-tab" href="/v2/performance">Performance</a></li>
          <li id="rv-admin-tab" hidden><a class="rv-tab" href="/v2/training/admin">Admin <span class="rv-admin-badge">ADMINS ONLY</span></a></li>
        </ul>
      </nav>
    </header>

    <div class="rv-card rv-trends-toolbar">
      <nav class="rv-subnav" aria-label="Training views">
        <a class="rv-seg" href="/v2/training/plan">Plan</a>
        <a class="rv-seg" href="/v2/training/log">Log</a>
        <a class="rv-seg" href="/v2/training/trends" aria-current="page">Trends</a>
      </nav>
      <div class="rv-trends-range" role="group" aria-label="Chart range">
        <span class="rv-subtitle">Range</span>
        <div class="rv-seg rv-trends-range-btns" id="v2-trends-range-btns"></div>
      </div>
    </div>

    <div class="rv-stack" id="v2-trends-host">
      <p class="rv-section-state" role="status">Loading…</p>
    </div>
  </div>

  <script src="/js/lib/app-common.js"></script>
  <script src="/js/revamp-ui.js"></script>
  <script src="/js/v2-training-trends.js"></script>
</body>
</html>
