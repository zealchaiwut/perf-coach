<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Run View – perf-coach</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Page shell ─────────────────────────────────────────────────────── */
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter Tight', system-ui, sans-serif;
      background: var(--page-bg);
      min-height: 100vh;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }
    main.rv-main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 56px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Card shell ─────────────────────────────────────────────────────── */
    .rv-card {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--card-border);
      box-shadow: 0 6px 20px rgba(8,18,48,0.16);
      padding: 20px;
    }

    /* ── Accent vars used across both run screens ─────────────────────── */
    :root {
      --rv-lime: var(--accent);           /* #e4ff52 — shared lime */
      --rv-teal: #14b8a6;                 /* Zone 2 teal accent */
      --rv-purple: #8b5cf6;               /* personal-record / special highlight */
    }

    /* ── Typography helpers ─────────────────────────────────────────────── */
    .rv-mono { font-family: 'JetBrains Mono', monospace; }
    .rv-section-title {
      margin: 0 0 14px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
    }
    .rv-footnote {
      margin: 10px 0 0;
      font-size: 11px;
      color: var(--text-tertiary);
    }
    .rv-empty { color: var(--text-tertiary); font-size: 13px; margin: 0; }
    .rv-error {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 20px;
      color: var(--danger);
    }

    /* ── Header card ────────────────────────────────────────────────────── */
    .rv-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .rv-header-left { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .rv-header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .rv-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--rv-lime);
      color: var(--accent-text);
      align-self: flex-start;
    }
    .rv-workout-name {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rv-short-id { display: flex; align-items: center; gap: 6px; }
    .rv-id-code { font-size: 12px; color: var(--text-secondary); }
    .rv-copy-btn {
      background: none; border: none; cursor: pointer; padding: 2px 4px;
      color: var(--text-tertiary); font-size: 14px; line-height: 1;
    }
    .rv-copy-btn:hover { color: var(--text-primary); }
    .rv-date { font-size: 13px; color: var(--text-secondary); }
    .rv-src-badge {
      font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px;
    }
    .rv-src-badge--strava { background: #fc4c02; color: #fff; }
    .rv-src-badge--stryd { background: #0ea5e9; color: #fff; }

    /* ── Hero row ───────────────────────────────────────────────────────── */
    .rv-hero-row {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* ── Tiles ──────────────────────────────────────────────────────────── */
    .rv-tile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
    }
    .rv-tile {
      background: var(--tile, #f7f9fd);
      border-radius: 10px;
      padding: 12px 10px;
      text-align: center;
    }
    .rv-tile--hero {
      grid-column: span 2;
      background: linear-gradient(135deg, var(--rv-lime) 0%, #c8f018 100%);
    }
    .rv-tile--lg {
      min-width: 140px;
    }
    .rv-tile-val {
      font-size: 20px;
      font-weight: 700;
      color: var(--ink, #0b1530);
      line-height: 1.2;
    }
    .rv-tile--hero .rv-tile-val { font-size: 28px; }
    .rv-tile-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-2, #5c6886);
      margin-top: 4px;
    }

    /* ── Session profile / segment bar ─────────────────────────────────── */
    .rv-seg-bar {
      display: flex;
      align-items: flex-end;
      height: 40px;
      border-radius: 6px;
      overflow: hidden;
      gap: 1px;
      margin-bottom: 12px;
    }
    .rv-seg-bar-block { border-radius: 2px; min-width: 4px; }
    .rv-seg-rows { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    .rv-seg-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }
    .rv-seg-bullet { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .rv-seg-name { font-weight: 600; min-width: 80px; }
    .rv-seg-dist, .rv-seg-dur, .rv-seg-pace { color: var(--text-secondary); min-width: 70px; }

    /* ── Lap chart ──────────────────────────────────────────────────────── */
    .rv-lap-chart {
      display: flex;
      align-items: flex-end;
      height: 60px;
      gap: 3px;
      margin-bottom: 10px;
    }
    .rv-bar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-width: 0;
    }
    .rv-bar {
      width: 100%;
      border-radius: 3px 3px 0 0;
      min-height: 4px;
      flex-shrink: 0;
    }
    .rv-bar--z2 { outline: 2px solid var(--rv-teal); outline-offset: -2px; }
    .rv-bar-label { font-size: 9px; color: var(--text-tertiary); margin-top: 2px; }
    .rv-metric-toggle {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .rv-mtog {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-input, #d1d5db);
      background: none;
      cursor: pointer;
      color: var(--text-secondary);
    }
    .rv-mtog--active {
      background: var(--rv-teal);
      color: #fff;
      border-color: var(--rv-teal);
    }

    /* ── Lap section title ──────────────────────────────────────────────── */
    .rv-laps-header { margin-bottom: 10px; }

    /* ── Lap table ──────────────────────────────────────────────────────── */
    .rv-lap-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .rv-lap-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 500px;
    }
    .rv-th {
      padding: 6px 8px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-tertiary);
      border-bottom: 1px solid var(--border, #e5e7eb);
      white-space: nowrap;
    }
    .rv-td {
      padding: 8px;
      border-bottom: 1px solid var(--border, #e5e7eb);
      color: var(--text-primary);
    }
    .rv-lap-row--z2 { background: rgba(20, 184, 166, 0.08); }
    .rv-lap-num { font-weight: 600; }
    .rv-z2-pill {
      display: inline-block;
      font-size: 9px;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 3px;
      background: var(--rv-teal);
      color: #fff;
      margin-left: 4px;
      vertical-align: middle;
    }

    /* ── Collapse Len/Cad cols on narrow screens ────────────────────────── */
    @media (max-width: 375px) {
      .rv-col-len, .rv-col-cad { display: none; }
    }

    /* ── Map placeholder ────────────────────────────────────────────────── */
    .rv-map-placeholder {
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--shell-2, #d8e3f5);
      border-radius: 10px;
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* ── Source strip ───────────────────────────────────────────────────── */
    .rv-source-strip {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
    }
    .rv-src-link {
      color: var(--primary, #3b82f6);
      text-decoration: none;
      font-weight: 600;
    }
    .rv-src-link:hover { text-decoration: underline; }
    .rv-src-manual { color: var(--text-tertiary); }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>

  <main class="rv-main">
    <div id="rv-root">
      <div class="rv-card">Loading…</div>
    </div>
  </main>

  <script src="js/nav.js"></script>
  <script src="js/zone2-constants.js"></script>
  <script src="js/run-view.js"></script>
</body>
</html>
