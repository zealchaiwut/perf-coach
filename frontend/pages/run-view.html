<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Run View – perf-coach</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── Page shell ─────────────────────────────────────────────────────── */
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Inter Tight", system-ui, sans-serif;
        background: var(--page-bg);
        min-height: 100vh;
        color: var(--text-primary);
        letter-spacing: -0.01em;
      }
      main.rv-main {
        max-width: 900px;
        margin: 0 auto;
        padding: 24px 16px 56px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* ── Card shell ─────────────────────────────────────────────────────── */
      .rv-card {
        background: var(--card-bg);
        border-radius: 14px;
        border: 1px solid var(--card-border);
        box-shadow: 0 6px 20px rgba(8, 18, 48, 0.16);
        padding: 14px 15px;
      }

      /* ── Accent vars used across both run screens ─────────────────────── */
      :root {
        --rv-lime: var(--accent); /* #e4ff52 — shared lime */
        --rv-teal: #14b8a6; /* Zone 2 teal accent */
        --rv-purple: #8b5cf6; /* personal-record / special highlight */
      }

      /* ── Typography helpers ─────────────────────────────────────────────── */
      .rv-mono {
        font-family: "JetBrains Mono", monospace;
      }
      .rv-section-title {
        margin: 0 0 10px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-tertiary);
      }
      .rv-footnote {
        margin: 10px 0 0;
        font-size: 11px;
        color: var(--text-tertiary);
      }
      .rv-empty {
        color: var(--text-tertiary);
        font-size: 13px;
        margin: 0;
      }
      .rv-error {
        background: var(--card-bg);
        border-radius: 14px;
        padding: 20px;
        color: var(--danger);
      }

      /* ── Header card ────────────────────────────────────────────────────── */
      .rv-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }
      .rv-header-left {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .rv-header-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
      }
      .rv-badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        padding: 3px 8px;
        border-radius: 4px;
        background: var(--rv-lime);
        color: var(--accent-text);
        align-self: flex-start;
      }
      .rv-workout-name {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .rv-short-id {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .rv-id-code {
        font-size: 12px;
        color: var(--text-secondary);
      }
      .rv-copy-btn {
        background: none;
        border: none;
        cursor: pointer;
        padding: 2px 4px;
        color: var(--text-tertiary);
        font-size: 14px;
        line-height: 1;
      }
      .rv-copy-btn:hover {
        color: var(--text-primary);
      }
      .rv-date {
        font-size: 13px;
        color: var(--text-secondary);
      }
      .rv-src-badge {
        font-size: 11px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 4px;
      }
      .rv-src-badge--strava {
        background: #fc4c02;
        color: #fff;
      }
      .rv-src-badge--stryd {
        background: #0ea5e9;
        color: #fff;
      }

      /* ── Hero strip (replaces 3 stacked hero tiles) ───────────────────── */
      .rv-hero-strip {
        display: flex;
        align-items: stretch;
        background: var(--tile, #f6f8fc);
        border-radius: 10px;
        overflow: hidden;
        margin-top: 10px;
      }
      .rv-hero-cell {
        flex: 1;
        padding: 10px 12px;
        border-right: 1px solid var(--card-border, rgba(13, 30, 67, 0.07));
      }
      .rv-hero-cell:last-child {
        border-right: none;
      }
      .rv-hero-cell-val {
        font-family: "JetBrains Mono", monospace;
        font-size: 18px;
        font-weight: 700;
        line-height: 1;
        color: var(--text-primary);
      }
      .rv-hero-cell-lbl {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-tertiary);
        margin-top: 4px;
      }

      /* ── Tiles (Load & Intensity 4-col compact grid) ────────────────────── */
      .rv-tile-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1px;
        background: #eef1f6;
        border-radius: 10px;
        overflow: hidden;
      }
      .rv-tile {
        background: #fff;
        padding: 9px 10px;
        text-align: left;
        min-height: 0;
      }
      .rv-tile--hero {
        background: linear-gradient(135deg, #eef3ff, #f6f9ff);
      }
      .rv-tile--lg {
        min-width: 0;
      }
      .rv-tile-val {
        font-size: 15px;
        font-weight: 700;
        color: var(--text-primary, #0b1530);
        line-height: 1;
        margin-top: 4px;
        font-family: "JetBrains Mono", monospace;
      }
      .rv-tile--hero .rv-tile-val {
        font-size: 17px;
        color: #2563eb;
      }
      .rv-tile-label {
        font-size: 8px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-tertiary, #8b95ad);
        display: flex;
        align-items: center;
        gap: 3px;
        flex-wrap: wrap;
        line-height: 1.3;
      }
      /* ── Source pills on stat tiles ─────────────────────────────────────── */
      .rv-pill {
        font-size: 7px;
        font-weight: 800;
        padding: 1px 4px;
        border-radius: 3px;
        letter-spacing: 0.03em;
        vertical-align: middle;
        line-height: 1.4;
      }
      .rv-pill--stryd { background: #7c5cff; color: #fff; }
      .rv-pill--strava { background: #fc4c02; color: #fff; }

      /* ── Theme 2: session profile (bars + zone brackets) + laps chart ──── */
      .rv2-warmup-c { color: #3b82f6; }
      :root {
        --rv2-warmup: #3b82f6;  --rv2-steady: #22c55e;  --rv2-tempo: #f59e0b;
        --rv2-threshold: #f97316;  --rv2-cooldown: #a78bfa;
        --rv2-bar: #2563eb;  --rv2-power: #8b5cf6;  --rv2-hr: #ef4444;
        --rv2-grid: rgba(13,30,67,0.10);
      }
      .rv2-card-title {
        font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
        color: var(--text-tertiary, #8b95ad); display: flex; justify-content: space-between;
        margin: 0 0 14px;
      }
      .rv2-basis { font-family: var(--mono, "JetBrains Mono", monospace); }
      .rv2-sp-chart { position: relative; }
      .rv2-grid {
        position: absolute; inset: 0; z-index: 0; pointer-events: none;
        display: flex; flex-direction: column; justify-content: space-between;
      }
      .rv2-grid span { border-top: 1px dotted var(--rv2-grid); height: 0; }
      .rv2-row { display: flex; gap: 0; align-items: flex-end; }
      .rv2-sp-bars { position: relative; z-index: 1; height: 90px; }
      .rv2-cell { min-width: 0; padding: 0 3px; box-sizing: border-box; }
      .rv2-bar { width: 100%; border-radius: 4px 4px 0 0; min-height: 5px; }
      .rv2-bracket-row { margin-top: 8px; }
      .rv2-bracket { text-align: center; }
      .rv2-bracket-line {
        height: 9px; border: 1.5px solid var(--text-secondary, #5c6886); border-bottom: none;
        border-radius: 5px 5px 0 0; opacity: 0.45;
      }
      .rv2-bracket-name { margin-top: 5px; font-size: 12px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
      .rv2-bracket-range { font-size: 10px; color: var(--text-secondary, #5c6886); margin-top: 2px; }
      .nm-warmup { color: var(--rv2-warmup); }
      .nm-steady { color: var(--rv2-steady); }
      .nm-tempo { color: var(--rv2-tempo); }
      .nm-threshold { color: var(--rv2-threshold); }
      .nm-cooldown { color: var(--rv2-cooldown); }
      .rv2-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 14px; font-size: 12px; color: var(--text-secondary, #5c6886); }
      .rv2-legend span { display: inline-flex; align-items: center; gap: 6px; }
      .rv2-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

      .rv2-chart { position: relative; height: 140px; margin-bottom: 4px; }
      .rv2-chart-bars { position: relative; z-index: 1; height: 100%; }
      .rv2-cbar { width: 100%; border-radius: 4px 4px 0 0; min-height: 4px; }
      .rv2-cbar.z2 { outline: 2px solid var(--rv-teal, #14b8a6); outline-offset: -2px; }
      .rv2-hr-svg { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
      .rv2-axis { margin-top: 4px; }
      .rv2-axis .rv2-cell { text-align: center; font-size: 10px; color: var(--text-tertiary, #8b95ad); }
      .rv2-chart-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 10px; font-size: 12px; color: var(--text-secondary, #5c6886); }
      .rv2-chart-legend span { display: inline-flex; align-items: center; gap: 7px; }
      .rv2-swatch { width: 14px; height: 10px; border-radius: 2px; }
      .rv2-hr-key { width: 16px; height: 0; border-top: 3px solid var(--rv2-hr); border-radius: 2px; }

      /* ── Session profile / segment bar (legacy fallback) ───────────────── */
      .rv-seg-bar {
        display: flex;
        align-items: flex-end;
        height: 40px;
        border-radius: 6px;
        overflow: hidden;
        gap: 1px;
        margin-bottom: 12px;
      }
      .rv-seg-bar-block {
        border-radius: 2px;
        min-width: 4px;
      }
      .rv-seg-rows {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 4px;
      }
      .rv-seg-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
      }
      .rv-seg-bullet {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .rv-seg-name {
        font-weight: 600;
        min-width: 80px;
      }
      .rv-seg-dist,
      .rv-seg-dur,
      .rv-seg-pace {
        color: var(--text-secondary);
        min-width: 70px;
      }

      /* ── Lap chart ──────────────────────────────────────────────────────── */
      .rv-lap-chart {
        display: flex;
        align-items: flex-end;
        height: 60px;
        gap: 3px;
        margin-bottom: 10px;
      }
      .rv-bar-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
        min-width: 0;
      }
      .rv-bar {
        width: 100%;
        border-radius: 3px 3px 0 0;
        min-height: 4px;
        flex-shrink: 0;
      }
      .rv-bar--z2 {
        outline: 2px solid var(--rv-teal);
        outline-offset: -2px;
      }
      .rv-bar-label {
        font-size: 9px;
        color: var(--text-tertiary);
        margin-top: 2px;
      }
      .rv-metric-toggle {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
      }
      .rv-mtog {
        font-size: 12px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid var(--border-input, #d1d5db);
        background: none;
        cursor: pointer;
        color: var(--text-secondary);
      }
      .rv-mtog--active {
        background: var(--rv-teal);
        color: #fff;
        border-color: var(--rv-teal);
      }

      /* ── Lap section title ──────────────────────────────────────────────── */
      .rv-laps-header {
        margin-bottom: 10px;
      }

      /* ── Lap table ──────────────────────────────────────────────────────── */
      .rv-lap-table-wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      .rv-lap-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
        table-layout: fixed;
      }
      .rv-th {
        padding: 5px 4px;
        text-align: right;
        font-size: 8px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: var(--text-tertiary);
        border-bottom: 1px solid var(--card-border, #e5e7eb);
        white-space: nowrap;
      }
      .rv-th:first-child {
        text-align: left;
      }
      .rv-td {
        padding: 5px 4px;
        border-bottom: 1px solid #f3f5f9;
        color: var(--text-primary);
        text-align: right;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .rv-td:first-child {
        text-align: left;
      }
      .rv-lap-row--z2 {
        background: rgba(20, 184, 166, 0.08);
      }
      .rv-lap-num {
        font-weight: 600;
      }
      .rv-z2-pill {
        display: inline-block;
        font-size: 9px;
        font-weight: 700;
        padding: 1px 4px;
        border-radius: 3px;
        background: var(--rv-teal);
        color: #fff;
        margin-left: 4px;
        vertical-align: middle;
      }

      /* ── Collapse Len/Cad cols on narrow screens ────────────────────────── */
      @media (max-width: 375px) {
        .rv-col-len,
        .rv-col-cad {
          display: none;
        }
      }

      /* ── Map placeholder ────────────────────────────────────────────────── */
      .rv-map-placeholder {
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--shell-2) 0%, var(--shell-1) 100%);
        border-radius: 10px;
        color: var(--text-secondary);
        font-size: 14px;
      }

      /* ── Source strip ───────────────────────────────────────────────────── */
      .rv-source-strip {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 13px;
      }
      .rv-src-link {
        color: var(--primary, #3b82f6);
        text-decoration: none;
        font-weight: 600;
      }
      .rv-src-link:hover {
        text-decoration: underline;
      }
      .rv-src-manual {
        color: var(--text-tertiary);
      }
      .rv-src-merged {
        color: var(--text-secondary);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="nav-placeholder"></div>

    <main class="rv-main">
      <div id="rv-root">
        <div class="rv-card">Loading…</div>
      </div>
    </main>

    <script src="js/nav.js"></script>
    <script src="js/zone2-constants.js"></script>
    <script src="js/run-view.js"></script>
  </body>
</html>
