<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In – perf-coach</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100vh; }
    body {
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    @media (prefers-reduced-motion: no-preference) {
      /* Opacity only — transform on body breaks clicks in some embedded browsers (e.g. Cursor Simple Browser). */
      .login-card { animation: page-in 0.35s ease-out both; }
    }
    @keyframes page-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    main {
      width: 100%;
      max-width: 380px;
      padding: 0;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      width: 100%;
      box-shadow: 0 1px 2px rgba(17, 24, 39, 0.04), 0 12px 32px rgba(17, 24, 39, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .brand-text {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    h1 {
      margin: 0 0 24px;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .field input {
      width: 100%;
      min-height: 44px;
      padding: 11px 14px;
      border: 1.5px solid var(--border-input);
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      -webkit-appearance: none;
      appearance: none;
    }
    .field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--focus-ring);
    }
    .field input[aria-invalid="true"] {
      border-color: var(--danger);
    }
    .field input[aria-invalid="true"]:focus {
      box-shadow: 0 0 0 4px var(--danger-soft);
    }
    /* Hide browser autofill / keychain chips inside text fields */
    .field input::-webkit-credentials-auto-fill-button,
    .field input::-webkit-strong-password-auto-fill-button,
    .field input::-webkit-contacts-auto-fill-button {
      visibility: hidden;
      display: none !important;
      pointer-events: none;
    }

    /* Password row — single pill box; reveal btn nested on the right */
    .password-wrap {
      display: flex;
      align-items: stretch;
      border: 1.5px solid var(--border-input);
      border-radius: 10px;
      background: var(--surface);
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .password-wrap:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--focus-ring);
    }
    .password-wrap.has-error {
      border-color: var(--danger);
    }
    .password-wrap.has-error:focus-within {
      box-shadow: 0 0 0 4px var(--danger-soft);
    }
    .password-wrap input {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 11px 8px 11px 14px;
    }
    .password-wrap input:focus { box-shadow: none; }
    .password-wrap input::-webkit-credentials-auto-fill-button,
    .password-wrap input::-webkit-strong-password-auto-fill-button {
      visibility: hidden;
      display: none !important;
      pointer-events: none;
    }
    .reveal-btn {
      flex-shrink: 0;
      align-self: stretch;
      width: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 0;
      border-left: 1px solid var(--border);
      padding: 0;
      cursor: pointer;
      color: var(--text-sub);
      transition: background 0.15s, color 0.15s;
    }
    .reveal-btn svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
      flex-shrink: 0;
    }
    .reveal-btn:hover { color: var(--text); background: var(--surface-2); }
    .reveal-btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: -2px;
    }
    .reveal-btn .eye-off { display: none; }
    .reveal-btn.is-revealed .eye-on { display: none; }
    .reveal-btn.is-revealed .eye-off { display: block; }

    .error-msg {
      display: none;
      align-items: flex-start;
      gap: 8px;
      background: var(--danger-soft);
      color: var(--danger-dark);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
    }
    .error-msg.is-visible { display: flex; }
    .error-msg i { font-size: 15px; flex-shrink: 0; margin-top: 1px; }

    .submit-btn {
      width: 100%;
      min-height: 44px;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: 0;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, opacity 0.15s;
    }
    .submit-btn:hover:not(:disabled) { background: var(--primary-dark); }
    .submit-btn:focus-visible {
      outline: 2px solid var(--primary-dark);
      outline-offset: 2px;
    }
    .submit-btn:disabled { opacity: 0.65; cursor: default; }
    .submit-btn .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .submit-btn .spinner { animation-duration: 1.4s; }
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0;
      color: var(--text-sub);
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .google-btn {
      width: 100%;
      min-height: 44px;
      padding: 11px;
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border-input);
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.15s, border-color 0.15s;
      text-decoration: none;
    }
    .google-btn:hover { background: var(--surface-2); border-color: var(--text-sub); }
    .google-btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    .google-btn svg { flex-shrink: 0; }

    .env-badge {
      margin-top: 20px;
      padding: 8px 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 11.5px;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .env-badge .env-pill {
      background: var(--primary);
      color: #fff;
      border-radius: 5px;
      padding: 1px 7px;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      flex-shrink: 0;
    }
    .env-badge .env-pill.prd { background: var(--danger); }
    .env-badge .env-pill.local { background: var(--success); }
    .env-badge .db-host {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (max-width: 440px) {
      .login-card { padding: 28px 20px; }
    }
  </style>
</head>
<body>
<main>
<div class="login-card">
  <div class="brand">
    <span class="brand-mark"><i class="ti ti-activity-heartbeat" aria-hidden="true"></i></span>
    <span class="brand-text">perf-coach</span>
  </div>
  <h1>Welcome back</h1>
  <form id="login-form" novalidate>
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus
             aria-invalid="false" aria-describedby="error-text">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="password-wrap" id="password-wrap">
        <input type="password" id="password" name="password" autocomplete="current-password"
               autocorrect="off" autocapitalize="off" spellcheck="false"
               data-1p-ignore data-lpignore="true" required
               aria-invalid="false" aria-describedby="error-text">
        <button type="button" id="reveal-btn" class="reveal-btn" aria-label="Show password" aria-pressed="false">
          <svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 3l18 18"/>
            <path d="M10.58 10.58a2 2 0 0 0 2.83 2.83"/>
            <path d="M9.88 5.09A10.94 10.94 0 0 1 12 5c6.5 0 10 7 10 7a18.45 18.45 0 0 1-4.06 5.06"/>
            <path d="M6.12 6.12A18.45 18.45 0 0 0 2 12s3.5 7 10 7a10.94 10.94 0 0 0 2.91-.39"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="error-msg" class="error-msg" role="alert" aria-live="assertive">
      <i class="ti ti-alert-circle" aria-hidden="true"></i>
      <span id="error-text"></span>
    </div>
    <button type="submit" id="submit-btn" class="submit-btn">
      <span id="btn-label">Log in</span>
    </button>
  </form>
  <div id="env-badge" class="env-badge" hidden>
    <span id="env-pill" class="env-pill"></span>
    <span class="db-host" id="env-db-host"></span>
  </div>

  <div id="google-section" hidden>
    <div class="divider">or</div>
    <a href="/auth/google" class="google-btn" id="google-btn">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M17.64 9.2045c0-.638-.0573-1.252-.1636-1.8409H9v3.4814h4.8436c-.2086 1.125-.8427 2.0782-1.7959 2.7164v2.2581h2.9087C16.6582 14.252 17.64 11.9455 17.64 9.2045z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.4673-.8064 5.9564-2.1818l-2.9087-2.2582c-.8064.54-1.8382.8591-3.0477.8591-2.3445 0-4.3282-1.5836-5.036-3.7118H.9574v2.3318C2.4382 15.9832 5.4818 18 9 18z" fill="#34A853"/>
        <path d="M3.964 10.71c-.18-.54-.2827-1.1168-.2827-1.71s.1027-1.17.2827-1.71V4.9582H.9573C.3477 6.1732 0 7.5477 0 9s.3477 2.8268.9573 4.0418L3.964 10.71z" fill="#FBBC05"/>
        <path d="M9 3.5791c1.3214 0 2.5077.4545 3.4405 1.346l2.5814-2.5814C13.4627.8918 11.4255 0 9 0 5.4818 0 2.4382 2.0168.9573 4.9582L3.964 7.29C4.6718 5.1618 6.6555 3.5791 9 3.5791z" fill="#EA4335"/>
      </svg>
      Sign in with Google
    </a>
  </div>
</div>
</main>
<script>
(function () {
  'use strict';

  var form = document.getElementById('login-form');
  var btn = document.getElementById('submit-btn');
  var btnLabel = document.getElementById('btn-label');
  var errorMsg = document.getElementById('error-msg');
  var errorText = document.getElementById('error-text');
  var usernameInput = document.getElementById('username');
  var passwordInput = document.getElementById('password');
  var passwordWrap = document.getElementById('password-wrap');

  function setLoading(on) {
    btn.disabled = on;
    if (on) {
      btnLabel.textContent = '';
      var spinner = document.createElement('span');
      spinner.className = 'spinner';
      spinner.id = 'btn-spinner';
      btn.appendChild(spinner);
    } else {
      var s = document.getElementById('btn-spinner');
      if (s) s.remove();
      btnLabel.textContent = 'Log in';
    }
  }

  function showError(msg) {
    errorText.textContent = msg;
    errorMsg.classList.add('is-visible');
    usernameInput.setAttribute('aria-invalid', 'true');
    passwordInput.setAttribute('aria-invalid', 'true');
    passwordWrap.classList.add('has-error');
  }

  function hideError() {
    errorText.textContent = '';
    errorMsg.classList.remove('is-visible');
    usernameInput.setAttribute('aria-invalid', 'false');
    passwordInput.setAttribute('aria-invalid', 'false');
    passwordWrap.classList.remove('has-error');
  }

  var revealBtn = document.getElementById('reveal-btn');
  revealBtn.addEventListener('click', function () {
    var show = passwordInput.type === 'password';
    passwordInput.type = show ? 'text' : 'password';
    revealBtn.setAttribute('aria-pressed', show ? 'true' : 'false');
    revealBtn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    revealBtn.classList.toggle('is-revealed', show);
  });

  fetch('/api/auth/google-status')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.enabled) {
        document.getElementById('google-section').hidden = false;
      }
    })
    .catch(function () {});

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    hideError();

    var username = usernameInput.value.trim();
    var password = passwordInput.value;

    if (!username || !password) {
      showError('Please enter your username and password.');
      return;
    }

    setLoading(true);

    // This standalone page doesn't load the global CSRF fetch-patch
    // (nav.js/user.js), so attach the token manually. Fetch /api/csrf-token
    // first to ensure the csrf-token cookie exists, then send it as a header —
    // required when a (possibly stale) session cookie is already present.
    fetch('/api/csrf-token', { method: 'GET', credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : { csrf_token: '' }; })
      .catch(function () { return { csrf_token: '' }; })
      .then(function (tok) {
        var headers = { 'Content-Type': 'application/json' };
        if (tok && tok.csrf_token) { headers['X-CSRF-Token'] = tok.csrf_token; }
        return fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: headers,
          body: JSON.stringify({ username: username, password: password }),
        });
      })
      .then(function (res) {
        if (res.ok) {
          window.location.href = '/home';
        } else {
          return res.json().then(function (body) {
            setLoading(false);
            showError(body.detail || 'Login failed. Please try again.');
          }).catch(function () {
            setLoading(false);
            showError('Login failed. Please try again.');
          });
        }
      })
      .catch(function () {
        setLoading(false);
        showError('Network error. Please check your connection.');
      });
  });

  fetch('/api/env')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var badge = document.getElementById('env-badge');
      var pill = document.getElementById('env-pill');
      var dbHost = document.getElementById('env-db-host');
      var env = (data.environment || 'local').toLowerCase();
      pill.textContent = env;
      pill.className = 'env-pill ' + env;
      dbHost.textContent = data.db_host || '';
      badge.hidden = false;
    })
    .catch(function () {});
}());
</script>
</body>
</html>
