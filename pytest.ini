[pytest]
# This repo had NO pytest config of its own. pytest walks up looking for one, so
# it silently inherited ~/dev/pytest.ini — a file belonging to the sibling
# `commander` project — whose only setting was `timeout = 60`, with
# pytest-timeout not installed. Every run printed "Unknown config option:
# timeout" and the timeout did nothing (issue #1606).
testpaths = tests

# A hung test is the worst CI failure mode: not red, never finishes. This is
# enforced now that pytest-timeout is in requirements-dev.txt. Generous enough
# for the live-server integration tests that legitimately wait on I/O.
timeout = 60

markers =
    integration: needs a live HTTP server on :9001 and/or a live Postgres. Applied
        AUTOMATICALLY by tests/conftest.py based on what the file references — do
        not hand-apply it, and do not remove the auto-marking to "fix" a failure.
    requires_postgres: needs a real Postgres schema (JSONB/UUID columns, or
        Postgres-only SQL like now()/gen_random_uuid()/ON CONFLICT) that the SQLite
        fallback cannot provide (see conftest.py's DATABASE_URL default) and that
        this repo will not teach SQLite to fake (#1606). tests/conftest.py applies
        this AUTOMATICALLY when a test's own call graph reaches backend.db.engine on
        the SQLite fallback and dies with a schema-shaped OperationalError — grepping
        the test file's source (like the `integration` marker above) can't catch this
        because the live-DB call is often several calls deep in application code the
        test file never mentions. Do not hand-apply it as a way to silence a failure
        that isn't actually one of these signatures.

# Collection errors are the thing this suite most needs to stop tolerating.
# Three features have been silently reverted by merges in this repo, and every
# one stayed invisible because its regression test raised ImportError at
# collection — which pytest reports as a top-level interruption rather than a
# failure, so it vanished among the environmental noise. #1605 shipped broken
# for 41 days that way.
#
# CI runs with --continue-on-collection-errors OFF, so any collection error
# fails the build.
addopts =
    --strict-markers
    -p no:cacheprovider
