<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weight – perf-coach</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .chart-wrapper {
      position: relative;
      width: 100%;
      max-width: 720px;
      margin-bottom: 2rem;
    }

    .weight-form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-width: 360px;
      margin-bottom: 2rem;
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .weight-form label {
      font-size: 0.875rem;
      font-weight: 500;
      color: #444;
    }

    .weight-form input {
      padding: 0.5rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
      width: 100%;
    }

    .weight-form input:focus {
      outline: none;
      border-color: #0070f3;
      box-shadow: 0 0 0 2px rgba(0,112,243,0.15);
    }

    .error-msg {
      font-size: 0.8125rem;
      color: #c0392b;
      min-height: 1.2em;
    }

    .weight-form button {
      align-self: flex-start;
      padding: 0.5rem 1.25rem;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.9375rem;
      cursor: pointer;
    }

    .weight-form button:hover {
      background: #333;
    }

    h2 {
      font-size: 1rem;
      margin: 0 0 0.75rem;
      color: #444;
    }

    #entry-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #entry-list li {
      display: flex;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid #e5e5e5;
      font-size: 0.9375rem;
    }

    #entry-list li.empty {
      color: #888;
      border-bottom: none;
    }

    .entry-weight {
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <h1>Weight</h1>
    <span id="env-label" class="env-label"></span>
  </header>
  <main>
    <div class="chart-wrapper">
      <canvas id="weight-chart"></canvas>
    </div>

    <form id="weight-form" class="weight-form" novalidate>
      <div class="form-row">
        <label for="weight-input">Weight (kg)</label>
        <input id="weight-input" type="number" step="0.1" min="0" placeholder="e.g. 72.5">
        <span id="weight-error" class="error-msg" role="alert"></span>
      </div>
      <div class="form-row">
        <label for="date-input">Date</label>
        <input id="date-input" type="date">
      </div>
      <button type="submit">Add entry</button>
    </form>

    <h2>Entries</h2>
    <ul id="entry-list"></ul>

    <p style="margin-top:2rem"><a href="index.html">Back</a></p>
  </main>
  <script src="js/mock-data.js"></script>
  <script src="js/weight.js"></script>
  <script src="js/user.js"></script>
  <script src="js/env.js"></script>
</body>
</html>
