<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar – perf-coach</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    main { max-width: 840px; }

    .cal-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .cal-nav {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .cal-nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      cursor: pointer;
      color: #374151;
      flex-shrink: 0;
    }

    .cal-nav-btn:hover { background: #f3f4f6; }

    .cal-nav-btn svg { pointer-events: none; }

    .cal-month-label {
      font-size: 1.25rem;
      font-weight: 600;
      color: #1a1a1a;
      min-width: 180px;
      text-align: center;
    }

    .cal-today-btn {
      padding: 0.3rem 0.75rem;
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      color: #374151;
    }

    .cal-today-btn:hover { background: #f3f4f6; }

    .cal-filters {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .cal-filter-label {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.8125rem;
      color: #444;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }

    .cal-filter-label input[type="checkbox"] {
      width: 0.875rem;
      height: 0.875rem;
      cursor: pointer;
    }

    .cal-grid-scroll {
      width: 100%;
    }

    .cal-grid {
      width: 100%;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      overflow: hidden;
    }

    .cal-grid-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: #f9fafb;
      border-bottom: 1px solid #e5e5e5;
    }

    .cal-dow {
      padding: 0.5rem 0;
      text-align: center;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #6b7280;
    }

    .cal-grid-cells {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      transition: opacity 75ms ease;
    }

    .cal-grid-cells.fading { opacity: 0; }

    .cal-cell {
      min-height: 90px;
      border-right: 1px solid #e5e5e5;
      border-bottom: 1px solid #e5e5e5;
      padding: 0.375rem 0.5rem;
      background: #fff;
      overflow: hidden;
    }

    .cal-cell:nth-child(7n) { border-right: none; }

    .cal-cell:nth-last-child(-n+7) { border-bottom: none; }

    .cal-cell.out-of-month {
      opacity: 0.4;
      background: #fafafa;
    }

    .cal-cell.today { background: #e0f2fe; }

    .cal-day-num {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: #374151;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cal-cell.today .cal-day-num {
      color: #0284c7;
      font-weight: 700;
    }

    /* < 900px: shrink cells to 60px min-height */
    @media (max-width: 899px) {
      .cal-cell {
        min-height: 60px;
        padding: 0.25rem 0.3rem;
      }

      .cal-day-num { font-size: 0.75rem; }
    }

    /* < 700px: allow horizontal scroll so grid never crashes */
    @media (max-width: 699px) {
      .cal-grid-scroll {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .cal-grid {
        min-width: 420px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Calendar</h1>
    <span id="env-label" class="env-label"></span>
  </header>
  <main>
    <div class="cal-toolbar">
      <div class="cal-nav">
        <button class="cal-nav-btn" id="prev-btn" aria-label="Previous month">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="cal-month-label" id="month-label"></span>
        <button class="cal-nav-btn" id="next-btn" aria-label="Next month">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
        <button class="cal-today-btn" id="today-btn">Today</button>
      </div>
      <div class="cal-filters">
        <label class="cal-filter-label">
          <input type="checkbox" id="filter-weight" checked> Show Weight
        </label>
        <label class="cal-filter-label">
          <input type="checkbox" id="filter-habits" checked> Show Habits
        </label>
        <label class="cal-filter-label">
          <input type="checkbox" id="filter-training" checked> Show Training
        </label>
      </div>
    </div>

    <div class="cal-grid-scroll">
      <div class="cal-grid">
        <div class="cal-grid-header">
          <div class="cal-dow">Mon</div>
          <div class="cal-dow">Tue</div>
          <div class="cal-dow">Wed</div>
          <div class="cal-dow">Thu</div>
          <div class="cal-dow">Fri</div>
          <div class="cal-dow">Sat</div>
          <div class="cal-dow">Sun</div>
        </div>
        <div class="cal-grid-cells" id="cal-grid-cells"></div>
      </div>
    </div>

    <nav style="margin-top: 2rem">
      <a href="home.html">Home</a>
      <a href="weight.html">Weight</a>
      <a href="habits.html">Habits</a>
      <a href="users.html">Users</a>
    </nav>
  </main>

  <script src="js/calendar.js"></script>
  <script src="js/user.js"></script>
  <script src="js/env.js"></script>
</body>
</html>
