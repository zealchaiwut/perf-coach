<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gym mode · 40/20 intervals</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#e4ff52}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0b1530; font-family: 'Inter Tight', system-ui, sans-serif; color: #ffffff; letter-spacing: -0.01em; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 16px 16px 8px; display: flex; align-items: center; gap: 10px">
    <a href="GymOverview.dc.html" aria-label="Session overview" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); display: inline-flex; align-items: center; justify-content: center; color: #ffffff; text-decoration: none; font-size: 20px">‹</a>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: #e4ff52">SECTION 5 OF 6 · CORE · 40/20 × 6</span>
      <span style="font-size: 13px; color: #c9d5ef">40 s work · 20 s rest · alternate</span>
    </div>
  </div>

  <div style="margin: 6px 16px 0; border-radius: 20px; background: #e4ff52; color: #0b1530; padding: 22px 18px; display: flex; flex-direction: column; align-items: center; gap: 6px">
    <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.12em">WORK · INTERVAL 3 OF 6</span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 84px; font-weight: 700; line-height: 1; letter-spacing: -0.05em">0:27</span>
    <span style="font-size: 22px; font-weight: 800">Dead bug</span>
    <div style="width: 100%; height: 8px; border-radius: 999px; background: rgba(11,21,48,0.15); margin-top: 8px; position: relative; overflow: hidden"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 33%; background: #0b1530; border-radius: 999px"></span></div>
  </div>

  <div style="margin: 10px 16px 0; border-radius: 14px; background: rgba(147,197,253,0.14); border: 1px solid rgba(147,197,253,0.35); padding: 12px 14px; display: flex; justify-content: space-between; align-items: center">
    <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: #93c5fd">THEN REST 0:20</span><span style="font-size: 15px; font-weight: 700">Next: Mountain climber</span></span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #c9d5ef">4 / 6</span>
  </div>

  <div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 12px; font-weight: 700; color: #a8b6d6">Intervals</span>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px">
      <span style="height: 30px; border-radius: 8px; background: #4ade80"></span>
      <span style="height: 30px; border-radius: 8px; background: #4ade80"></span>
      <span style="height: 30px; border-radius: 8px; border: 2px solid #e4ff52; box-sizing: border-box"></span>
      <span style="height: 30px; border-radius: 8px; background: rgba(255,255,255,0.08)"></span>
      <span style="height: 30px; border-radius: 8px; background: rgba(255,255,255,0.08)"></span>
      <span style="height: 30px; border-radius: 8px; background: rgba(255,255,255,0.08)"></span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; font-size: 10.5px; color: #a8b6d6; text-align: center"><span>DB</span><span>MC</span><span>DB</span><span>MC</span><span>DB</span><span>MC</span></div>
  </div>

  <div style="flex: 1"></div>

  <div style="padding: 12px 16px 18px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr) 64px; gap: 8px">
      <button type="button" aria-label="Previous interval" style="appearance: none; font: inherit; min-height: 60px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #ffffff; font-size: 18px; font-weight: 700">«</button>
      <button type="button" style="appearance: none; font: inherit; min-height: 60px; border-radius: 14px; border: 0; background: #ffffff; color: #0b1530; font-size: 18px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>Pause</button>
      <button type="button" aria-label="Skip to next interval" style="appearance: none; font: inherit; min-height: 60px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #ffffff; font-size: 18px; font-weight: 700">»</button>
    </div>
    <span style="font-size: 11.5px; color: #a8b6d6; text-align: center">Work screen is lime, rest is blue, so you can read it from the mat</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
