<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gym mode · logging an exercise</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#e4ff52}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0b1530; font-family: 'Inter Tight', system-ui, sans-serif; color: #ffffff; letter-spacing: -0.01em; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 14px 14px 8px; display: flex; align-items: center; gap: 10px">
    <a href="GymOverview.dc.html" aria-label="Session overview" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); display: inline-flex; align-items: center; justify-content: center; color: #ffffff; text-decoration: none; font-size: 20px">‹</a>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 5px">
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #a8b6d6"><span>Exercise 2 of 5</span><span style="font-family: 'JetBrains Mono', monospace; color: #ffffff; font-weight: 700">12:40</span></div>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px"><span style="height: 4px; border-radius: 999px; background: #e4ff52"></span><span style="height: 4px; border-radius: 999px; background: #e4ff52; opacity: 0.55"></span><span style="height: 4px; border-radius: 999px; background: rgba(255,255,255,0.15)"></span><span style="height: 4px; border-radius: 999px; background: rgba(255,255,255,0.15)"></span><span style="height: 4px; border-radius: 999px; background: rgba(255,255,255,0.15)"></span></div>
    </div>
  </div>

  <div style="padding: 6px 16px 12px; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Single-leg deadlift</span>
    <span style="font-size: 13px; color: #c9d5ef">3 × 8 /side · one dumbbell · strength anchor</span>
  </div>

  <div style="margin: 0 14px 10px; background: rgba(228,255,82,0.12); border: 1px solid rgba(228,255,82,0.35); border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 10px">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; color: #e4ff52">1:15</span>
    <span style="font-size: 13px; color: #e3ecff; flex: 1">Rest before set 2</span>
    <button type="button" style="appearance: none; font: inherit; font-size: 13px; font-weight: 700; color: #e4ff52; background: transparent; border: 0; min-height: 40px">Skip</button>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 0 14px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: grid; grid-template-columns: 34px minmax(0, 1fr) 44px; gap: 10px; align-items: center; background: rgba(74,222,128,0.12); border-radius: 12px; padding: 10px 12px">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #a8b6d6">Set 1</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700">12 kg × 8</span>
      <span aria-label="Done" style="width: 36px; height: 36px; border-radius: 10px; background: #4ade80; color: #0b1530; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
    </div>

    <div style="background: #ffffff; color: #0b1530; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #56627f">Set 2 · now</span>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 6px; align-items: center"><span style="font-size: 12px; font-weight: 700; color: #56627f">kg</span><div style="display: flex; align-items: center; gap: 6px"><button type="button" aria-label="Less weight" style="appearance: none; width: 48px; height: 48px; border-radius: 12px; border: 1px solid #c9d2e3; background: #ffffff; font: inherit; font-size: 22px; font-weight: 700; color: #0b1530">−</button><span style="font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; min-width: 48px; text-align: center">12</span><button type="button" aria-label="More weight" style="appearance: none; width: 48px; height: 48px; border-radius: 12px; border: 1px solid #c9d2e3; background: #ffffff; font: inherit; font-size: 22px; font-weight: 700; color: #0b1530">+</button></div><span style="font-size: 11px; color: #8792a8">step 2 kg</span></div>
        <div style="display: flex; flex-direction: column; gap: 6px; align-items: center"><span style="font-size: 12px; font-weight: 700; color: #56627f">reps</span><div style="display: flex; align-items: center; gap: 6px"><button type="button" aria-label="Fewer reps" style="appearance: none; width: 48px; height: 48px; border-radius: 12px; border: 1px solid #c9d2e3; background: #ffffff; font: inherit; font-size: 22px; font-weight: 700; color: #0b1530">−</button><span style="font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; min-width: 40px; text-align: center">8</span><button type="button" aria-label="More reps" style="appearance: none; width: 48px; height: 48px; border-radius: 12px; border: 1px solid #c9d2e3; background: #ffffff; font: inherit; font-size: 22px; font-weight: 700; color: #0b1530">+</button></div><span style="font-size: 11px; color: #8792a8">/side</span></div>
      </div>
      <button type="button" style="appearance: none; font: inherit; font-size: 16px; font-weight: 800; border: 0; border-radius: 12px; min-height: 52px; background: #0b1530; color: #ffffff">Done set 2</button>
    </div>

    <div style="display: grid; grid-template-columns: 34px minmax(0, 1fr) 44px; gap: 10px; align-items: center; background: rgba(255,255,255,0.06); border-radius: 12px; padding: 10px 12px; color: #a8b6d6">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px">Set 3</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 16px">12 kg × 8</span>
      <span></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 4px">
      <span style="font-size: 12px; font-weight: 700; color: #a8b6d6" id="rpe">How hard was this exercise? (RPE)</span>
      <div role="radiogroup" aria-labelledby="rpe" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
        <button type="button" role="radio" aria-checked="false" style="appearance: none; font: inherit; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; min-height: 44px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.18); background: transparent; color: #ffffff">6</button>
        <button type="button" role="radio" aria-checked="true" style="appearance: none; font: inherit; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; min-height: 44px; border-radius: 10px; border: 0; background: #e4ff52; color: #0b1530">7</button>
        <button type="button" role="radio" aria-checked="false" style="appearance: none; font: inherit; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; min-height: 44px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.18); background: transparent; color: #ffffff">8</button>
        <button type="button" role="radio" aria-checked="false" style="appearance: none; font: inherit; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; min-height: 44px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.18); background: transparent; color: #ffffff">9</button>
        <button type="button" role="radio" aria-checked="false" style="appearance: none; font: inherit; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; min-height: 44px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.18); background: transparent; color: #ffffff">10</button>
      </div>
    </div>
  </div>

  <div style="padding: 10px 14px 18px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <a href="GymSwap.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 10px; background: rgba(255,255,255,0.08); color: #ffffff; text-decoration: none; font-size: 13px; font-weight: 700">Swap</a>
      <button type="button" style="appearance: none; font: inherit; min-height: 44px; border-radius: 10px; background: rgba(255,255,255,0.08); color: #ffffff; border: 0; font-size: 13px; font-weight: 700">+ Set</button>
      <button type="button" style="appearance: none; font: inherit; min-height: 44px; border-radius: 10px; background: rgba(255,255,255,0.08); color: #ffffff; border: 0; font-size: 13px; font-weight: 700">Skip</button>
      <button type="button" style="appearance: none; font: inherit; min-height: 44px; border-radius: 10px; background: rgba(255,255,255,0.08); color: #ffffff; border: 0; font-size: 13px; font-weight: 700">Note</button>
    </div>
    <a href="GymFinish.dc.html" style="display: flex; align-items: center; justify-content: space-between; padding: 0 16px; min-height: 52px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.22); color: #ffffff; text-decoration: none; font-size: 14px; font-weight: 700"><span style="color: #a8b6d6; font-weight: 600">Next</span><span>Calf raise · 4 × 12 · 20 kg ›</span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
