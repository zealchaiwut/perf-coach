<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gym mode · swap and reorder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1f3b8a}a:hover{color:#0b1530}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0b1530; font-family: 'Inter Tight', system-ui, sans-serif; color: #0b1530; letter-spacing: -0.01em; position: relative; overflow: hidden">

  <div style="padding: 70px 16px 0; color: #ffffff; opacity: 0.35; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 24px; font-weight: 800">Bulgarian split squat</span>
    <div style="height: 54px; border-radius: 12px; background: rgba(255,255,255,0.1)"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(5,10,26,0.55)"></div>

  <div role="dialog" aria-labelledby="sw" style="position: absolute; left: 0; right: 0; bottom: 0; top: 120px; background: #ffffff; border-radius: 20px 20px 0 0; padding: 10px 16px 18px; display: flex; flex-direction: column; gap: 14px">
    <span style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #dfe5f1"></span>
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: #5f6b84">EXERCISE 4 · LEGS, SINGLE-SIDE</span><span id="sw" style="font-size: 19px; font-weight: 700">Swap Bulgarian split squat</span></div>
      <a href="GymExercise.dc.html" aria-label="Close" style="width: 40px; height: 40px; border-radius: 10px; border: 1px solid #dfe5f1; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: #56627f">✕</a>
    </div>

    <label for="swq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search exercises</label>
    <input id="swq" placeholder="Search the library (works offline)" style="border: 1px solid #c9d2e3; border-radius: 12px; padding: 12px; font: inherit; font-size: 15px; min-height: 46px; box-sizing: border-box; width: 100%">

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; color: #56627f">Same muscles</span>
      <button type="button" style="appearance: none; font: inherit; text-align: left; border: 2px solid #1f3b8a; background: #f6f9ff; border-radius: 12px; padding: 11px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 56px"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Step-up</span><span style="font-size: 12px; color: #56627f">You picked this the last 2 times</span></span><span style="font-size: 10px; font-weight: 800; letter-spacing: 0.06em; background: #dff5d6; color: #2d5e10; padding: 3px 7px; border-radius: 999px">USUAL</span></button>
      <button type="button" style="appearance: none; font: inherit; text-align: left; border: 1px solid #dfe5f1; background: #ffffff; border-radius: 12px; padding: 11px 12px; display: flex; flex-direction: column; gap: 2px; min-height: 56px"><span style="font-size: 15px; font-weight: 700">Reverse lunge</span><span style="font-size: 12px; color: #56627f">Dumbbells · same set scheme</span></button>
      <button type="button" style="appearance: none; font: inherit; text-align: left; border: 1px solid #dfe5f1; background: #ffffff; border-radius: 12px; padding: 11px 12px; display: flex; flex-direction: column; gap: 2px; min-height: 56px"><span style="font-size: 15px; font-weight: 700">Split squat</span><span style="font-size: 12px; color: #56627f">No bench needed</span></button>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #f7f9fd; border-radius: 12px; padding: 10px 12px">
      <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 13.5px; font-weight: 700">Keep 3 × 8 /side · 10 kg</span><span style="font-size: 12px; color: #56627f">Off to start from step-up's last numbers</span></span>
      <button type="button" role="switch" aria-checked="true" aria-label="Keep the set scheme" style="appearance: none; width: 48px; height: 28px; border-radius: 999px; border: 0; background: #1f3b8a; position: relative"><span style="position: absolute; right: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #ffffff"></span></button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #eef1f7; padding-top: 12px">
      <span style="font-size: 12px; font-weight: 700; color: #56627f">Order · hold and drag</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <span style="font-size: 12.5px; font-weight: 600; background: #eef2fb; color: #56627f; padding: 6px 10px; border-radius: 9px; text-decoration: line-through">1 Pogo hops</span>
        <span style="font-size: 12.5px; font-weight: 600; background: #eef2fb; color: #56627f; padding: 6px 10px; border-radius: 9px">2 SL deadlift</span>
        <span style="font-size: 12.5px; font-weight: 600; background: #eef2fb; padding: 6px 10px; border-radius: 9px">3 Calf raise</span>
        <span style="font-size: 12.5px; font-weight: 700; background: #0b1530; color: #ffffff; padding: 6px 10px; border-radius: 9px">⋮⋮ 4 Step-up</span>
        <span style="font-size: 12.5px; font-weight: 600; background: #eef2fb; padding: 6px 10px; border-radius: 9px">5 Dead bug</span>
      </div>
    </div>

    <a href="GymExercise.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; background: #0b1530; color: #ffffff; text-decoration: none; font-size: 16px; font-weight: 800; border-radius: 12px; min-height: 52px">Swap to step-up</a>
  </div>
</div>
</x-dc>

</body>
</html>
