<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a race · modal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1f3b8a}a:hover{color:#0b1530}
.lbl{font-size:12px;font-weight:700;letter-spacing:0.1em;color:#5f6b84;text-transform:uppercase}
.sub{font-size:13px;color:#56627f;line-height:1.5}
.mono{font-family:'JetBrains Mono',monospace;letter-spacing:-0.04em}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.fl{font-size:13px;font-weight:700;color:#33405e}
.fl span{font-weight:500;color:#8792a8}
.in{border:1px solid #c9d2e3;border-radius:10px;padding:11px 12px;font:inherit;font-size:14.5px;color:#0b1530;background:#ffffff;width:100%;box-sizing:border-box;min-height:44px}
.in:focus{outline:2px solid #1f3b8a;outline-offset:1px;border-color:#1f3b8a}
.inm{font-family:'JetBrains Mono',monospace;letter-spacing:-0.04em}
.seg{display:flex;background:#eef2fb;border-radius:10px;padding:3px;gap:2px}
.seg button{appearance:none;flex:1;font:inherit;font-size:13.5px;font-weight:700;color:#3c4a6b;background:transparent;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;min-height:38px}
.seg button.on{background:#0b1530;color:#ffffff}
.chipb{appearance:none;font:inherit;font-size:12.5px;font-weight:700;color:#1f3b8a;background:#eef3fd;border:1px solid #d6e1f8;border-radius:999px;padding:6px 11px;cursor:pointer}
.chipb.on{background:#1f3b8a;color:#ffffff;border-color:#1f3b8a}
.role{appearance:none;font:inherit;text-align:left;cursor:pointer;border:1px solid #dfe5f1;background:#ffffff;border-radius:11px;padding:11px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.role.on{border:2px solid #1f3b8a;background:#f6f9ff;padding:10px 11px}
.rt{font-size:14px;font-weight:700;color:#0b1530;display:flex;justify-content:space-between;align-items:center;gap:8px}
.rd{font-size:12px;color:#56627f;line-height:1.4}
.tag{font-size:10px;font-weight:800;letter-spacing:0.06em;padding:2px 7px;border-radius:999px;white-space:nowrap}
.btn{appearance:none;font:inherit;font-size:14px;font-weight:700;border-radius:10px;min-height:44px;cursor:pointer;padding:11px 18px}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; padding: 32px 48px 56px; background: radial-gradient(ellipse at top left, #5a8dee 0%, #1f3b8a 70%); font-family: 'Inter Tight', system-ui, sans-serif; color: #0b1530; letter-spacing: -0.01em; position: relative">

  <div style="max-width: 1344px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; opacity: 0.35">
    <div style="display: flex; justify-content: space-between; align-items: center; color: #ffffff">
      <span style="font-size: 34px; font-weight: 700; letter-spacing: -0.025em">Performance</span>
      <span style="background: rgba(11,21,48,0.3); border-radius: 13px; padding: 14px 120px"></span>
    </div>
    <div style="background: #ffffff; border-radius: 14px; height: 120px"></div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px"><div style="background: #ffffff; border-radius: 14px; height: 520px"></div><div style="background: #ffffff; border-radius: 14px; height: 520px"></div></div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(11,21,48,0.55); display: flex; align-items: flex-start; justify-content: center; padding-top: 72px">
    <div role="dialog" aria-modal="true" aria-labelledby="arTitle" style="width: 620px; max-width: calc(100% - 32px); background: #ffffff; border-radius: 16px; box-shadow: 0 24px 60px rgba(11,21,48,0.45); display: flex; flex-direction: column">

      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 22px 24px 0">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span class="lbl">Races</span>
          <h2 id="arTitle" style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em">Add a race</h2>
        </div>
        <button type="button" aria-label="Close" style="appearance: none; width: 40px; height: 40px; border-radius: 10px; border: 1px solid #dfe5f1; background: #ffffff; color: #56627f; font-size: 18px; cursor: pointer">✕</button>
      </div>

      <div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 18px">
        <div class="f">
          <label class="fl" for="arName">Race name</label>
          <input id="arName" class="in" value="Bangsaen21">
        </div>

        <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px">
          <div class="f">
            <label class="fl" for="arDate">Date</label>
            <input id="arDate" class="in inm" value="20 Dec 2026">
          </div>
          <div class="f">
            <label class="fl" for="arDist">Distance <span>km</span></label>
            <input id="arDist" class="in inm" value="21.0975">
          </div>
        </div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: -10px; justify-content: flex-end">
          <button type="button" class="chipb">5K</button>
          <button type="button" class="chipb">10K</button>
          <button type="button" class="chipb on">Half</button>
          <button type="button" class="chipb">Marathon</button>
        </div>

        <div class="f">
          <label class="fl" for="arGoal">Goal time <span>optional · h:mm:ss</span></label>
          <div style="display: flex; align-items: center; gap: 12px">
            <input id="arGoal" class="in inm" value="1:50:00" style="width: 180px">
            <span class="mono sub" style="font-size: 13.5px">= <b style="color: #0b1530">5:13 /km</b></span>
          </div>
        </div>

        <div class="f">
          <span class="fl" id="arPri">Priority</span>
          <div class="seg" role="radiogroup" aria-labelledby="arPri">
            <button type="button" role="radio" aria-checked="false">A · the goal race</button>
            <button type="button" role="radio" aria-checked="true" class="on">B · tune-up</button>
            <button type="button" role="radio" aria-checked="false">C · training</button>
          </div>
        </div>

        <div class="f">
          <span class="fl" id="arRole">How it is run</span>
          <div role="radiogroup" aria-labelledby="arRole" style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px">
            <button type="button" role="radio" aria-checked="false" class="role"><span class="rt">A race <span class="tag" style="background: #dff5d6; color: #2d5e10">RECALIBRATES</span></span><span class="rd">Run for the goal time. The result re-anchors Endurance, Speed and the projection.</span></button>
            <button type="button" role="radio" aria-checked="true" class="role on"><span class="rt">PB attempt <span class="tag" style="background: #dff5d6; color: #2d5e10">RECALIBRATES</span></span><span class="rd">All out for a personal best. Also recalibrates.</span></button>
            <button type="button" role="radio" aria-checked="false" class="role"><span class="rt">Long run <span class="tag" style="background: #eef1f7; color: #56627f">NO RECALIBRATE</span></span><span class="rd">Run it as a supported long run.</span></button>
            <button type="button" role="radio" aria-checked="false" class="role"><span class="rt">Fun run <span class="tag" style="background: #eef1f7; color: #56627f">NO RECALIBRATE</span></span><span class="rd">Just for the day; logged, not scored.</span></button>
          </div>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 24px; border-top: 1px solid #eef1f7; background: #fafbfe; border-radius: 0 0 16px 16px">
        <span class="sub" style="font-size: 12.5px">B race · PB attempt · recalibrates the projection</span>
        <div style="display: flex; gap: 8px">
          <button type="button" class="btn" style="background: #ffffff; color: #0b1530; border: 1px solid #c9d2e3">Cancel</button>
          <button type="button" class="btn" style="background: #0b1530; color: #ffffff; border: 1px solid #0b1530">Add race</button>
        </div>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
