---
# render.yaml — Render Blueprint for perf-coach
# yamllint: autoDeploy uses yes/no (not true/false) — required by Render's API.
#
# Python version is pinned via the repo-root `.python-version` file (Render
# reads it). The service schema has no `pythonVersion` field — setting one makes
# the blueprint fail with "field pythonVersion not found in type file.service".
#
# The DB connection string is intentionally absent from this file and must be
# set manually in the Render dashboard for each service after the blueprint is
# applied. The app (backend/db.py) and Alembic select the var by ENVIRONMENT,
# so each service needs the matching name:
#
#   perf-coach-uat → DATABASE_URL_UAT = Neon "uat" branch connection string
#   perf-coach-prd → DATABASE_URL_PRD = Neon "main" (PRD) branch connection string
#
# The following secrets must also be set manually in the Render dashboard under
# Environment → Env Vars (they appear with sync: false below, meaning Render
# creates the slot but leaves the value empty until a human fills it in):
#
#   SESSION_SECRET           — random string; signs session cookies (all services)
#   ADMIN_SECRET_UAT         — UAT admin gate passphrase (perf-coach-uat only)
#   ADMIN_SECRET_PRD         — PRD admin gate passphrase (perf-coach-prd only)
#
#   Strava OAuth (all services — required for /api/strava/connect):
#   STRAVA_CLIENT_ID         — from https://www.strava.com/settings/api
#   STRAVA_CLIENT_SECRET     — from https://www.strava.com/settings/api
#   STRAVA_STATE_SECRET      — random string; signs CSRF state tokens
#   STRAVA_REDIRECT_URI      — full callback URL, e.g. https://<service>.onrender.com/api/strava/callback
#
#   Stryd credential encryption (all services — required for /api/stryd/connect):
#   STRYD_FERNET_KEY         — generate: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
#
#   OAuth token encryption (all services — required for /api/strava/* and /api/google/*):
#   OAUTH_FERNET_KEY         — generate: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
#                              separate from STRYD_FERNET_KEY so each can rotate independently
#                              NOTE: declaring this var here does NOT set the value (sync: false);
#                              the actual key must be set manually in the Render dashboard for
#                              each service before deploying — the alembic upgrade head
#                              preDeployCommand will hard-fail if OAUTH_FERNET_KEY is unset.
#
#   Google OAuth (all services — required for /api/google/connect):
#   GOOGLE_CLIENT_ID         — from https://console.cloud.google.com/apis/credentials
#   GOOGLE_CLIENT_SECRET     — from https://console.cloud.google.com/apis/credentials
#   GOOGLE_STATE_SECRET      — random string; signs CSRF state tokens
#
#   Google Drive sleep import (all services — required for Health Sync to run):
#   HEALTH_SYNC_DRIVE_FOLDER_ID — last path segment of the Drive folder URL
#
# GOOGLE_LOGIN_ENABLED is not a secret and is set inline below.
#
# NEVER commit a connection-string or secret value to this file or any tracked file.

services:
  - type: web
    name: perf-coach-uat
    runtime: python
    region: singapore
    plan: starter
    branch: develop
    autoDeploy: yes  # yamllint: truthy — Render requires yes/no, not true/false
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    preDeployCommand: alembic upgrade head
    healthCheckPath: /api/healthz
    envVars:
      - key: ENVIRONMENT
        value: uat
      # Container timezone. perf-coach is a single-timezone app: the athlete
      # lives in Asia/Bangkok and every "today" — weigh-in, fuel budget, the
      # guardrail's week boundary — means a Bangkok calendar day. Without this
      # the container runs UTC, so bare date.today() returns YESTERDAY for the
      # first 7 hours of every local day (issue #1600).
      - key: TZ
        value: Asia/Bangkok
      # No GIT_SHA here: Render injects RENDER_GIT_COMMIT into every service
      # automatically, and backend.main._git_sha falls back to it. Setting
      # GIT_SHA: ${{RENDER_GIT_COMMIT}} does NOT work — that is GitHub Actions
      # syntax, and Render passed the literal string through as the version.
      - key: DATABASE_URL_UAT
        sync: false  # set via Render dashboard — see top of file
      - key: SESSION_SECRET
        sync: false  # set via Render dashboard — see top of file
      - key: ADMIN_SECRET_UAT
        sync: false  # set via Render dashboard — see top of file
      - key: STRAVA_CLIENT_ID
        sync: false  # set via Render dashboard — see top of file
      - key: STRAVA_CLIENT_SECRET
        sync: false  # set via Render dashboard — see top of file
      - key: STRAVA_STATE_SECRET
        sync: false  # set via Render dashboard — see top of file
      - key: STRAVA_REDIRECT_URI
        sync: false  # set via Render dashboard — full callback URL for this service
      - key: STRYD_FERNET_KEY
        sync: false  # set via Render dashboard — see top of file
      - key: OAUTH_FERNET_KEY
        sync: false  # set via Render dashboard — see top of file; required before alembic upgrade
      - key: GOOGLE_CLIENT_ID
        sync: false  # set via Render dashboard — see top of file
      - key: GOOGLE_CLIENT_SECRET
        sync: false  # set via Render dashboard — see top of file
      - key: GOOGLE_STATE_SECRET
        sync: false  # set via Render dashboard — see top of file
      - key: HEALTH_SYNC_DRIVE_FOLDER_ID
        sync: false  # set via Render dashboard — Drive folder ID for Health Sync sleep import
      - key: BANISTER_REFIT_ENABLED
        value: "0"  # refit runs on compute worker (zeal-server); disable on web dyno to save RAM
      - key: COACH_EXPORT_VIA_QUEUE
        value: "1"  # build paste/consult blobs on worker; web enqueues + polls
      - key: WEB_INCREMENTAL_SYNC_ENABLED
        value: "1"  # Sync new runs in-process so it still works if the worker is off
      - key: GOOGLE_LOGIN_ENABLED
        value: "false"  # toggle in Render dashboard to enable Google login
      - key: LLM_COACH_ENABLED
        value: "false"  # set to "true" in Render dashboard when GROQ_API_KEY is provided
      - key: GROQ_API_KEY
        sync: false  # set via Render dashboard — see docs/llm-coaching.md

  - type: web
    name: perf-coach-prd
    runtime: python
    region: singapore
    plan: starter
    branch: master
    autoDeploy: no  # yamllint: truthy — Render requires yes/no, not true/false
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    preDeployCommand: alembic upgrade head
    healthCheckPath: /api/healthz
    envVars:
      - key: ENVIRONMENT
        value: prd
      # Container timezone. perf-coach is a single-timezone app: the athlete
      # lives in Asia/Bangkok and every "today" — weigh-in, fuel budget, the
      # guardrail's week boundary — means a Bangkok calendar day. Without this
      # the container runs UTC, so bare date.today() returns YESTERDAY for the
      # first 7 hours of every local day (issue #1600).
      - key: TZ
        value: Asia/Bangkok
      # No GIT_SHA here — see the perf-coach-uat service above.
      - key: DATABASE_URL_PRD
        sync: false  # set via Render dashboard — see top of file
      - key: SESSION_SECRET
        sync: false  # set via Render dashboard — see top of file
      - key: ADMIN_SECRET_PRD
        sync: false  # set via Render dashboard — see top of file
      - key: STRAVA_CLIENT_ID
        sync: false  # set via Render dashboard — see top of file
      - key: STRAVA_CLIENT_SECRET
        sync: false  # set via Render dashboard — see top of file
      - key: STRAVA_STATE_SECRET
        sync: false  # set via Render dashboard — see top of file
      - key: STRAVA_REDIRECT_URI
        sync: false  # set via Render dashboard — full callback URL for this service
      - key: STRYD_FERNET_KEY
        sync: false  # set via Render dashboard — see top of file
      - key: OAUTH_FERNET_KEY
        sync: false  # set via Render dashboard — see top of file; required before alembic upgrade
      - key: GOOGLE_CLIENT_ID
        sync: false  # set via Render dashboard — see top of file
      - key: GOOGLE_CLIENT_SECRET
        sync: false  # set via Render dashboard — see top of file
      - key: GOOGLE_STATE_SECRET
        sync: false  # set via Render dashboard — see top of file
      - key: HEALTH_SYNC_DRIVE_FOLDER_ID
        sync: false  # set via Render dashboard — Drive folder ID for Health Sync sleep import
      - key: BANISTER_REFIT_ENABLED
        value: "0"  # refit runs on zeal-server worker; web dyno stays thin
      - key: COACH_EXPORT_VIA_QUEUE
        value: "1"
      - key: WEB_INCREMENTAL_SYNC_ENABLED
        value: "1"  # Sync new runs in-process so it still works if the worker is off
      - key: GOOGLE_LOGIN_ENABLED
        value: "false"  # toggle in Render dashboard to enable Google login
      - key: LLM_COACH_ENABLED
        value: "false"  # set to "true" in Render dashboard when GROQ_API_KEY is provided
      - key: GROQ_API_KEY
        sync: false  # set via Render dashboard — see docs/llm-coaching.md
