<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habits – perf-coach</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .habit-form {
      display: flex;
      gap: 0.5rem;
      max-width: 480px;
      margin-bottom: 0.5rem;
    }

    .habit-form input[type="text"] {
      flex: 1;
      padding: 0.5rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }

    .habit-form input[type="text"]:focus {
      outline: none;
      border-color: #0070f3;
      box-shadow: 0 0 0 2px rgba(0,112,243,0.15);
    }

    .habit-form button {
      padding: 0.5rem 1.25rem;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.9375rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .habit-form button:hover {
      background: #333;
    }

    .error-msg {
      font-size: 0.8125rem;
      color: #c0392b;
      min-height: 1.2em;
      margin-bottom: 1rem;
    }

    #habit-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-width: 480px;
    }

    .habit-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0;
      border-bottom: 1px solid #e5e5e5;
    }

    .habit-row input[type="checkbox"] {
      width: 1.1rem;
      height: 1.1rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .habit-name {
      flex: 1;
      font-size: 0.9375rem;
    }

    .habit-done .habit-name {
      text-decoration: line-through;
      color: #aaa;
    }

    .habit-delete {
      padding: 0.25rem 0.65rem;
      background: transparent;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.8125rem;
      cursor: pointer;
      color: #666;
    }

    .habit-delete:hover {
      background: #fee2e2;
      border-color: #f87171;
      color: #b91c1c;
    }

    .habit-empty {
      color: #888;
      font-size: 0.9375rem;
      padding: 0.65rem 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Habits</h1>
    <span id="env-label" class="env-label"></span>
  </header>
  <main>
    <form id="habit-form" class="habit-form" novalidate>
      <input id="habit-input" type="text" placeholder="New habit…" autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <p id="habit-error" class="error-msg" role="alert"></p>

    <ul id="habit-list"></ul>

    <p style="margin-top:2rem"><a href="index.html">Back</a></p>
  </main>
  <script src="js/habits.js"></script>
  <script src="js/env.js"></script>
</body>
</html>
