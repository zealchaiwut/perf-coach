<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habits – perf-coach</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .habits-toolbar {
      display: flex;
      align-items: center;
      gap: 1rem;
      max-width: 480px;
      margin-bottom: 0.75rem;
    }

    .add-habit-btn {
      padding: 0.5rem 1.25rem;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.9375rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .add-habit-btn:hover {
      background: #333;
    }

    .error-msg {
      font-size: 0.8125rem;
      color: #c0392b;
      min-height: 1.2em;
      margin-bottom: 1rem;
    }

    #habit-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-width: 680px;
    }

    .habit-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0;
      border-bottom: 1px solid #e5e5e5;
    }

    .habit-row input[type="checkbox"] {
      width: 1.1rem;
      height: 1.1rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .habit-name {
      flex: 1;
      font-size: 0.9375rem;
    }

    .habit-done .habit-name {
      text-decoration: line-through;
      color: #aaa;
    }

    .habit-delete {
      padding: 0.25rem 0.65rem;
      background: transparent;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.8125rem;
      cursor: pointer;
      color: #666;
    }

    .habit-delete:hover {
      background: #fee2e2;
      border-color: #f87171;
      color: #b91c1c;
    }

    .habit-empty {
      color: #888;
      font-size: 0.9375rem;
      padding: 0.65rem 0;
    }

    .habit-streak {
      font-size: 0.875rem;
      min-width: 4rem;
      text-align: right;
      white-space: nowrap;
    }

    .streak-zero,
    .streak-none {
      color: #aaa;
    }

    .streak-loading {
      color: #ccc;
      font-size: 0.75rem;
    }

    .habit-rate {
      font-size: 0.8125rem;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      white-space: nowrap;
      min-width: 5.5rem;
      text-align: center;
    }

    .rate-green {
      background: #dcfce7;
      color: #166534;
    }

    .rate-yellow {
      background: #fef9c3;
      color: #854d0e;
    }

    .rate-grey {
      background: #f3f4f6;
      color: #6b7280;
    }

    .rate-loading {
      color: #ccc;
      font-size: 0.75rem;
    }

    .link-btn {
      background: none;
      border: none;
      color: #0070f3;
      cursor: pointer;
      font-size: inherit;
      padding: 0;
      text-decoration: underline;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-box {
      background: #fff;
      border-radius: 8px;
      padding: 1.5rem;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0 0 1rem;
    }

    .modal-form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .modal-form input[type="text"] {
      padding: 0.5rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }

    .modal-form input[type="text"]:focus {
      outline: none;
      border-color: #0070f3;
      box-shadow: 0 0 0 2px rgba(0, 112, 243, 0.15);
    }

    .modal-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
    }

    .modal-actions button[type="submit"] {
      padding: 0.5rem 1.25rem;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.9375rem;
      cursor: pointer;
    }

    .modal-actions button[type="submit"]:hover {
      background: #333;
    }

    .modal-actions button[type="button"] {
      padding: 0.5rem 1.25rem;
      background: transparent;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9375rem;
      cursor: pointer;
      color: #444;
    }

    .modal-actions button[type="button"]:hover {
      background: #f5f5f5;
    }
  </style>
</head>
<body>
  <header>
    <h1>perf-coach</h1>
    <span id="env-label" class="env-label"></span>
  </header>
  <nav class="main-nav">
    <a href="home.html">Home</a>
    <a href="calendar.html">Calendar</a>
    <a href="weight.html">Weight</a>
    <a href="habits.html" class="active">Habits</a>
    <a href="training.html">Training</a>
  </nav>
  <main>
    <div class="habits-toolbar">
      <button id="add-habit-btn" type="button" class="add-habit-btn">+ Add habit</button>
    </div>
    <p id="api-error" class="error-msg" role="alert"></p>

    <ul id="habit-list"></ul>

    <p style="margin-top:2rem"><a href="users.html">Manage users</a></p>
  </main>

  <div id="habit-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <h2 id="modal-title" class="modal-title">New habit</h2>
      <form id="modal-form" class="modal-form" novalidate>
        <input
          id="modal-habit-name"
          type="text"
          placeholder="Habit name…"
          autocomplete="off"
          maxlength="100"
        >
        <p id="modal-error" class="error-msg" role="alert"></p>
        <div class="modal-actions">
          <button type="button" id="modal-cancel">Cancel</button>
          <button type="submit">Add</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/habits.js"></script>
  <script src="js/user.js"></script>
  <script src="js/env.js"></script>
</body>
</html>
