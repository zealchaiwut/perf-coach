name: Migrations check — single head, no duplicate revisions, valid revision ids

# Offline Alembic sanity gate. Blocks any PR whose migration graph has
# duplicate revision ids or more than one head — the failures that have
# repeatedly broken `alembic upgrade head` on deploy. No database needed.
#
# Also runs the revision-id format lint (scripts/check_migration_ids.py) to
# reject new migration files whose revision id is not Alembic-generated random
# hex (see CLAUDE.md and GitHub issue #1706).

on:
  pull_request:
    paths:
      - "alembic/**"
      - "scripts/check_migrations.py"
      - "scripts/check_migration_ids.py"
      - ".github/workflows/migrations-check.yml"

jobs:
  check-migrations:
    name: Alembic single-head / no-duplicate-revisions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check migration graph
        run: python3 scripts/check_migrations.py

      - name: Check revision id format
        run: python3 scripts/check_migration_ids.py
