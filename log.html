<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training Log – perf-coach</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    main { max-width: 900px; }

    /* ── Header override ── */
    header { align-items: flex-start; }

    /* ── Header ── */
    .log-header-left { display: flex; flex-direction: column; gap: 0.1rem; }
    .log-header-left h1 { margin: 0; font-size: 1.25rem; font-weight: 700; }
    .log-sync-sub { margin: 0; font-size: 0.8125rem; color: #888; }
    .log-header-right { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }

    /* ── Week strip ── */
    .week-strip-section {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
    }

    .week-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 0.625rem;
    }

    .week-nav-btn {
      width: 2rem;
      height: 2rem;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1.125rem;
      line-height: 1;
      color: #555;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .week-nav-btn:hover { background: #f5f5f5; border-color: #bbb; }

    .week-label {
      font-size: 0.9375rem;
      font-weight: 600;
      color: #1a1a1a;
      min-width: 150px;
      text-align: center;
    }

    .week-pills {
      display: flex;
      gap: 0.375rem;
      overflow-x: auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }

    .week-pills::-webkit-scrollbar { height: 3px; }
    .week-pills::-webkit-scrollbar-thumb { background: #e5e5e5; border-radius: 3px; }

    .day-pill {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
      padding: 0.4rem 0.5rem;
      background: #fafafa;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      cursor: pointer;
      flex: 1;
      min-width: 42px;
      transition: background 0.1s, border-color 0.1s;
    }

    .day-pill:hover { background: #f0f0f0; border-color: #ccc; }

    .day-pill.is-today {
      background: #1a1a1a;
      border-color: #1a1a1a;
    }

    .day-pill.is-today .day-pill-letter,
    .day-pill.is-today .day-pill-num { color: #fff; }

    .day-pill-letter {
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      color: #888;
      letter-spacing: 0.03em;
    }

    .day-pill-num {
      font-size: 0.9375rem;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1;
    }

    .day-pill-dots {
      display: flex;
      gap: 2px;
      min-height: 8px;
      align-items: center;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot--run  { background: #3b82f6; }
    .dot--lift { background: #8b5cf6; }
    .dot--wod  { background: #f97316; }
    .dot--bike { background: #14b8a6; }

    /* ── Filter bar ── */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }

    .filter-search-wrap { flex: 1; min-width: 180px; }

    .filter-search {
      width: 100%;
      padding: 0.45rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.9375rem;
      background: #fff;
    }

    .filter-search:focus {
      outline: none;
      border-color: #0070f3;
      box-shadow: 0 0 0 2px rgba(0,112,243,0.15);
    }

    .filter-chips { display: flex; gap: 0.375rem; flex-wrap: wrap; }

    .filter-chip {
      padding: 0.3rem 0.75rem;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 999px;
      font-size: 0.875rem;
      cursor: pointer;
      color: #555;
      font-weight: 500;
      white-space: nowrap;
    }

    .filter-chip:hover { border-color: #bbb; color: #1a1a1a; }

    .filter-chip.active {
      background: #1a1a1a;
      border-color: #1a1a1a;
      color: #fff;
    }

    /* Date range chip and dropdown */
    .date-range-wrap { position: relative; }

    .date-range-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      padding: 0.75rem;
      min-width: 210px;
      z-index: 100;
    }

    .dr-options { display: flex; flex-direction: column; gap: 0.05rem; }

    .dr-option {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.875rem;
      color: #333;
    }

    .dr-option:hover { background: #f5f5f5; }
    .dr-option input[type="radio"] { cursor: pointer; accent-color: #1a1a1a; }

    .dr-custom {
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid #f0f0f0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .dr-custom-row {
      display: flex;
      gap: 0.5rem;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .dr-custom-row label {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      font-size: 0.8125rem;
      color: #555;
      font-weight: 500;
    }

    .dr-custom-row input[type="date"] {
      padding: 0.3rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.8125rem;
      background: #fff;
    }

    /* ── Week group ── */
    .week-group { margin-bottom: 1.75rem; }

    .week-group-header {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      flex-wrap: wrap;
      padding: 0.4rem 0;
      margin-bottom: 0.625rem;
      border-bottom: 2px solid #1a1a1a;
    }

    .week-group-title {
      font-size: 0.9375rem;
      font-weight: 700;
      color: #1a1a1a;
    }

    .week-summary {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .week-summary-stat { font-size: 0.8125rem; color: #555; }
    .week-summary-sep  { font-size: 0.8125rem; color: #ccc; }

    /* ── Day section ── */
    .day-section {
      margin-bottom: 0.625rem;
      scroll-margin-top: 1rem;
    }

    .day-section-label {
      font-size: 0.6875rem;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.2rem 0;
      margin-bottom: 0.25rem;
    }

    /* ── Workout row ── */
    .workout-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      margin-bottom: 0.375rem;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
    }

    .workout-row:hover  { background: #f8f9ff; border-color: #b3c0f0; }
    .workout-row:focus  { outline: 2px solid #0070f3; outline-offset: 1px; }

    .wr-date {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 36px;
      flex-shrink: 0;
    }

    .wr-day-num { font-size: 1.4rem; font-weight: 700; line-height: 1; color: #1a1a1a; }
    .wr-day-name { font-size: 0.6875rem; text-transform: uppercase; color: #888; font-weight: 500; }

    .wr-badge {
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .wr-badge--run  { background: #dbeafe; color: #1d4ed8; }
    .wr-badge--lift { background: #ede9fe; color: #6d28d9; }
    .wr-badge--wod  { background: #ffedd5; color: #c2410c; }
    .wr-badge--bike { background: #ccfbf1; color: #0f766e; }

    .wr-content { flex: 1; min-width: 0; }

    .wr-title {
      font-weight: 600;
      font-size: 0.9375rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wr-meta {
      font-size: 0.8125rem;
      color: #6b7280;
      margin-top: 0.1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wr-metric {
      font-size: 0.875rem;
      font-weight: 600;
      color: #374151;
      text-align: right;
      min-width: 72px;
      flex-shrink: 0;
    }

    .tss-pill {
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .tss-grey  { background: #f3f4f6; color: #6b7280; }
    .tss-amber { background: #fef3c7; color: #d97706; }
    .tss-red   { background: #fee2e2; color: #dc2626; }

    .source-pill {
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      border: 1px solid #e5e5e5;
      color: #555;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .wr-chevron { color: #ccc; font-size: 1.25rem; flex-shrink: 0; }

    /* ── States ── */
    .log-state {
      padding: 3rem 1rem;
      text-align: center;
      color: #9ca3af;
      font-size: 0.9375rem;
    }

    .log-empty-state {
      padding: 3rem 1rem;
      text-align: center;
      color: #9ca3af;
      font-size: 0.9375rem;
      background: #fff;
      border: 1px dashed #e5e5e5;
      border-radius: 8px;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      header { padding: 0.75rem 1rem; align-items: flex-start; }
      main { padding: 1rem; }

      .week-pills {
        gap: 0.25rem;
        scroll-snap-type: x proximity;
      }

      .day-pill {
        min-width: 38px;
        padding: 0.35rem 0.375rem;
        scroll-snap-align: start;
      }

      .filter-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 0.5rem;
      }

      .filter-search-wrap { min-width: unset; }

      .filter-chips { flex-wrap: wrap; }

      .date-range-dropdown { right: auto; left: 0; }

      .wr-metric { display: none; }
      .workout-row { padding: 0.6rem 0.75rem; gap: 0.5rem; }

      .week-group-header { flex-direction: column; gap: 0.25rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="log-header-left">
      <h1>Training log</h1>
      <p class="log-sync-sub" id="log-sync-sub">Synced 3 hours ago</p>
    </div>
    <div class="log-header-right">
      <span id="env-label" class="env-label"></span>
      <button id="log-export-btn" class="btn-secondary">Export</button>
      <button id="log-add-btn" class="btn-primary">Log workout</button>
    </div>
  </header>

  <nav class="main-nav">
    <a href="home.html">Home</a>
    <a href="calendar.html">Calendar</a>
    <a href="weight.html">Weight</a>
    <a href="habits.html">Habits</a>
    <a href="training.html">Training</a>
    <a href="log.html" class="active">Log</a>
    <a href="trends.html">Trends</a>
  </nav>

  <main>
    <!-- Week strip -->
    <section class="week-strip-section" aria-label="Week navigator">
      <div class="week-nav">
        <button class="week-nav-btn" id="week-prev-btn" aria-label="Previous week">&#8249;</button>
        <span class="week-label" id="week-label">This week</span>
        <button class="week-nav-btn" id="week-next-btn" aria-label="Next week">&#8250;</button>
      </div>
      <div class="week-pills" id="week-pills" role="list"></div>
    </section>

    <!-- Filter bar -->
    <div class="filter-bar" role="search">
      <div class="filter-search-wrap">
        <input type="text" class="filter-search" id="search-input"
               placeholder="Search workouts…" autocomplete="off" aria-label="Search workouts">
      </div>
      <div class="filter-chips" id="type-filter-chips" role="group" aria-label="Filter by type">
        <button class="filter-chip active" data-type="all">All</button>
        <button class="filter-chip" data-type="run">Run</button>
        <button class="filter-chip" data-type="lift">Lift</button>
        <button class="filter-chip" data-type="wod">WOD</button>
        <button class="filter-chip" data-type="bike">Bike</button>
      </div>
      <div class="date-range-wrap">
        <button class="filter-chip" id="date-range-chip" aria-haspopup="true" aria-expanded="false">Last 30 days &#9662;</button>
        <div class="date-range-dropdown" id="date-range-dropdown" hidden role="dialog" aria-label="Date range options">
          <div class="dr-options">
            <label class="dr-option"><input type="radio" name="dr" value="7d"> Last 7 days</label>
            <label class="dr-option"><input type="radio" name="dr" value="30d" checked> Last 30 days</label>
            <label class="dr-option"><input type="radio" name="dr" value="90d"> Last 90 days</label>
            <label class="dr-option"><input type="radio" name="dr" value="all"> All time</label>
            <label class="dr-option"><input type="radio" name="dr" value="custom"> Custom</label>
          </div>
          <div class="dr-custom" id="dr-custom" hidden>
            <div class="dr-custom-row">
              <label>From<input type="date" id="dr-from"></label>
              <label>To<input type="date" id="dr-to"></label>
            </div>
            <button class="btn-primary" id="dr-apply" style="font-size:0.8125rem;padding:0.35rem 0.75rem;">Apply</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading state -->
    <div id="log-loading" class="log-state" hidden>
      <p>Loading workouts…</p>
    </div>

    <!-- Empty state -->
    <div id="log-empty" class="log-empty-state" hidden>
      No workouts in this range — log one or sync Strava
    </div>

    <!-- Workout list -->
    <div id="workout-list" aria-live="polite"></div>
  </main>

  <script src="js/mock-data.js"></script>
  <script src="js/log.js"></script>
  <script src="js/user.js"></script>
  <script src="js/env.js"></script>
</body>
</html>
