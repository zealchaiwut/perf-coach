<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training log – perf-coach</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* ── App header (top nav) ─────────────────────────────────────────────── */
    .app-header {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0 2rem;
      height: 52px;
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .app-brand {
      font-size: 1rem;
      font-weight: 700;
      color: #1a1a1a;
      text-decoration: none;
      margin-right: 1rem;
      white-space: nowrap;
      letter-spacing: -0.02em;
    }

    .app-brand:hover { opacity: 0.75; }

    .top-nav {
      display: flex;
      align-items: center;
      gap: 0.125rem;
      flex: 1;
      min-width: 0;
    }

    .top-nav-link {
      display: inline-block;
      padding: 0.375rem 0.75rem;
      border-radius: 4px;
      text-decoration: none;
      color: #555;
      font-size: 0.9375rem;
      font-weight: 500;
      white-space: nowrap;
      transition: background 0.1s, color 0.1s;
    }

    .top-nav-link:hover { background: #f5f5f5; color: #1a1a1a; }

    .top-nav-link.active {
      background: #1a1a1a;
      color: #fff;
    }

    .top-nav-more {
      position: relative;
    }

    .top-nav-more-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      padding: 0.375rem 0.75rem;
      background: none;
      border: none;
      border-radius: 4px;
      color: #555;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: background 0.1s, color 0.1s;
    }

    .top-nav-more-btn:hover { background: #f5f5f5; color: #1a1a1a; }

    .top-nav-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      min-width: 148px;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      z-index: 300;
      overflow: hidden;
    }

    .top-nav-dropdown a {
      display: block;
      padding: 0.5rem 1rem;
      color: #333;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: background 0.1s;
    }

    .top-nav-dropdown a:hover { background: #f5f5f5; }

    .app-header-right {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      margin-left: auto;
      flex-shrink: 0;
    }

    .header-search-btn {
      width: 34px;
      height: 34px;
      border: none;
      background: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      padding: 0;
      transition: background 0.1s;
    }

    .header-search-btn:hover { background: #f5f5f5; }

    .header-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #e5e5e5;
      color: #555;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8125rem;
      font-weight: 700;
      user-select: none;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    /* ── Page header ─────────────────────────────────────────────────────── */
    .log-page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.875rem 2rem;
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
    }

    .log-page-header-info { min-width: 0; }

    .log-page-title {
      margin: 0 0 0.2rem;
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .log-subtitle {
      margin: 0;
      font-size: 0.8125rem;
      color: #888;
    }

    .log-page-header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .btn-primary:disabled {
      background: #ccc;
      color: #888;
      cursor: not-allowed;
    }

    .btn-primary:disabled:hover { background: #ccc; }

    /* ── Week strip ── */
    #week-strip {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      padding: 0.75rem 2rem;
    }

    .ws-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .ws-label {
      font-size: 0.8125rem;
      font-weight: 600;
      color: #1a1a1a;
    }

    .ws-chevron {
      background: none;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 0.15rem 0.45rem;
      font-size: 1.125rem;
      line-height: 1;
      cursor: pointer;
      color: #555;
      transition: background 0.1s;
    }

    .ws-chevron:hover { background: #f5f5f5; color: #1a1a1a; }

    .ws-pills {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }

    .ws-pills::-webkit-scrollbar { height: 3px; }
    .ws-pills::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

    .day-pill {
      flex: 1;
      min-width: 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.375rem 0.25rem;
      border-radius: 6px;
      background: #f5f5f5;
      border: 2px solid transparent;
      flex-shrink: 0;
    }

    .day-pill.today {
      background: #eff6ff;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
    }

    .day-name {
      font-size: 0.625rem;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .day-num {
      font-size: 0.9375rem;
      font-weight: 600;
      color: #1a1a1a;
      margin: 0.1rem 0 0.2rem;
      line-height: 1;
    }

    .wd-dots {
      display: flex;
      gap: 2px;
      min-height: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .wd-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Filter bar ── */
    #filter-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.75rem 2rem;
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
    }

    .fb-search-wrap {
      flex: 1 1 180px;
      min-width: 140px;
    }

    #log-search {
      width: 100%;
      padding: 0.4rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.875rem;
      background: #fafafa;
      font-family: inherit;
    }

    #log-search:focus {
      outline: none;
      border-color: #0070f3;
      box-shadow: 0 0 0 2px rgba(0,112,243,0.15);
      background: #fff;
    }

    .fb-chips-row {
      display: flex;
      gap: 0.25rem;
    }

    .type-chip {
      padding: 0.3rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 999px;
      background: #fff;
      color: #555;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }

    .type-chip:hover:not(.active) { background: #f5f5f5; color: #1a1a1a; }

    .type-chip.active {
      background: #1a1a1a;
      color: #fff;
      border-color: #1a1a1a;
    }

    .fb-divider {
      width: 1px;
      height: 22px;
      background: #e0e0e0;
      flex-shrink: 0;
      align-self: center;
    }

    .fb-daterange-wrap { position: relative; }

    .dr-chip {
      padding: 0.3rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 999px;
      background: #fff;
      color: #555;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: background 0.1s, color 0.1s;
    }

    .dr-chip:hover { background: #f5f5f5; color: #1a1a1a; }

    .dr-panel {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      z-index: 100;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      min-width: 200px;
    }

    .dr-panel label {
      font-size: 0.75rem;
      color: #666;
      font-weight: 600;
    }

    .dr-panel input[type="date"] {
      width: 100%;
      padding: 0.35rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.8125rem;
      font-family: inherit;
    }

    .dr-panel input[type="date"]:focus {
      outline: none;
      border-color: #0070f3;
      box-shadow: 0 0 0 2px rgba(0,112,243,0.15);
    }

    .log-loading-indicator {
      font-size: 0.8125rem;
      color: #888;
      margin-left: auto;
    }

    /* ── Log list ── */
    #log-list {
      max-width: 800px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
    }

    .log-empty {
      color: #888;
      font-size: 0.9375rem;
      padding: 2rem 0;
      text-align: center;
    }

    .log-error {
      color: #c0392b;
      font-size: 0.875rem;
      padding: 1rem 0;
      text-align: center;
    }

    /* ── Week group ── */
    .week-group { margin-bottom: 2rem; }

    .week-header {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.3rem 0.75rem;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.04);
      margin-bottom: 0.5rem;
    }

    .week-header-title {
      font-weight: 700;
      font-size: 0.8125rem;
      letter-spacing: 0.04em;
      color: #1a1a1a;
    }

    .week-header-range {
      font-size: 0.8125rem;
      color: #666;
    }

    .week-header-summary {
      font-size: 0.8125rem;
      color: #888;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .summary-sep { color: #bbb; }

    /* ── Week card (wraps all rows in the week) ── */
    .week-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      overflow: hidden;
    }

    .week-card > .entry-row {
      border: none;
      border-bottom: 1px solid #f0f0f0;
      border-radius: 0;
      margin-bottom: 0;
    }

    .week-card > .entry-row:last-child,
    .week-card > .rest-day-row:last-child {
      border-bottom: none;
    }

    .week-card > .rest-day-row {
      border-bottom: 1px solid #f0f0f0;
      border-radius: 0;
      margin-bottom: 0;
    }

    /* ── Entry row ── */
    .entry-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0.75rem;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      margin-bottom: 0.4rem;
      cursor: pointer;
      transition: background 0.1s;
      border-left: 3px solid transparent;
    }

    .entry-row:hover { background: #fafafa; }

    .entry-row.is-active {
      background: #eff6ff;
      border-left-color: #3b82f6;
    }

    .entry-date {
      flex-shrink: 0;
      text-align: center;
      width: 2rem;
    }

    .entry-day-num {
      font-size: 1.125rem;
      font-weight: 700;
      line-height: 1.1;
      color: #1a1a1a;
    }

    .entry-day-name {
      font-size: 0.6875rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .entry-badge {
      flex-shrink: 0;
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: #e5e5e5;
      color: #555;
    }

    .entry-badge--run  { background: #dbeafe; color: #1d4ed8; }
    .entry-badge--lift { background: #ede9fe; color: #6d28d9; }
    .entry-badge--wod  { background: #fef3c7; color: #b45309; }
    .entry-badge--bike { background: #ccfbf1; color: #0f766e; }

    .entry-body { flex: 1; min-width: 0; }

    .entry-title {
      font-size: 0.9375rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .entry-meta {
      font-size: 0.8125rem;
      color: #888;
      margin-top: 0.1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .entry-metric {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      white-space: nowrap;
    }

    .entry-metric-primary {
      font-size: 0.875rem;
      font-weight: 600;
      color: #1a1a1a;
    }

    .entry-metric-secondary {
      font-size: 0.75rem;
      color: #888;
      margin-top: 0.05rem;
    }

    .tss-pill {
      flex-shrink: 0;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
    }

    .tss-low  { background: #f5f5f5; color: #555; }
    .tss-mid  { background: #fef3c7; color: #92400e; }
    .tss-high { background: #fee2e2; color: #991b1b; }

    /* ── Source badges ── */
    .source-badges-wrap {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .source-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      line-height: 1;
    }

    .source-badge--strava { background: #fc4c02; color: #fff; }
    .source-badge--stryd  { background: #f97316; color: #fff; }
    .source-badge--manual { background: #e5e5e5; color: #555; }

    /* ── Rest day row ── */
    .rest-day-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0.75rem;
      background: #f8fafc;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      margin-bottom: 0.4rem;
      cursor: default;
    }

    .rest-moon-icon {
      flex-shrink: 0;
      font-size: 1rem;
      line-height: 1;
    }

    .rest-metrics {
      flex: 1;
      min-width: 0;
    }

    .rest-day-label {
      font-size: 0.875rem;
      color: #9ca3af;
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Skeleton loading ── */
    @keyframes skeleton-shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position:  400px 0; }
    }

    .skeleton-row {
      height: 64px;
      border-radius: 6px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
      background-size: 400px 100%;
      animation: skeleton-shimmer 1.4s ease infinite;
      margin-bottom: 0.4rem;
    }

    .skeleton-stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-top: 0.75rem;
      padding: 0 1.25rem;
    }

    .skeleton-stat-bar {
      height: 48px;
      border-radius: 4px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
      background-size: 400px 100%;
      animation: skeleton-shimmer 1.4s ease infinite;
    }

    /* ── Error / empty states ── */
    .list-error-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: #555;
      max-width: 800px;
      margin: 0 auto;
    }

    .list-error-state p {
      margin: 0 0 0.75rem;
      font-size: 0.9375rem;
    }

    .detail-error-state {
      text-align: center;
      padding: 2rem 1.25rem;
      color: #555;
    }

    .detail-error-state p {
      margin: 0 0 0.75rem;
      font-size: 0.9375rem;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      max-width: 800px;
      margin: 0 auto;
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.4;
    }

    .empty-state p {
      color: #888;
      font-size: 0.9375rem;
      margin: 0 0 1.25rem;
    }

    /* ── Detail panel overlay ── */
    .detail-panel-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .detail-panel-overlay.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    /* ── Detail panel ── */
    .detail-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 380px;
      max-width: 100vw;
      background: #fff;
      box-shadow: -4px 0 24px rgba(0,0,0,0.12);
      z-index: 201;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.25s ease;
    }

    .detail-panel.is-open { transform: translateX(0); }

    .detail-panel-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #e5e5e5;
      flex-shrink: 0;
    }

    .detail-header-top {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .detail-header-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.25rem;
      flex-wrap: wrap;
    }

    .detail-close-btn {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 1.25rem;
      color: #555;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      padding: 0;
      transition: background 0.1s;
    }

    .detail-close-btn:hover { background: #f5f5f5; }

    .detail-panel-title {
      margin: 0;
      font-size: 1.0625rem;
      font-weight: 600;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .detail-panel-date {
      font-size: 0.8125rem;
      color: #888;
    }

    .detail-source-pill {
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      background: #e5e5e5;
      color: #555;
    }

    .detail-source-pill--strava {
      background: #fc4c02;
      color: #fff;
    }

    .detail-panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
    }

    .detail-panel-footer {
      display: flex;
      gap: 0.5rem;
      padding: 1rem 1.25rem;
      border-top: 1px solid #e5e5e5;
      flex-shrink: 0;
    }

    /* ── Detail content ── */
    .detail-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .detail-stat {
      padding: 0.6rem 0.75rem;
      background: #fafafa;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
    }

    .detail-stat-label {
      display: block;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #888;
      margin-bottom: 0.2rem;
    }

    .detail-stat-value {
      display: block;
      font-size: 1.0625rem;
      font-weight: 600;
      color: #1a1a1a;
    }

    .detail-section-title {
      font-size: 0.8125rem;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 1rem 0 0.35rem;
    }

    .detail-notes-body {
      font-size: 0.9375rem;
      margin: 0;
      line-height: 1.5;
      color: #333;
    }

    .exercises-section { margin-bottom: 0.25rem; }

    .exercise-item {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.35rem 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .exercise-item:last-child { border-bottom: none; }

    .exercise-name {
      font-size: 0.9375rem;
      color: #1a1a1a;
      flex: 1;
      min-width: 0;
    }

    .exercise-meta {
      font-size: 0.8125rem;
      color: #888;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Responsive ≤ 880px ── */
    @media (max-width: 880px) {
      .log-page-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .fb-chips-row {
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 2px;
      }

      .fb-chips-row::-webkit-scrollbar { height: 3px; }
      .fb-chips-row::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
    }

    @media (max-width: 767px) {
      .detail-panel { width: 100%; }

      .detail-close-btn {
        width: 44px;
        height: 44px;
        min-width: 44px;
        min-height: 44px;
      }
    }

    @media (max-width: 599px) {
      .app-header { padding: 0 1rem; }
      .log-page-header { padding: 0.75rem 1rem; }
      #week-strip { padding: 0.75rem 1rem; }
      #filter-bar { padding: 0.75rem 1rem; flex-direction: column; align-items: stretch; }
      .fb-search-wrap { flex: none; }
      .dr-panel { left: 0; right: 0; }
      #log-list { padding: 1rem; }

      .entry-metric { display: none; }
      .source-badges-wrap { display: none; }

      .day-pill { min-width: 40px; padding: 0.35rem; }
    }

    @media (max-width: 380px) {
      .entry-row { flex-wrap: wrap; gap: 0.5rem; }
      .entry-date  { order: 1; }
      .entry-badge { order: 2; }
      .entry-body  { order: 3; flex-basis: 100%; }
      .entry-metric { order: 4; flex-basis: 100%; }
      .tss-pill, .source-badges-wrap { order: 5; }
    }
  </style>
</head>
<body>

  <!-- Top navigation -->
  <header class="app-header">
    <a href="home.html" class="app-brand">perf-coach</a>

    <nav class="top-nav" aria-label="Main navigation">
      <a href="home.html" class="top-nav-link">Home</a>
      <a href="log" class="top-nav-link active">Log</a>
      <a href="habits.html" class="top-nav-link">Habits</a>
      <a href="trends.html" class="top-nav-link">Trends</a>

      <div class="top-nav-more">
        <button class="top-nav-more-btn" id="top-nav-more-btn"
                aria-haspopup="true" aria-expanded="false" type="button">
          More ▾
        </button>
        <div class="top-nav-dropdown" id="top-nav-dropdown" hidden>
          <a href="weight.html">Weight</a>
          <a href="calendar.html">Calendar</a>
          <a href="training.html">Training</a>
          <a href="users.html">Users</a>
        </div>
      </div>
    </nav>

    <div class="app-header-right">
      <button class="header-search-btn" aria-label="Search" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      <div class="header-avatar" id="header-avatar" aria-label="User avatar">U</div>
    </div>
    <span id="env-label" class="env-label"></span>
  </header>

  <!-- Page header: title, stats subtitle, action buttons -->
  <div class="log-page-header">
    <div class="log-page-header-info">
      <h1 class="log-page-title">Training log</h1>
      <p class="log-subtitle" id="log-subtitle">Loading…</p>
    </div>
    <div class="log-page-header-actions">
      <button id="log-export-btn" class="btn-secondary">Export CSV</button>
      <button id="log-new-btn" class="btn-primary" disabled
              title="Coming soon — modal not built yet">Log workout</button>
    </div>
  </div>

  <!-- Week strip (JS renders into this) -->
  <div id="week-strip"></div>

  <!-- Filter bar (JS renders into this) -->
  <div id="filter-bar"></div>

  <!-- Workout list -->
  <div id="log-list"></div>

  <div id="log-error-msg" style="display:none" class="list-error-state" role="alert">
    <p>Couldn't load workouts.</p>
    <button id="log-retry-btn" class="btn-sm">Retry</button>
  </div>

  <div id="log-empty-msg" style="display:none" class="empty-state">
    <div class="empty-state-icon">🏃</div>
    <p>No workouts logged yet. Start tracking your training!</p>
    <button id="log-empty-cta" class="btn-primary">Log your first workout</button>
  </div>

  <!-- Detail panel backdrop -->
  <div id="detail-overlay" class="detail-panel-overlay" aria-hidden="true"></div>

  <!-- Workout detail panel -->
  <aside id="detail-panel" class="detail-panel" role="dialog" aria-modal="true"
         aria-labelledby="detail-panel-title-text">
    <div class="detail-panel-header">
      <div class="detail-header-top">
        <h2 class="detail-panel-title" id="detail-panel-title-text">Workout</h2>
        <button id="detail-close-btn" class="detail-close-btn"
                aria-label="Close workout details">&#x2715;</button>
      </div>
      <div class="detail-header-meta">
        <span id="detail-panel-date" class="detail-panel-date"></span>
        <span id="detail-panel-source-pill" class="detail-source-pill" hidden></span>
      </div>
    </div>

    <div id="detail-panel-loading" style="display:none" aria-busy="true">
      <div style="padding:1.25rem">
        <div class="skeleton-row" style="width:65%;height:24px;margin-bottom:0.75rem"></div>
        <div class="skeleton-stat-grid" style="padding:0">
          <div class="skeleton-stat-bar"></div>
          <div class="skeleton-stat-bar"></div>
          <div class="skeleton-stat-bar"></div>
          <div class="skeleton-stat-bar"></div>
        </div>
      </div>
    </div>

    <div id="detail-panel-error" style="display:none" class="detail-error-state" role="alert">
      <p>Couldn't load workout.</p>
      <button id="detail-retry-btn" class="btn-sm">Retry</button>
    </div>

    <div id="detail-panel-content" class="detail-panel-body"></div>

    <div class="detail-panel-footer">
      <a id="detail-edit-btn" class="btn-secondary" href="#">Edit</a>
      <a id="detail-strava-btn" style="display:none" class="btn-secondary"
         href="#" target="_blank" rel="noopener">View on Strava</a>
    </div>
  </aside>

  <script src="js/training-log.js"></script>
  <script src="js/user.js"></script>
  <script src="js/env.js"></script>
</body>
</html>
