<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training log – perf-coach</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .log-subtitle {
      margin: 0;
      font-size: 0.75rem;
      color: #888;
    }

    .log-header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    #week-strip {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      padding: 0.75rem 2rem;
    }

    .ws-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .ws-label {
      font-size: 0.8125rem;
      font-weight: 600;
      color: #1a1a1a;
    }

    .ws-chevron {
      background: none;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 0.15rem 0.45rem;
      font-size: 1.125rem;
      line-height: 1;
      cursor: pointer;
      color: #555;
    }

    .ws-chevron:hover {
      background: #f5f5f5;
      color: #1a1a1a;
    }

    .ws-pills {
      display: flex;
      gap: 4px;
    }

    .day-pill {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.375rem 0.125rem;
      border-radius: 6px;
      background: #f5f5f5;
      border: 2px solid transparent;
    }

    .day-pill.today {
      background: #eff6ff;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
    }

    .day-name {
      font-size: 0.625rem;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .day-num {
      font-size: 0.9375rem;
      font-weight: 600;
      color: #1a1a1a;
      margin: 0.1rem 0 0.2rem;
      line-height: 1;
    }

    .wd-dots {
      display: flex;
      gap: 2px;
      min-height: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .wd-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    #filter-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.75rem 2rem;
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
    }

    #log-list {
      max-width: 800px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
    }

    @media (max-width: 599px) {
      header { padding: 0.75rem 1rem; }
      .main-nav { overflow-x: auto; padding: 0.75rem 1rem; }
      #week-strip { padding: 0.75rem 1rem; }
      #filter-bar { padding: 0.75rem 1rem; flex-direction: column; align-items: stretch; }
      #log-list { padding: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Training log</h1>
      <p class="log-subtitle">Manual entry &middot; last updated just now</p>
    </div>
    <div class="log-header-actions">
      <button id="log-export-btn" class="btn-secondary">Export</button>
      <button id="log-new-btn" class="btn-primary">Log workout</button>
      <span id="env-label" class="env-label"></span>
    </div>
  </header>

  <nav class="main-nav">
    <a href="home.html">Home</a>
    <a href="calendar.html">Calendar</a>
    <a href="weight.html">Weight</a>
    <a href="habits.html">Habits</a>
    <a href="training.html">Training</a>
    <a href="log" class="active">Log</a>
    <a href="trends.html">Trends</a>
  </nav>

  <div id="week-strip"></div>

  <div id="filter-bar"></div>

  <div id="log-list"></div>

  <script src="js/training-log.js"></script>
  <script src="js/user.js"></script>
  <script src="js/env.js"></script>
</body>
</html>
